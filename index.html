// ═══ PDF: ANALISE DO PAGAMENTO DO PREMIO CARTAO TIMBÓ ═══
function gerarAnalisePDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF)){alert("A biblioteca de PDF ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  if(typeof Chart==="undefined"){alert("A biblioteca de graficos ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  var st=window._relStats;if(!st){alert("Abra a tela Dashboard Individual do Prêmio antes de gerar o PDF.");return;}
  var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"landscape",compress:true});
  var W=297,H=210,mg=12,cw=W-mg*2,BANDH=27,PX=7;
  var C={ink:[10,31,74],b:[0,52,143],bl:[30,91,198],red:[192,57,43],grn:[26,122,74],gld:[230,168,23],pur:[123,63,160],org:[211,84,0],line:[226,231,238],txt:[60,60,60],mut:[140,140,140]};
  function fill(c){doc.setFillColor(c[0],c[1],c[2]);}
  function txt(c){doc.setTextColor(c[0],c[1],c[2]);}
  function font(sz,b){doc.setFont("helvetica",b?"bold":"normal");doc.setFontSize(sz);}
  var titulo="Análise do Pagamento do Prêmio Cartão Timbó";
  var agora=new Date(),gerado=agora.toLocaleDateString("pt-BR")+" às "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  var periodo=(st.modo==="mes"?"Período: ":"Período: ")+st.per+(st.empNome?"  |  Colaborador: "+st.empNome:"  |  Todos os colaboradores");

  function header(){
    fill([255,255,255]);doc.rect(0,0,W,BANDH,"F");
    if(window._logoPNG){doc.addImage(window._logoPNG,"PNG",mg-1.5,6.5,30.8,14);}
    else{font(18,true);txt(C.b);doc.text("TIMBÓ",mg,16);}
    font(15,true);txt(C.ink);doc.text(titulo,W-mg,11.5,{align:"right"});
    font(8.5);txt([95,105,120]);doc.text(periodo,W-mg,17.5,{align:"right"});
    font(7);txt([150,158,170]);doc.text("Gerado em "+gerado,W-mg,22,{align:"right"});
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.4);doc.line(mg,BANDH,W-mg,BANDH);
    return BANDH+8;
  }
  function section(t,y,c){fill(c||C.b);doc.rect(mg,y-3.1,2.2,2.2,"F");font(10.5,true);txt([45,45,45]);doc.text(t,mg+4.5,y);}
  function panel(x,y,w,h){doc.setFillColor(255,255,255);doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.35);doc.roundedRect(x,y,w,h,2,2,"FD");}
  function kpi(x,y,w,h,lb,val,sub,c){
    panel(x,y,w,h);fill(c);doc.rect(x,y,w,1.2,"F");
    font(6.8,true);txt(C.mut);doc.text(lb.toUpperCase(),x+3,y+6.5);
    font(12.5,true);txt(c);doc.text(val,x+3,y+13.5);
    if(sub){font(6.8);txt(C.mut);doc.text(sub,x+3,y+18);}
  }
  function chartImg(cfg,wmm,hmm){
    if(!cfg)return null;
    var cv=document.createElement("canvas");cv.width=Math.round(wmm*PX);cv.height=Math.round(hmm*PX);
    cv.style.position="fixed";cv.style.left="-99999px";document.body.appendChild(cv);
    var ch=new Chart(cv,cfg);var img=ch.toBase64Image();ch.destroy();cv.remove();
    return img;
  }
  function chartPanel(cfg,x,y,w,h,t,c,nota){
    panel(x,y,w,h);
    font(9,true);txt(c);doc.text(t,x+4,y+6.5);
    if(nota){font(7);txt(C.mut);doc.text(nota,x+w-4,y+6.5,{align:"right"});}
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x+4,y+8.8,x+w-4,y+8.8);
    var aw=w-8,ah=h-13;
    var img=chartImg(cfg,aw,ah);
    if(!img){font(8.5);txt([185,185,185]);doc.text("Sem dados no período",x+w/2,y+h/2,{align:"center"});return;}
    doc.addImage(img,"PNG",x+4,y+10.5,aw,ah);
  }
  // Tabela com quebra de pagina
  function table(y,cols,rows,opt){
    opt=opt||{};var rh=opt.rh||5.6,x=mg,tw=cols.reduce(function(a,c){return a+c.w;},0);
    function head(){
      fill(C.b);doc.rect(x,y,tw,rh+.6,"F");font(7.3,true);txt([255,255,255]);
      var cx=x;cols.forEach(function(c){doc.text(c.h,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y+rh/2+1.6,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});cx+=c.w;});
      y+=rh+.6;
    }
    head();
    rows.forEach(function(r,i){
      if(y+rh>H-14){doc.addPage();y=header();if(opt.titulo)section(opt.titulo+" (continuação)",y,opt.cor);y+=4;head();}
      if(r._total){fill(r._grand?[200,215,238]:[226,236,246]);doc.rect(x,y,tw,rh+.4,"F");}
      else if(r._bg){fill(r._bg);doc.rect(x,y,tw,rh,"F");}
      else if(r._hl){fill([227,240,250]);doc.rect(x,y,tw,rh,"F");}
      else if(i%2===1){fill([248,250,252]);doc.rect(x,y,tw,rh,"F");}
      var cx=x;
      cols.forEach(function(c){
        var v=r[c.k];v=v===undefined||v===null?"":String(v);
        var mw=c.w-3;
        font(7.2,r._total||r._hl||c.b);
        while(v.length>3&&doc.getTextWidth(v)>mw)v=v.slice(0,-2);
        var cor=c.cor?c.cor(r):C.txt;txt(r._total&&!c.cor?C.b:cor);
        doc.text(v,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y+rh/2+1.5,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});
        cx+=c.w;
      });
      y+=r._total?rh+.4:rh;
    });
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x,y,x+tw,y);
    return y;
  }

  var P=st.P,A=st.acum;
  // ===== PAGINA 1 =====
  var y=header();
  section("Indicadores - "+st.per,y);y+=3.5;
  var ks=[
    ["Prêmio previsto",fmtBRL(P.pot),st.per,C.b],
    ["Total pago",fmtBRL(P.pago),P.linhas.length+" colaboradores",C.grn],
    ["Total perdido",fmtBRL(P.perd),pct1(P.pctPerda)+" do previsto",C.red],
    ["% de ganho",pct1(P.pctGanho),P.ok+" com 100% do prêmio",C.grn],
    ["Perda com faltas",fmtBRL(P.lf),P.nf+" faltas",C.red],
    ["Absenteísmo",pct1(P.abs),P.absF+" faltas no período",C.org]
  ];
  var gap=3.2,kw=(cw-gap*5)/6,kh=21;
  ks.forEach(function(k,i){kpi(mg+i*(kw+gap),y,kw,kh,k[0],k[1],k[2],k[3]);});
  y+=kh+8;
  section("Evolução mês a mês - "+st.selAno,y);y+=3.5;
  var chH=(H-12-y-4)/2;
  chartPanel(st.anoD.length?relCfgGP(st.labels,st.anoD,1.9,st.selIdx):null,mg,y,cw,chH,"Ganho x Perda mês a mês (R$) e % de ganho",C.grn,"Acumulado: pago "+fmtBRL(A.pago)+"  |  perdido "+fmtBRL(A.perd)+"  |  ganho "+pct1(A.pctGanho));
  y+=chH+3;
  chartPanel(st.anoD.length?relCfgPerdas(st.labels,st.anoD,1.9,st.selIdx):null,mg,y,cw,chH,"Perdas com faltas, atrasos e 5S (R$) e absenteísmo",C.red,"Acumulado: perda com faltas "+fmtBRL(A.lf)+"  |  absenteísmo "+pct1(A.abs));

  // ===== PAGINA 2 =====
  doc.addPage();y=header();
  section("Composição das perdas e colaboradores - "+st.per,y,C.red);y+=3.5;
  var pH=66,lw=cw*0.36;
  chartPanel(relCfgComp(P,1.6),mg,y,lw,pH,"Composição das perdas",C.red);
  chartPanel(relCfgColab(P,1.35,10),mg+lw+gap,y,cw-lw-gap,pH,"Maiores perdas por colaborador",C.red,"R$ perdido  ·  % do prêmio");
  y+=pH+8;
  section("Resumo mês a mês - "+st.selAno,y);y+=3;
  var gC=function(){return C.grn;},rC=function(){return C.red;},oC=function(){return C.org;};
  var colsR=[
    {h:"Mês",k:"mes",w:30,b:true,cor:function(){return C.b;}},{h:"Previsto",k:"pot",w:26,al:"r"},{h:"Pago",k:"pago",w:26,al:"r",cor:gC},
    {h:"Perdido",k:"perd",w:26,al:"r",cor:rC},{h:"% Ganho",k:"pg",w:19,al:"r",cor:gC},{h:"% Perda",k:"pp",w:19,al:"r",cor:rC},
    {h:"Perda faltas",k:"lf",w:25,al:"r",cor:rC},{h:"Perda atrasos",k:"la",w:25,al:"r"},{h:"Perda 5S",k:"ls",w:21,al:"r"},
    {h:"Faltas",k:"nf",w:13,al:"c"},{h:"Atrasos",k:"na",w:14,al:"c"}
  ];
  colsR.push({h:"Absenteísmo",k:"abs",w:cw-colsR.reduce(function(a,c){return a+c.w;},0),al:"r",cor:oC});
  function rowR(d,lb){return{mes:lb,pot:fmtBRL(d.pot),pago:fmtBRL(d.pago),perd:fmtBRL(d.perd),pg:pct1(d.pctGanho),pp:pct1(d.pctPerda),lf:fmtBRL(d.lf),la:fmtBRL(d.la),ls:fmtBRL(d.ls),nf:d.nf,na:d.na,abs:pct1(d.abs)};}
  var rowsR=st.anoD.map(function(d,i){var r=rowR(d,fmtM(d.m));r._hl=i===st.selIdx;return r;});
  var tr=rowR(A,"Acumulado "+st.selAno);tr._total=true;rowsR.push(tr);
  table(y,colsR,rowsR,{rh:5.3,titulo:"Resumo mês a mês - "+st.selAno});

  // ===== PAGINA 3+ : colaboradores =====
  doc.addPage();y=header();
  section("Pagamento Cartão Benefício por colaborador - "+st.per,y);y+=3;
  var colsC=[
    {h:"Colaborador",k:"nome",w:62,b:true,cor:function(){return C.b;}},{h:"Função",k:"func",w:40},{h:"C.C. Senior",k:"cc",w:17,al:"c"},
    {h:"Faltas",k:"f",w:13,al:"c",cor:rC},{h:"Atrasos",k:"a",w:14,al:"c",cor:function(){return [184,130,10];}},{h:"5S",k:"s",w:10,al:"c",cor:function(){return C.pur;}},
    {h:"% Desc.",k:"pct",w:17,al:"r",cor:rC},{h:"Prêmio",k:"val",w:26,al:"r"},{h:"Desconto",k:"desc",w:26,al:"r",cor:rC},
    {h:"A Receber",k:"rec",w:26,al:"r",b:true,cor:gC},{h:"% Ganho",k:"g",w:cw-62-40-17-13-14-10-17-26*3,al:"r",cor:gC}
  ];
  var rowsC=P.linhas.slice().sort(function(a,b){return a.emp.nome.localeCompare(b.emp.nome);}).map(function(x){
    var cc=x.emp.ccid?DB.cc.find(function(c){return c.id===x.emp.ccid;}):null;
    return{nome:x.emp.nome,func:x.emp.func,cc:cc?cc.cod:"-",f:x.f,a:x.a,s:x.s,pct:pct1(x.pct),val:fmtBRL(x.val),desc:x.desc>0.004?"-"+fmtBRL(x.desc):"-",rec:fmtBRL(x.rec),g:pct1(x.val>0?x.rec/x.val*100:0)};
  });
  rowsC.push({_total:true,nome:"TOTAIS ("+P.linhas.length+")",func:"",cc:"",f:P.nf,a:P.na,s:P.ns,pct:pct1(P.pctPerda),val:fmtBRL(P.pot),desc:"-"+fmtBRL(P.perd),rec:fmtBRL(P.pago),g:pct1(P.pctGanho)});
  if(P.linhas.length===0){font(9);txt([170,170,170]);doc.text("Nenhum colaborador com prêmio no período.",mg,y+8);}
  else table(y,colsC,rowsC,{rh:5.8,titulo:"Pagamento Cartão Benefício por colaborador - "+st.per});

  // Rodapes com numeracao
  var n=doc.getNumberOfPages();
  for(var p=1;p<=n;p++){
    doc.setPage(p);
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.3);doc.line(mg,H-9,W-mg,H-9);

// ANIVERSARIOS — parabens, calendario e PDF
// ═══════════════════════════════════════
var MOSF=["Janeiro","Fevereiro","Marco","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

// Eventos (tempo de empresa + aniversario de vida) de um mes/ano
function anivDoMes(ano,mesIdx){
  var mm=String(mesIdx+1).padStart(2,"0"),emp=[],vida=[];
  DB.emp.filter(ativoVis).forEach(function(e){
    if(e.adm&&e.adm.slice(5,7)===mm){
      var a=ano-parseInt(e.adm.slice(0,4),10);
      if(a>=1)emp.push({e:e,dia:parseInt(e.adm.slice(8,10),10),anos:a,data:e.adm});
    }
    if(e.aniv&&e.aniv.slice(5,7)===mm){
      vida.push({e:e,dia:parseInt(e.aniv.slice(8,10),10),anos:ano-parseInt(e.aniv.slice(0,4),10),data:e.aniv});
    }
  });
  var ord=function(a,b){return a.dia-b.dia||a.e.nome.localeCompare(b.e.nome);};
  emp.sort(ord);vida.sort(ord);
  return {empresa:emp,vida:vida};
}

// ── TELA DE PARABENS (Task 2) ──
function checkAniversarios(){
  var hj=hoje(),mm=mmdd(hj),ano=parseInt(hj.slice(0,4),10),evs=[];
  DB.emp.filter(ativoVis).forEach(function(e){
    if(e.adm&&mmdd(e.adm)===mm){var a=ano-parseInt(e.adm.slice(0,4),10);if(a>=1)evs.push({e:e,tipo:"empresa",anos:a});}
    if(e.aniv&&mmdd(e.aniv)===mm){evs.push({e:e,tipo:"vida",anos:ano-parseInt(e.aniv.slice(0,4),10)});}
  });
  if(!evs.length)return;
  evs.sort(function(a,b){return a.e.nome.localeCompare(b.e.nome);});
  var temEmp=evs.some(function(x){return x.tipo==="empresa";}),temVida=evs.some(function(x){return x.tipo==="vida";});
  var subt=temEmp&&temVida?"Aniversario de vida e de tempo de empresa hoje":temVida?"Aniversario de vida hoje":"Aniversario de tempo de empresa hoje";
  var rows=evs.map(function(x){
    var tag=x.tipo==="empresa"
      ?"<span class='aniv-tag emp'><i class='ti ti-building'></i> "+x.anos+" ano"+(x.anos>1?"s":"")+" de Timbó</span>"
      :"<span class='aniv-tag vida'><i class='ti ti-cake'></i> "+x.anos+" ano"+(x.anos!==1?"s":"")+"</span>";
    return "<div class='aniv-row'><div class='aniv-av'>"+ini(x.e.nome)+"</div>"
      +"<div style='min-width:0'><div class='aniv-nm'>"+esc(x.e.nome)+"</div>"
      +"<div class='aniv-fn'>"+esc(x.e.func)+"</div>"+tag+"</div></div>";
  }).join("");
  closeAniv();
  var div=document.createElement("div");div.className="aniv-bg";div.id="md-aniv";
  div.innerHTML="<div class='aniv-card' role='dialog' aria-modal='true'>"
    +"<div class='aniv-hd'><div class='ic'><i class='ti ti-confetti'></i></div>"
    +"<h2>Parabens!</h2><p>"+subt+"</p></div>"
    +"<div class='aniv-bd'>"+rows+"</div>"
    +"<div class='aniv-ft'><button onclick='closeAniv()'><i class='ti ti-check' style='margin-right:5px'></i>Fechar</button></div>"
    +"</div>";
  document.body.appendChild(div);
}
function closeAniv(){var m=document.getElementById("md-aniv");if(m)m.remove();}

// ── CALENDARIO DE ANIVERSARIOS (Task 3) ──
function rCal(){
  var now=new Date();
  var selAno=parseInt(gv("cal-ano"),10);if(isNaN(selAno))selAno=now.getFullYear();
  var selMes=gv("cal-mes");selMes=selMes===""?now.getMonth():parseInt(selMes,10);
  if(isNaN(selMes))selMes=now.getMonth();

  var anoAtual=now.getFullYear(),anos=[];
  for(var y=anoAtual-3;y<=anoAtual+2;y++)anos.push(y);
  var anoOpts=anos.map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");
  var mesOpts=MOSF.map(function(m,i){return "<option value='"+i+"'"+(i===selMes?" selected":"")+">"+m+"</option>";}).join("");

  var ev=anivDoMes(selAno,selMes);
  var porDia={};

// ── PDF: ANIVERSARIANTES DO MES (Task 6) ──
function gerarAniversariantesPDF(){
  var now=new Date();
  var selAno=parseInt(gv("cal-ano"),10);if(isNaN(selAno))selAno=now.getFullYear();
  var selMes=gv("cal-mes");selMes=selMes===""?now.getMonth():parseInt(selMes,10);if(isNaN(selMes))selMes=now.getMonth();

  if(!ev.empresa.length&&!ev.vida.length){alert("Nao ha aniversariantes em "+MOSF[selMes]+"/"+selAno+".");return;}

  var K=mkPdfKit("Aniversariantes do Mes",MOSF[selMes]+" / "+selAno),doc=K.doc,C=K.C;

  K.kpi(K.mg+cw+8,y,cw,20,"Aniversario de vida",String(ev.vida.length),ev.vida.length===1?"colaborador":"colaboradores",C.grn);

      {h:"Dia",k:"dia",w:16,al:"c",b:true},
      {h:"Colaborador",k:"nome",w:88,b:true},
      {h:"Funcao",k:"func",w:70},

      {h:"Admissao",k:"adm",w:32,al:"c"},

    ];
    var rowsE=ev.empresa.map(function(x){return {dia:String(x.dia).padStart(2,"0"),nome:x.e.nome,func:x.e.func,cc:ccCod(x.e),adm:fmtD(x.data),anos:x.anos+" ano"+(x.anos>1?"s":"")};});
    y=K.table(y,colsE,rowsE,{rh:5.8,titulo:"Aniversario de tempo de empresa",cor:C.bl});
  }else{K.font(8.5);K.txt([170,170,170]);doc.text("Nenhum aniversario de tempo de empresa neste mes.",K.mg,y+6);y+=10;}
  y+=8;

  // Secao 2 — Aniversario de vida (verde)
  if(y>K.H-40){doc.addPage();y=K.header();}
  K.section("Aniversario de vida - "+MOSF[selMes]+"/"+selAno,y,C.grn);y+=4;
  if(ev.vida.length){
    var colsV=[
      {h:"Dia",k:"dia",w:16,al:"c",b:true},
      {h:"Colaborador",k:"nome",w:88,b:true},
      {h:"Funcao",k:"func",w:70},
      {h:"C.C. Senior",k:"cc",w:26,al:"c"},
      {h:"Data",k:"data",w:32,al:"c"},
      {h:"Idade",k:"anos",w:K.cw-16-88-70-26-32,al:"c",b:true,cor:function(){return C.grn;}}
    ];
    var rowsV=ev.vida.map(function(x){return {dia:String(x.dia).padStart(2,"0"),nome:x.e.nome,func:x.e.func,cc:ccCod(x.e),data:fmtD(x.data),anos:(x.anos>=0?x.anos+" anos":"-")};});
    y=K.table(y,colsV,rowsV,{rh:5.8,titulo:"Aniversario de vida",cor:C.grn});

// BACKUP AUTOMATICO
// Copias ficam no proprio Supabase (tabela timbo_dados, linhas bkp_*),
// 1 automatica por dia no primeiro acesso, guardando as ultimas BKP_MAX.
// ═══════════════════════════════════════
var BKP_MAX=30,BKP_LISTA=null,BKP_ERRO="";
function bkpDocs(){return _db.collection("timbo");}
function bkpNovoId(){
  var d=new Date(),z=function(n){return String(n).padStart(2,"0");};
  return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"_"+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds());
}
function bkpDataId(id){return id.slice(6,8)+"/"+id.slice(4,6)+"/"+id.slice(0,4)+" "+id.slice(9,11)+":"+id.slice(11,13);}
function bkpTam(n){return n>=1048576?(n/1048576).toLocaleString("pt-BR",{maximumFractionDigits:1})+" MB":Math.max(1,Math.round(n/1024))+" KB";}
function bkpListar(){
  return bkpDocs().doc("_backups").get().then(function(s){BKP_LISTA=s.exists?(s.data().lista||[]):[];return BKP_LISTA;});
}
function bkpCriar(tipo){
  if(!window._dbLoaded)return Promise.reject(new Error("Os dados ainda nao foram carregados."));
  var id=bkpNovoId(),snap=JSON.parse(JSON.stringify(DB)),cont={};
  COLECOES.forEach(function(c){cont[c]=(snap[c]||[]).length;});
  var meta={id:id,criado:new Date().toISOString(),tipo:tipo,cont:cont,tam:JSON.stringify(snap).length};
  return Promise.all(COLECOES.map(function(c){
    return bkpDocs().doc("bkp_"+id+"_"+c).set({dados:snap[c]||[],criado:meta.criado});
  })).then(bkpListar).then(function(lista){
    lista=lista.filter(function(x){return x.id!==id;});
    lista.unshift(meta);
    var sobra=lista.slice(BKP_MAX);lista=lista.slice(0,BKP_MAX);
    return bkpDocs().doc("_backups").set({lista:lista,atualizado:meta.criado}).then(function(){
      BKP_LISTA=lista;
      return Promise.all(sobra.map(function(r){return bkpApagarDocs(r.id);}));
    });
  }).then(function(){return meta;});
}
function bkpApagarDocs(id){
  return Promise.all(COLECOES.map(function(c){return bkpDocs().doc("bkp_"+id+"_"+c).delete().catch(function(){});}));
}
function bkpLer(id){
  return Promise.all(COLECOES.map(function(c){return bkpDocs().doc("bkp_"+id+"_"+c).get();})).then(function(snaps){
    var dados={};
    snaps.forEach(function(s,i){if(s.exists)dados[COLECOES[i]]=s.data().dados||[];});
    return dados;
  });
}
// Backup automatico: 1 por dia, no primeiro acesso
function autoBackup(){
  if(!window._dbLoaded)return;
  if(DB.emp.length===0&&DB.oc.length===0)return; // nunca guarda uma base vazia como backup
  var hojeId=bkpNovoId().slice(0,8);
  bkpListar().then(function(lista){
    if(lista.some(function(x){return x.tipo==="auto"&&x.id.slice(0,8)===hojeId;}))return null;
    return bkpCriar("auto").then(function(){BKP_ERRO="";});
  }).then(function(){
    bkpCopiaLocalSemanal();
    if(pg==="backup")rBkp();
  }).catch(function(e){
    BKP_ERRO=e.message||String(e);
    console.warn("Backup automatico falhou:",e);
  });
}
// Copia no computador (opcional, 1x por semana) - protege mesmo se a conta do Supabase tiver problema
function bkpLocalAtivo(){try{return localStorage.getItem("timbo_bkp_local")==="1";}catch(e){return false;}}
function bkpCopiaLocalSemanal(){
  if(!bkpLocalAtivo())return;
  var ult=0;try{ult=parseInt(localStorage.getItem("timbo_bkp_local_ult")||"0",10);}catch(e){}
  if(Date.now()-ult<7*24*3600*1000)return;
  bkpBaixarAtual();
  try{localStorage.setItem("timbo_bkp_local_ult",String(Date.now()));}catch(e){}
}
function setBkpLocal(on){try{localStorage.setItem("timbo_bkp_local",on?"1":"0");}catch(e){}rBkp();}
function bkpDownload(obj,nome){
  var blob=new Blob([JSON.stringify(obj)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function bkpPacote(dados,origem){return{sistema:"Timbó - Gestao de Premios",versao:1,origem:origem,gerado:new Date().toISOString(),colecoes:COLECOES,dados:dados};}
function bkpBaixarAtual(){
  if(!window._dbLoaded){alert("Os dados ainda nao foram carregados.");return;}
  bkpDownload(bkpPacote(DB,"dados atuais"),"backup-timbo-"+bkpNovoId()+".json");
}
function bkpBaixar(id){
  showSync("Preparando download...",false);
  bkpLer(id).then(function(d){
    bkpDownload(bkpPacote(d,"backup "+id),"backup-timbo-"+id+".json");
    showSync("Download iniciado",true);
    setTimeout(function(){document.getElementById("sync-bar").style.display="none";},2500);
  }).catch(function(e){showSync("Erro: "+e.message,false,true);});
}
function bkpAgora(){
  showSync("Criando backup...",false);
  bkpCriar("manual").then(function(){
    showSync("Backup criado",true);BKP_ERRO="";
    setTimeout(function(){document.getElementById("sync-bar").style.display="none";},2500);rBkp();
  }).catch(function(e){BKP_ERRO=e.message;showSync("Erro no backup: "+e.message,false,true);rBkp();});
}
// Restaura: antes cria um backup de seguranca do estado atual
function bkpAplicar(dados,origem){
  var n=(dados.emp||[]).length,m=(dados.oc||[]).length;
  if(!confirm("Restaurar "+origem+"?\n\nColaboradores: "+n+"  |  Lancamentos: "+m+"\n\nOs dados atuais serao substituidos. Antes disso, um backup de seguranca do estado atual sera criado automaticamente."))return;
  showSync("Criando backup de seguranca...",false);
  bkpCriar("antes-restauracao").then(function(){
    COLECOES.forEach(function(c){if(Array.isArray(dados[c]))DB[c]=dados[c];});
    showSync("Restaurando...",false);
    return window._fbSave();
  }).then(function(){
    showSync("Backup restaurado com sucesso",true);
    setTimeout(function(){document.getElementById("sync-bar").style.display="none";},3000);
    rBkp();
  }).catch(function(e){showSync("Erro ao restaurar: "+e.message,false,true);});
}
function bkpRestaurar(id){
  showSync("Lendo backup...",false);
  bkpLer(id).then(function(d){
    document.getElementById("sync-bar").style.display="none";
    if(!d.emp){alert("Backup incompleto ou nao encontrado.");return;}
    bkpAplicar(d,"o backup de "+bkpDataId(id));
  }).catch(function(e){showSync("Erro: "+e.message,false,true);});
}
function bkpExcluir(id){
  if(!confirm("Excluir o backup de "+bkpDataId(id)+"?"))return;
  bkpListar().then(function(lista){
    lista=lista.filter(function(x){return x.id!==id;});
    return bkpDocs().doc("_backups").set({lista:lista,atualizado:new Date().toISOString()}).then(function(){BKP_LISTA=lista;return bkpApagarDocs(id);});
  }).then(rBkp).catch(function(e){showSync("Erro: "+e.message,false,true);});
}
function bkpImportar(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    inp.value="";
    try{
      var o=JSON.parse(r.result),d=o&&o.dados;
      if(!d||!Array.isArray(d.emp))throw new Error("Arquivo nao e um backup valido do sistema.");
      bkpAplicar(d,"o arquivo "+f.name+(o.gerado?" (gerado em "+new Date(o.gerado).toLocaleString("pt-BR")+")":""));
    }catch(e){alert("Nao foi possivel ler o arquivo: "+e.message);}
  };
  r.readAsText(f);
}

  var local=bkpLocalAtivo();

// BALANCEAMENTO DE PRODUCAO (C.C. Infomodulus x turno)
// Turno: e.balTurno (definido aqui) ou campo Horario do cadastro (ou "Nº T" da categoria).
// Horas previstas/mes: e.balHoras (individual) ou padrao do turno (DB.idx cfg_bal).
// Metas por C.C. e turno: DB.grupos[].metas = {TURNO:{p,h}}
// ═══════════════════════════════════════
var BAL_COR=["#1E5BC6","#e6a817","#7b3fa0","#1a7a4a","#d35400","#16a085","#5d6d7e","#c0392b"];
var balShowAll=false,balTipoF="",balDrag=null;
function balRO(){return !!ACESSO&&permTela("balanc")!=="editar";}
function balCfg(){var r=(DB.idx||[]).find(function(x){return x.id==="cfg_bal";});return Object.assign({hPad:176,hTurno:{},extras:[]},r&&r.cfg?JSON.parse(JSON.stringify(r.cfg)):{});}
function balSetCfg(c){DB.idx=(DB.idx||[]).filter(function(x){return x.id!=="cfg_bal";});DB.idx.push({id:"cfg_bal",tipo:"cfg_bal",cfg:c,em:new Date().toISOString()});}
function balTurnoNat(e){
  var h=(e.horario||"").trim().toUpperCase();if(h)return h;
  var m=(e.empresa||"").match(/(\d)\s*[º°o]\s*T/i);if(m)return m[1]+"º TURNO";
  return "SEM TURNO";
}
function balTurno(e){return e.balTurno||balTurnoNat(e);}
function balHorasPad(t,c){c=c||balCfg();var v=c.hTurno&&c.hTurno[t];return typeof v==="number"?v:(+c.hPad||0);}
function balHoras(e,c){return typeof e.balHoras==="number"?e.balHoras:balHorasPad(balTurno(e),c);}
function balPessoas(){return DB.emp.filter(ativoVis);}
function balTurnos(){
  var c=balCfg(),s={};balPessoas().forEach(function(e){s[balTurno(e)]=1;});(c.extras||[]).forEach(function(t){s[t]=1;});
  var ord=["MATUTINO","VESPERTINO","NOTURNO","COMERCIAL"];
  return Object.keys(s).sort(function(a,b){
    if(a==="SEM TURNO")return 1;if(b==="SEM TURNO")return -1;
    var ia=ord.indexOf(a),ib=ord.indexOf(b);if(ia<0)ia=99;if(ib<0)ib=99;
    return ia-ib||a.localeCompare(b,undefined,{numeric:true});
  });

function pcqTurnoN(t){t=String(t||"").toUpperCase();var m=t.match(/(\d)\s*[º°O]?\s*(T\b|TURNO)/);if(m)return m[1];
  if(/MATUTINO|MANH/.test(t))return "1";if(/VESPERTINO|TARDE/.test(t))return "2";if(/NOTURNO|NOITE/.test(t))return "3";return "G";}
// Resumo por turno: linhas = categorias dos Industriais Diretos (por turno + Geral); colunas = CLT, empresas terceiras, total
function pcqResumo(ds){
  var cats=pcCats(),cfg=pcCfg(),nomes=cats.map(function(c){return c.nome;});
  var rowsN;
  if(Array.isArray(cfg.qRows))rowsN=cfg.qRows.filter(function(n){return nomes.indexOf(n)>=0;});
  else{
    var dir=cats.filter(function(c){return /\bdiretos/i.test(c.nome)&&!/total/i.test(c.nome);});
    rowsN=dir.filter(function(c){return pcqTurnoN(c.nome)!=="G";}).sort(function(a,b){return pcqTurnoN(a.nome).localeCompare(pcqTurnoN(b.nome));}).map(function(c){return c.nome;})
      .concat(dir.filter(function(c){return pcqTurnoN(c.nome)==="G";}).map(function(c){return c.nome;}))
      .concat(cats.filter(function(c){return /^\s*geral\s*$/i.test(c.nome);}).map(function(c){return c.nome;}));
  }
  var cols;
  if(Array.isArray(cfg.qTerc))cols=cfg.qTerc.filter(function(n){return nomes.indexOf(n)>=0&&rowsN.indexOf(n)<0;});
  else{cols=cats.filter(function(c){return /\bGW\b|\bLF\b/i.test(c.nome);}).map(function(c){return c.nome;});
    if(!cols.length)cols=cats.filter(function(c){return c.tipo==="pj";}).map(function(c){return c.nome;});}
  var rows=rowsN.map(function(n){return {nome:n,t:pcqTurnoN(n),lb:/\bdiretos/i.test(n)?n:"Industriais Diretos - "+n};});
  var reg=DB.emp.filter(function(e){return pcConta(e,ds)&&!inatEm(e,ds);});
  function linhaDe(e){var n=pcqTurnoN((e.horario||"")+" "+(typeof balTurno==="function"?balTurno(e):""));
    return rows.find(function(r){return r.t===n;})||rows.find(function(r){return r.t==="G";})||null;}
  function cel(rn,col){
    var rs=rn==="_tot"?rows:rows.filter(function(r){return r.nome===rn;}),out=[];
    rs.forEach(function(r){
      if(col==="CLT"||col==="_tot")out=out.concat(reg.filter(function(e){return pcCatNome(e)===r.nome;}));
      cols.forEach(function(c){if(col===c||col==="_tot")out=out.concat(reg.filter(function(e){return pcCatNome(e)===c&&linhaDe(e)===r;}));});
    });
    return out;
  }
  var semT=0;cols.forEach(function(c){semT+=reg.filter(function(e){return pcCatNome(e)===c&&!linhaDe(e);}).length;});
  return {rows:rows,cols:cols,cel:cel,semT:semT};
}

// Arrumacao das caixas do quadro: pilhas salvas pelo usuario (arrastar) + encaixe automatico do restante
function pcqPilhas(itens){
  var hMax=Math.max.apply(null,itens.map(function(x){return x.h;})),cfg=pcCfg(),lay=Array.isArray(cfg.qLay)?cfg.qLay:null;
  var byK={},usado={},res=[];itens.forEach(function(x){byK[x.k]=x;});
  if(lay)lay.forEach(function(st){var l=(st||[]).filter(function(k){return byK[k]&&byK[k].solo&&!usado[k];});
    if(l.length){l.forEach(function(k){usado[k]=1;});res.push({h:l.reduce(function(a,k){return a+byK[k].h;},0),ks:l});}});
  itens.forEach(function(x){
    if(usado[x.k])return;
    if(!x.solo){res.push({grp:x});return;}
    if(x.k==="_inat"){ // inativos: abaixo do turno dos Industriais Diretos com mais espaco livre
      var cs=res.filter(function(p){return !p.grp&&p.h+x.h<=hMax+.01&&p.ks.some(function(k){return /\bdiretos/i.test(k)&&pcqTurnoN(k)!=="G";});});
      if(cs.length){cs.sort(function(a,b){return a.h-b.h;});cs[0].h+=x.h;cs[0].ks.push(x.k);return;}
    }
    var p=res.find(function(q){return !q.grp&&q.h+x.h<=hMax+.01;});
    if(p){p.h+=x.h;p.ks.push(x.k);}else res.push({h:x.h,ks:[x.k]});
  });
  return res;
}

function pcqDE(el){(el.closest(".pcq-pilha")||el).classList.remove("drag");el.classList.remove("drag");document.querySelectorAll(".pcq-board").forEach(function(b){b.classList.remove("arr");});pcqLimpa();pcqDrag=null;}
// posicao de insercao da caixa dentro da coluna (pela altura do mouse)
function pcqPos(el,y){var bs=Array.prototype.slice.call(el.querySelectorAll(":scope > [data-k]")).filter(function(b){return !pcqDrag||b.dataset.k!==pcqDrag.k;});
  for(var i=0;i<bs.length;i++){var r=bs[i].getBoundingClientRect();if(y<r.top+r.height/2)return {i:i,el:bs[i]};}return {i:bs.length,el:null};}
function pcqDO(ev,el){
  if(!pcqDrag||pcqDrag.tipo==="nome")return;ev.preventDefault();pcqLimpa();
  if(el.classList.contains("pcq-novo")){if(pcqDrag.tipo==="box")el.classList.add("over");return;}
  if(pcqDrag.tipo==="col"){var r=el.getBoundingClientRect();el.classList.add(ev.clientX<r.left+r.width/2?"ov-l":"ov-r");return;}
  var p=pcqPos(el,ev.clientY);if(p.el)p.el.classList.add("ins-a");else el.classList.add("ins-d");
}
function pcqDL(ev,el){if(!el.contains(ev.relatedTarget))pcqLimpa();}
function pcqDrop(ev,el){
  if(pcqDrag&&pcqDrag.tipo==="nome")return;
  ev.preventDefault();var D=pcqDrag;pcqDrag=null;pcqLimpa();if(!D)return;
  var pil=Array.prototype.slice.call(document.querySelectorAll("#p-percap .pcq-pilha"));
  var st=pil.map(function(p){return Array.prototype.slice.call(p.querySelectorAll(":scope > [data-k]")).map(function(b){return b.dataset.k;});});
  if(D.tipo==="col"){
    if(el.classList.contains("pcq-novo"))return;
    var de=D.i,para=+el.dataset.pi,r=el.getBoundingClientRect(),dir=ev.clientX>=r.left+r.width/2;
    if(de===para)return;
    var col=st.splice(de,1)[0];var alvo=para>de?para-1:para;st.splice(alvo+(dir?1:0),0,col);
  }else{
    var pos=el.classList.contains("pcq-novo")?null:pcqPos(el,ev.clientY).i;
    st=st.map(function(l){return l.filter(function(x){return x!==D.k;});});
    if(pos===null)st.push([D.k]);else st[+el.dataset.pi].splice(pos,0,D.k);
  }
  var cfg=pcDoc("cfg",{cats:[],dias:{}});cfg.qLay=st.filter(function(l){return l.length;});dbSave();pcRerender();
}
// arrastar nomes entre categorias (muda a Categoria do cadastro)
function pcqNS(ev,el){ev.stopPropagation();pcqDrag={tipo:"nome",id:el.dataset.e,de:(el.closest("[data-cat]")||{dataset:{}}).dataset.cat};
  try{ev.dataTransfer.setData("text/plain",el.dataset.e);ev.dataTransfer.effectAllowed="move";}catch(e){}el.classList.add("drag");}
function pcqNO(ev,el){if(!pcqDrag||pcqDrag.tipo!=="nome")return;ev.preventDefault();ev.stopPropagation();
  document.querySelectorAll("#p-percap .pcq-col.nome-ov").forEach(function(x){if(x!==el)x.classList.remove("nome-ov");});if(el.dataset.cat!==pcqDrag.de)el.classList.add("nome-ov");}
function pcqNL(ev,el){if(!el.contains(ev.relatedTarget))el.classList.remove("nome-ov");}
function pcqND(ev,el){
  if(!pcqDrag||pcqDrag.tipo!=="nome")return;ev.preventDefault();ev.stopPropagation();
  var D=pcqDrag,cat=el.dataset.cat;pcqDrag=null;el.classList.remove("nome-ov");
  if(!cat||cat===D.de||!pcpPodeEditar())return;
  var e=DB.emp.find(function(x){return x.id===D.id;});if(!e)return;
  var ant=e.empresa||"";
  DB.emp=DB.emp.map(function(x){return x.id===D.id?Object.assign({},x,{empresa:cat}):x;});
  dbSave();pcRerender();
  pcqUndo={id:D.id,ant:ant};
  pcqToast(esc(e.nome)+" movido para <b>"+esc(cat)+"</b>");
}
var pcqUndo=null;
function pcqToast(msg){
  var t=document.getElementById("pcq-toast");if(t)t.remove();
  t=document.createElement("div");t.id="pcq-toast";t.className="pcq-toast";
  t.innerHTML="<i class='ti ti-circle-check'></i><span>"+msg+"</span><button onclick='pcqDesfazer()'>Desfazer</button>";
  document.body.appendChild(t);clearTimeout(window._pcqT);window._pcqT=setTimeout(function(){var x=document.getElementById("pcq-toast");if(x)x.remove();},6000);
}
function pcqDesfazer(){
  var u=pcqUndo;pcqUndo=null;var t=document.getElementById("pcq-toast");if(t)t.remove();if(!u)return;
  DB.emp=DB.emp.map(function(x){return x.id===u.id?Object.assign({},x,{empresa:u.ant}):x;});dbSave();pcRerender();
}
function pcqAuto(){var cfg=pcDoc("cfg",{cats:[],dias:{}});delete cfg.qLay;dbSave();pcRerender();}
// ═══ Edicao de texto direto na tabela do Cadastro ═══
function setTxtInline(id,k,el){
  var v=(el.value||"").trim(),e=DB.emp.find(function(x){return x.id===id;});if(!e)return;
  if((k==="nome"||k==="func")&&!v){alert(k==="nome"?"O nome nao pode ficar vazio.":"A funcao nao pode ficar vazia.");el.value=e[k]||"";return;}
  if(k==="horario")v=v.toUpperCase();
  DB.emp=DB.emp.map(function(x){
    if(x.id!==id)return x;
    var n=Object.assign({},x);
    if(k==="vinc")pceAplicaVinc(n,v==="MEI"?"MEI":"CLT");
    else if(k==="grupo"){if(v)n.grupo=v;else delete n.grupo;}
    else n[k]=v;
    return n;
  });
  dbSave();
  if(k==="vinc"||k==="grupo")filtEmp();
}
// ═══ Lancamentos do salario / valor mensal com vigencia (ex: 1a e 2a quinzena) ═══
function salSoma(l){return +((l||[]).reduce(function(a,x){return a+(+x.v||0);},0)).toFixed(2);}
function salLista(e,m){var d=e&&e.mv&&e.mv[m];return d&&Array.isArray(d.salL)?d.salL:[];}
var salEst=null;
function salLanc(id,m){
  var e=DB.emp.find(function(x){return x.id===id;});if(!e)return;
  m=m||empMesSel();
  var l=salLista(e,m).map(function(x){return Object.assign({},x);});
  if(!l.length){var ev=empView(e,m);if(typeof ev.sal==="number"&&ev.sal>0)l.push({v:ev.sal,data:m+"-"+(isMEI(e)?"15":"01"),obs:"Valor do mês"});}
  salEst={id:id,m:m,l:l};salRender();
}
function salRender(){
  var E=salEst;if(!E)return;var e=DB.emp.find(function(x){return x.id===E.id;});
  var mei=isMEI(e),lb=mei?(e.meiTipo==="hora"?"Valor por hora":"Valor mensal"):"Salário";
  var m0=E.m,fim=fimMesStr(m0);
  var rows=E.l.map(function(x,i){
    var fora=x.data&&x.data.slice(0,7)!==m0;
    return "<tr><td><input type='date' value='"+esc(x.data||"")+"' onchange='salSet("+i+",\"data\",this.value)'/>"+(fora?"<div class='hint' style='color:#b8820a;margin:2px 0 0'>vai para "+fmtM(x.data.slice(0,7))+"</div>":"")+"</td>"
      +"<td><input type='text' inputmode='decimal' value='"+(x.v!==""&&x.v!=null?fmtNum(x.v):"")+"' placeholder='0,00' onfocus='this.select()' onchange='salSet("+i+",\"v\",this.value)' style='text-align:right;font-weight:700'/></td>"
      +"<td><input type='text' value='"+esc(x.obs||"")+"' placeholder='Ex: 1ª quinzena' onchange='salSet("+i+",\"obs\",this.value)'/></td>"
      +"<td class='act'><button class='ibdel' title='Remover' onclick='salDel("+i+")'><i class='ti ti-trash'></i></button></td></tr>";
  }).join("");
  balModal("<i class='ti ti-calendar-dollar'></i>"+lb+" com vigência &middot; "+esc(e.nome),
    "<div class='sal-top'><span class='sal-m'><i class='ti ti-calendar'></i>"+fmtM(m0)+"</span><span>Cada lançamento entra no mês da sua data. O "+lb.toLowerCase()+" do mês é a soma dos lançamentos.</span></div>"
    +"<div class='etab-wrap' style='max-height:46vh'><table class='etab sal-t'><thead><tr><th style='cursor:default;width:150px'>VIGÊNCIA (DATA)</th><th style='cursor:default;width:140px' class='c'>VALOR (R$)</th><th style='cursor:default'>OBSERVAÇÃO</th><th style='cursor:default;width:40px'></th></tr></thead><tbody>"
    +(rows||"<tr><td colspan='4' style='text-align:center;color:#9aa3ad;padding:1rem'>Nenhum lançamento. Clique em Adicionar lançamento.</td></tr>")+"</tbody>"
    +"<tfoot><tr><td>TOTAL DE "+fmtM(m0).toUpperCase()+"</td><td class='r'>"+fmtBRL(salSoma(E.l.filter(function(x){return !x.data||x.data.slice(0,7)===m0;})))+"</td><td colspan='2'></td></tr></tfoot></table></div>"
    +"<div style='display:flex;gap:6px;margin-top:.6rem;flex-wrap:wrap'><button class='btng btn-ic' onclick='salAdd()'><i class='ti ti-plus'></i>Adicionar lançamento</button>"
    +"<button class='btng btn-ic' onclick='salQuinz()' title='Cria 1ª quinzena (dia 15) e 2ª quinzena (último dia)'><i class='ti ti-calendar-week'></i>Duas quinzenas</button></div>"
    +"<div class='hint'>Ex.: 150,00 &middot; 15/10/2026 &middot; 1ª quinzena e 180,00 &middot; "+fmtD(fim)+" &middot; 2ª quinzena = "+fmtBRL(330)+" no mês. Sem lançamentos, vale o valor digitado direto.</div>"
    +"<div class='mdl-ft'><button class='btng' onclick='balFechar();salEst=null'>Cancelar</button><button class='btnp btn-ic' onclick='salSalvar()'><i class='ti ti-device-floppy'></i>Salvar</button></div>",620);
}
function salSet(i,k,v){var x=salEst&&salEst.l[i];if(!x)return;
  if(k==="v"){var n=String(v).trim()===""?"":parseBRL(v);if(n!==""&&(isNaN(n)||n<0)){alert("Informe um valor valido.");salRender();return;}x.v=n===""?"":+n.toFixed(2);}
  else x[k]=v;salRender();}
function salDel(i){salEst.l.splice(i,1);salRender();}
function salAdd(){var m=salEst.m,u=salEst.l.length?salEst.l[salEst.l.length-1].data:"";salEst.l.push({v:"",data:u&&u.slice(0,7)===m?fimMesStr(m):m+"-15",obs:""});salRender();}
function salQuinz(){var m=salEst.m;salEst.l=salEst.l.filter(function(x){return x.data&&x.data.slice(0,7)!==m;}); // substitui os lancamentos do mes
  salEst.l.push({v:"",data:m+"-15",obs:"1ª quinzena"},{v:"",data:fimMesStr(m),obs:"2ª quinzena"});salRender();}
function salSalvar(){
  var E=salEst;if(!E)return;
  for(var i=0;i<E.l.length;i++){var x=E.l[i];if(x.v===""||x.v==null){alert("Informe o valor de todos os lancamentos (ou remova a linha vazia).");return;}if(!x.data){alert("Informe a data de vigencia de todos os lancamentos.");return;}}
  var por={};E.l.forEach(function(x){var mm=x.data.slice(0,7);(por[mm]=por[mm]||[]).push({v:+x.v,data:x.data,obs:(x.obs||"").trim()});});
  var meses=Object.keys(por);if(meses.indexOf(E.m)<0)meses.push(E.m);
  DB.emp=DB.emp.map(function(e){
    if(e.id!==E.id)return e;
    var n=Object.assign({},e);n.mv=Object.assign({},n.mv||{});
    meses.forEach(function(mm){
      var d=Object.assign({},n.mv[mm]||{}),l=(por[mm]||[]).sort(function(a,b){return a.data.localeCompare(b.data);});
      if(mm!==E.m&&!por[mm])return;
      if(mm!==E.m)l=salLista(e,mm).filter(function(o){return !l.some(function(p){return p.data===o.data&&p.v===o.v;});}).concat(l).sort(function(a,b){return a.data.localeCompare(b.data);}); // outros meses: soma aos lancamentos que ja existiam
      if(l.length){d.salL=l;d.sal=salSoma(l);}else{delete d.salL;delete d.sal;}
      if(Object.keys(d).length)n.mv[mm]=d;else delete n.mv[mm];
    });
    mvSync(n);return n;
  });
  dbSave();balFechar();salEst=null;
  if(document.getElementById(empId("elist")))filtEmp();
  salFormInfo(E.id);
}
// no formulario Editar colaborador
function salFormInfo(id){
  var box=document.getElementById("esallanc"),inp=document.getElementById("esal");if(!box||!inp)return;
  id=id||gv("eid");var e=id?DB.emp.find(function(x){return x.id===id;}):null,m=empMesSel(),l=e?salLista(e,m):[];
  if(e&&gv("eid")===id&&l.length){inp.value=salSoma(l);inp.readOnly=true;inp.style.background="#f1f4f8";updSalCalc();}
  else{inp.readOnly=false;inp.style.background="";}
  box.innerHTML="<button type='button' class='btng btn-ic sal-bt' onclick='salLancForm()'><i class='ti ti-calendar-dollar'></i>"+(l.length?"Lançamentos com vigência ("+l.length+")":"Adicionar com vigência / mais de um valor")+"</button>"
    +(l.length?"<div class='sal-chips'>"+l.map(function(x){return "<span>"+fmtBRL(x.v)+" &middot; "+fmtD(x.data)+(x.obs?" &middot; "+esc(x.obs):"")+"</span>";}).join("")+"</div>":"");
}
function salLancForm(){var id=gv("eid");if(!id){alert("Salve o cadastro do colaborador primeiro; depois abra Editar para lancar os valores com vigencia.");return;}salLanc(id,empMesSel());}
// ═══ Cesta basica em massa (com edicao individual) ═══
var cbEst=null;
function abrirCestaMassa(){
  var m=empMesSel(),l=DB.emp.filter(function(e){return empAtivoNoMes(e,m);}).sort(function(a,b){return (a.empresa||"").localeCompare(b.empresa||"")||a.nome.localeCompare(b.nome);});
  cbEst={m:m,rows:l.map(function(e){var v=empView(e,m),cur=typeof v.cesta==="number"?v.cesta:null;return {id:e.id,nome:e.nome,cat:e.empresa||"",mei:isMEI(e),cur:cur,val:cur,chk:!isMEI(e)};}),q:""};
  cbRender();
}
function cbRender(){
  var E=cbEst;if(!E)return;
  var q=(E.q||"").toLowerCase(),vis=E.rows.filter(function(r){return !q||(r.nome+" "+r.cat).toLowerCase().indexOf(q)>=0;});
  var nChk=E.rows.filter(function(r){return r.chk;}).length,nMud=E.rows.filter(function(r){return r.val!==r.cur;}).length;
  var tot=E.rows.reduce(function(a,r){return a+(+r.val||0);},0);
  var html="<div class='cb-bar'><div class='fr' style='margin:0'><label class='lbl'>Valor da cesta (R$)</label><input type='text' inputmode='decimal' id='cb-v' placeholder='Ex: 312,00' style='width:140px' onkeydown=\"if(event.key==='Enter')cbPreencher()\"/></div>"
    +"<label class='cb-op'><input type='checkbox' id='cb-vz'/>Só quem está sem valor</label>"
    +"<button class='btnp btn-ic' onclick='cbPreencher()'><i class='ti ti-arrow-down'></i>Aplicar aos marcados ("+nChk+")</button>"
    +"<button class='btng btn-ic' onclick='cbLimparMarcados()' title='Remove o valor dos marcados'><i class='ti ti-eraser'></i>Limpar marcados</button></div>"
    +"<div class='cb-tb'><div class='bal-srch'><i class='ti ti-search'></i><input type='text' placeholder='Buscar nome ou categoria...' value='"+esc(E.q||"")+"' oninput='cbEst.q=this.value;cbRender();cbFoco()' id='cb-q'/></div>"
    +"<span class='lk' onclick='cbMarcar(\"todos\")'>Marcar todos</span><span class='lk' onclick='cbMarcar(\"clt\")'>Só CLT</span><span class='lk' onclick='cbMarcar(\"nenhum\")'>Desmarcar</span>"
    +"<span style='margin-left:auto;font-size:12px;color:#7a8592'>"+E.rows.length+" colaboradores &middot; total "+fmtBRL(tot)+"</span></div>"
    +"<div class='etab-wrap' style='max-height:44vh'><table class='etab'><thead><tr><th style='cursor:default;width:34px'></th><th style='cursor:default'>COLABORADOR</th><th style='cursor:default'>CATEGORIA</th><th class='c' style='cursor:default;width:140px'>CESTA BÁSICA (R$)</th></tr></thead><tbody>"
    +vis.map(function(r){var i=E.rows.indexOf(r),mud=r.val!==r.cur;
      return "<tr"+(mud?" style='background:#fffbea'":"")+"><td class='c'><input type='checkbox' "+(r.chk?"checked":"")+" onchange='cbEst.rows["+i+"].chk=this.checked;cbRender()' style='width:auto'/></td>"
        +"<td class='nm'>"+esc(r.nome)+(r.mei?" <span class='bdg' style='background:#f1e7f8;color:#7b3fa0'>MEI</span>":"")+"</td><td>"+esc(r.cat||"—")+"</td>"
        +"<td class='in'><input type='text' inputmode='decimal' class='etab-sal cb-in' value='"+(r.val===null?"":fmtBRL(r.val))+"' placeholder='—' onfocus='brlFocus(this)' onblur='brlBlur(this)' onchange='cbSet("+i+",this.value)' onkeydown='salKey(event,this)' data-col='cb'"+(mud?" style='color:#b8820a;font-weight:800'":"")+"/></td></tr>";}).join("")
    +"</tbody></table></div>"
    +"<div class='hint'>Digite em uma linha para ajustar só aquele colaborador. Em amarelo: alterações ainda não salvas. Vazio = sem cesta no mês.</div>"
    +"<div class='mdl-ft'><span style='margin-right:auto;font-size:12px;color:#8a5a00;font-weight:700'>"+(nMud?nMud+" alteração(ões) pendente(s)":"")+"</span><button class='btng' onclick='balFechar();cbEst=null'>Cancelar</button><button class='btnp btn-ic' onclick='cbSalvar()'"+(nMud?"":" disabled style='opacity:.5'")+"><i class='ti ti-device-floppy'></i>Salvar</button></div>";
  var v0=document.getElementById("cb-v"),vv=v0?v0.value:"",vz=document.getElementById("cb-vz"),vzc=vz?vz.checked:false;
  balModal("<i class='ti ti-basket'></i>Cesta básica em massa &middot; "+fmtM(E.m),html,760);
  var v1=document.getElementById("cb-v");if(v1)v1.value=vv;var z1=document.getElementById("cb-vz");if(z1)z1.checked=vzc;
}
function cbFoco(){var q=document.getElementById("cb-q");if(q){q.focus();var n=q.value.length;q.setSelectionRange(n,n);}}
function cbSet(i,t){var r=cbEst.rows[i];var n=String(t).trim()===""?null:parseBRL(t);if(n!==null&&(isNaN(n)||n<0)){alert("Informe um valor valido.");cbRender();return;}r.val=n===null?null:+n.toFixed(2);cbRender();}
function cbMarcar(k){cbEst.rows.forEach(function(r){r.chk=k==="todos"?true:k==="clt"?!r.mei:false;});cbRender();}
function cbPreencher(){var t=gv("cb-v").trim(),n=parseBRL(t);if(t===""||isNaN(n)||n<0){alert("Informe o valor da cesta basica.");return;}
  var so=document.getElementById("cb-vz").checked,c=0;cbEst.rows.forEach(function(r){if(r.chk&&(!so||r.val===null)){r.val=+n.toFixed(2);c++;}});if(!c)alert("Nenhum colaborador marcado para aplicar.");cbRender();}
function cbLimparMarcados(){cbEst.rows.forEach(function(r){if(r.chk)r.val=null;});cbRender();}
function cbSalvar(){
  var E=cbEst,m=E.m,mud={};E.rows.forEach(function(r){if(r.val!==r.cur)mud[r.id]=r.val;});
  var n=0;
  DB.emp=DB.emp.map(function(e){
    if(!(e.id in mud))return e;
    var x=Object.assign({},e);x.mv=Object.assign({},e.mv||{});var d=Object.assign({},x.mv[m]||{});
    if(mud[e.id]===null)delete d.cesta;else d.cesta=mud[e.id];
    if(Object.keys(d).length)x.mv[m]=d;else delete x.mv[m];
    mvSync(x);n++;return x;
  });
  dbSave();balFechar();cbEst=null;filtEmp();if(typeof empMesInfo==="function")empMesInfo();
  showSync("Cesta basica atualizada para "+n+" colaborador"+(n>1?"es":"")+" em "+fmtM(m),true);setTimeout(function(){var sb=document.getElementById("sync-bar");if(sb)sb.style.display="none";},2400);
}
</script>
