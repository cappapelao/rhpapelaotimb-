// ═══ CUSTO TOTAL DA FOLHA DE PAGAMENTO (jan-dez por grupo) ═══
// Base: Resumo dos Custos (custo empresa mensal de cada colaborador), somado por C.C. Infomódulus.
// Salario do mes considera os reajustes (antes do reajuste vale o salario anterior).
var MESF=["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];
function empAtivoNoMes(e,m){
  var ini=m+"-01",fim=fimMesStr(m);
  if(e.adm&&e.adm>fim)return false;
  if(e.dem)return e.dem>=ini;
  if(!isAtivo(e))return !!e.inat&&e.inat>=ini;
  return true;
}
function salNoMes(e,m){
  if(typeof e.sal!=="number")return undefined;
  var fim=fimMesStr(m);
  var rs=(DB.reaj||[]).filter(function(r){return r.eid===e.id&&r.data>fim;}).sort(function(a,b){return a.data.localeCompare(b.data)||(a.criado||"").localeCompare(b.criado||"");});
  return rs.length?rs[0].ant:e.sal;
}
function custoNoMes(e,m){
  if(e.mv&&e.mv[m]){var w=empView(e,m);return empTemValores(w)?calcCusto(w,m):0;} // valores lancados no mes
  var o=Object.assign({},e),s=salNoMes(e,m);
  if(s===undefined)delete o.sal;else o.sal=s;
  if(!(typeof o.sal==="number"||assidInfo(o,m)||BENEF.some(function(b){return typeof o[b.k]==="number";})))return 0;
  return calcCusto(o,m);
}
// valores do mes: {g:{grupoId:valor}, sem:valor, fechado:bool} ou null (mes futuro)
function folhaMes(m){
  var f=(DB.folhafech||[]).find(function(x){return x.id===m;});
  if(f)return {g:f.g||{},sem:f.sem||0,fechado:true,em:f.em};
  if(m>curMes())return null;
  var g={},sem=0,ids={};DB.grupos.forEach(function(x){ids[x.id]=1;g[x.id]=0;});
  DB.emp.forEach(function(e){
    if(!empAtivoNoMes(e,m))return;
    var v=custoNoMes(e,m);if(!v)return;
    if(e.grupo&&ids[e.grupo])g[e.grupo]+=v;else sem+=v;
  });
  Object.keys(g).forEach(function(k){g[k]=+g[k].toFixed(2);});
  return {g:g,sem:+sem.toFixed(2),fechado:false};
}
function receitaMes(m){var r=(DB.receita||[]).find(function(x){return x.id===m;});return r&&typeof r.valor==="number"?r.valor:null;}
function rFolha(){
  var anoAt=String(new Date().getFullYear()),ano=gv("fl-ano")||anoAt;
  var anos={};anos[anoAt]=1;anos[String(+anoAt-1)]=1;anos[String(+anoAt+1)]=1;
  (DB.receita||[]).forEach(function(r){anos[r.id.slice(0,4)]=1;});(DB.folhafech||[]).forEach(function(r){anos[r.id.slice(0,4)]=1;});
  var gs=gruposOrd(),gp=gs.filter(function(g){return g.tipo!=="terceiro";}),gt=gs.filter(function(g){return g.tipo==="terceiro";});
  var meses=MESF.map(function(n,i){return ano+"-"+String(i+1).padStart(2,"0");});
  var dados=meses.map(function(m){
    var f=folhaMes(m),rec=receitaMes(m);
    if(!f)return {m:m,f:null,rec:rec};
    var folha=gp.reduce(function(a,g){return a+(f.g[g.id]||0);},0),terc=gt.reduce(function(a,g){return a+(f.g[g.id]||0);},0);
    return {m:m,f:f,rec:rec,folha:folha,terc:terc,geral:folha+terc};
  });
  var comDado=dados.filter(function(d){return d.f;}),comRec=dados.filter(function(d){return d.rec!==null&&d.rec>0;});
  function soma(fn,l){return (l||comDado).reduce(function(a,d){return a+fn(d);},0);}
  function med(fn,l){l=l||comDado;return l.length?soma(fn,l)/l.length:null;}
  var tFolha=soma(function(d){return d.folha;}),tTerc=soma(function(d){return d.terc;}),tGeral=tFolha+tTerc,tRec=soma(function(d){return d.rec;},comRec);
  var semNow=folhaMes(curMes()),semV=semNow?semNow.sem:0;
  var nSem=DB.emp.filter(function(e){return isAtivo(e)&&!(e.grupo&&DB.grupos.some(function(g){return g.id===e.grupo;}));}).length;
  var v=function(x){return x===null||x===undefined?"":fmtBRL(x);};
  var pct=function(c,r){return r?pct2(c/r*100):"";};
  var th=function(lb,cls,attr){return "<th class='c "+(cls||"")+"' style='cursor:default' "+(attr||"")+">"+lb+"</th>";};
  var head="<tr>"+th("MÊS","","rowspan='2'")
    +gp.map(function(g){return th("CUSTO PESSOAL<br>"+esc(g.nome).toUpperCase(),"","rowspan='2'");}).join("")
    +(gt.length?th("TERCEIRIZADOS","fl-band","colspan='"+gt.length+"'"):"")
    +th("TOTALIZADOR","fl-band2","colspan='5'")+th("SITUAÇÃO","","rowspan='2'")+"</tr><tr>"
    +gt.map(function(g){return th(esc(g.nome).toUpperCase());}).join("")
    +th("TOTAL DA FOLHA","fl-tot")+th("TOTAL CUSTO TERCEIROS","fl-tot")+th("CUSTO TOTAL DA FOLHA","fl-tot")+th("RECEITA<br><span style='font-weight:500'>(manual)</span>","fl-tot")+th("% S/ RECEITA","fl-tot")+"</tr>";
  var body=dados.map(function(d,i){
    var f=d.f,mm=MESF[i];
    var cells=gp.concat(gt).map(function(g){return "<td class='r'>"+(f?v(f.g[g.id]||0):"")+"</td>";}).join("");
    var st=!f?"<span style='color:#b0b8c1;font-size:11px'>futuro</span>"
      :f.fechado?"<button class='fl-st fech' onclick=\"reabrirMes('"+d.m+"')\" title='Fechado em "+(f.em?fmtD(f.em.slice(0,10)):"")+". Clique para reabrir'><i class='ti ti-lock'></i>Fechado</button>"
      :"<button class='fl-st' onclick=\"fecharMes('"+d.m+"')\" title='Congelar os valores deste mes'><i class='ti ti-lock-open'></i>Fechar</button>";
    return "<tr class='"+(d.m===curMes()?"fl-cur":"")+"'><td class='nm'>"+mm+"</td>"+cells
      +"<td class='r fl-c'>"+(f?v(d.folha):"")+"</td><td class='r fl-c'>"+(f?v(d.terc):"")+"</td><td class='r fl-c fl-g'>"+(f?v(d.geral):"")+"</td>"
      +"<td class='in fl-c'><input type='number' min='0' step='0.01' class='etab-sal' data-col='rec' value='"+(d.rec===null?"":d.rec)+"' placeholder='0,00' onchange=\"setReceita('"+d.m+"',this.value)\" onkeydown='salKey(event,this)'/></td>"
      +"<td class='r fl-c fl-p'>"+(f&&d.rec?pct(d.geral,d.rec):"")+"</td><td class='c'>"+st+"</td></tr>";
  }).join("");
  var totG=gp.concat(gt).map(function(g){return "<td class='r'>"+fmtBRL(soma(function(d){return d.f.g[g.id]||0;}))+"</td>";}).join("");
  var medG=gp.concat(gt).map(function(g){var x=med(function(d){return d.f.g[g.id]||0;});return "<td class='r'>"+v(x)+"</td>";}).join("");
  var mF=med(function(d){return d.folha;}),mT=med(function(d){return d.terc;}),mR=med(function(d){return d.rec;},comRec);
  var foot="<tr><td>TOTAL</td>"+totG+"<td class='r'>"+fmtBRL(tFolha)+"</td><td class='r'>"+fmtBRL(tTerc)+"</td><td class='r'>"+fmtBRL(tGeral)+"</td><td class='r'>"+fmtBRL(tRec)+"</td><td class='r'>"+(tRec?pct(soma(function(d){return d.rec?d.geral:0;}),tRec):"")+"</td><td></td></tr>"
    +"<tr class='fl-med'><td>MÉDIA</td>"+medG+"<td class='r'>"+v(mF)+"</td><td class='r'>"+v(mT)+"</td><td class='r'>"+v(mF===null?null:mF+mT)+"</td><td class='r'>"+v(mR)+"</td><td class='r'>"+(mR&&mF!==null?pct(mF+mT,mR):"")+"</td><td></td></tr>";
  var selSt="padding:.4rem .7rem;border:1.5px solid var(--line);border-radius:8px;font-size:13px;color:"+B+";font-weight:700;background:#fff;width:auto";
  document.getElementById("p-folha").innerHTML=
    "<div class='pg-hd'><div><h1 class='h1'>Custo Total da Folha de Pagamento</h1>"
    +"<div class='sub'>Base: Resumo dos Custos (custo empresa mensal) somado por C.C. Infomódulus &middot; receita lancada manualmente</div></div>"
    +"<div style='display:flex;align-items:center;gap:8px'><i class='ti ti-calendar' style='color:#888'></i><span style='font-size:12px;font-weight:600;color:#555'>Ano:</span>"
    +"<select id='fl-ano' onchange='rFolha()' style='"+selSt+"'>"+Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===ano?" selected":"")+">"+a+"</option>";}).join("")+"</select></div></div>"
    +(nSem?"<div class='warn' style='margin-bottom:1rem'><i class='ti ti-alert-triangle'></i> "+nSem+" colaborador"+(nSem>1?"es ativos":" ativo")+" sem C.C. Infomódulus"+(semV?" (custo de "+fmtBRL(semV)+" no mes atual)":"")+" nao entra"+(nSem>1?"m":"")+" nesta tabela. <a href='#' onclick=\"go('direcionar');return false\" style='color:inherit'>Vincular a um C.C. Infomódulus</a></div>":"")
    +"<div class='ga' style='margin-bottom:1rem'>"
    +sCard("Custo total da folha",fmtBRL(tGeral),B,"ti-cash",ano+" · "+comDado.length+" mes"+(comDado.length!==1?"es":""))
    +sCard("Total da folha",fmtBRL(tFolha),BL,"ti-users","pessoal proprio")
    +sCard("Custo terceiros",fmtBRL(tTerc),PUR,"ti-briefcase","terceirizados")
    +sCard("Receita",fmtBRL(tRec),GRN,"ti-chart-line",comRec.length+" mes"+(comRec.length!==1?"es":"")+" lancado"+(comRec.length!==1?"s":""))
    +sCard("% s/ receita",tRec?pct(soma(function(d){return d.rec?d.geral:0;}),tRec):"—",GLD,"ti-percentage","meses com receita")
    +sCard("Media mensal",v(mF===null?0:mF+mT),"#14213D","ti-calendar-stats","custo total / mes")
    +"</div>"
    +"<div class='card'><div class='fl-scroll-top' id='fl-top'><div id='fl-top-in'></div></div><div class='etab-wrap fl-wrap' id='fl-wrap'><table class='etab ftab' style='min-width:"+(420+(gp.length+gt.length)*120+5*125)+"px'><thead>"+head+"</thead><tbody>"+body+"</tbody><tfoot>"+foot+"</tfoot></table></div>"
    +"<div class='hint' style='margin-top:.7rem'>Total da Folha = soma dos C.C. Infomódulus de pessoal proprio &middot; Total Custo Terceiros = soma dos terceirizados &middot; Custo Total = Folha + Terceiros &middot; % s/ Receita = Custo Total &divide; Receita. "
    +"Meses abertos se atualizam sozinhos; use <b>Fechar</b> para congelar os valores de um mes encerrado.</div></div>";
  setTimeout(flSyncScroll,0);
}
// Barra de rolagem superior sincronizada com a tabela da folha
function flSyncScroll(){
  var w=document.getElementById("fl-wrap"),t=document.getElementById("fl-top"),i=document.getElementById("fl-top-in");if(!w||!t||!i)return;
  i.style.width=w.scrollWidth+"px";t.style.display=w.scrollWidth>w.clientWidth+1?"":"none";
  var lock=false;
  t.onscroll=function(){if(lock){lock=false;return;}lock=true;w.scrollLeft=t.scrollLeft;};
  w.onscroll=function(){if(lock){lock=false;return;}lock=true;t.scrollLeft=w.scrollLeft;};
}
window.addEventListener("resize",function(){if(pg==="folha")flSyncScroll();});
function pct2(x){return (x||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";}
function setReceita(m,val){
  var t=(val||"").toString().trim(),v=t===""?null:parseFloat(t.replace(",","."));
  if(v!==null&&(isNaN(v)||v<0)){alert("Informe um valor valido.");return;}
  if(!DB.receita)DB.receita=[];
  DB.receita=DB.receita.filter(function(r){return r.id!==m;});
  if(v!==null)DB.receita.push({id:m,valor:+v.toFixed(2)});
  dbSave();
  var foco=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.col==="rec"?Array.prototype.indexOf.call(document.querySelectorAll(".ftab .etab-sal"),document.activeElement):-1;
  rFolha();
  if(foco>=0){var el=document.querySelectorAll(".ftab .etab-sal")[foco];if(el)el.focus();}
}
function fecharMes(m){
  var f=folhaMes(m);if(!f)return;
  if(!confirm("Fechar "+fmtM(m)+"?\n\nOs valores deste mes ficam congelados e nao mudam mais com alteracoes de salario ou cadastro. Voce pode reabrir depois."))return;
  if(!DB.folhafech)DB.folhafech=[];
  DB.folhafech=DB.folhafech.filter(function(x){return x.id!==m;});
  DB.folhafech.push({id:m,g:f.g,sem:f.sem,em:new Date().toISOString()});
  dbSave();rFolha();
}
function reabrirMes(m){
  if(!confirm("Reabrir "+fmtM(m)+"? Os valores voltam a ser calculados com os dados atuais."))return;
  DB.folhafech=(DB.folhafech||[]).filter(function(x){return x.id!==m;});
  dbSave();rFolha();
}

];
var ACESSO=null;
function isMasterEmail(e){return e?_sha256(String(e).trim().toLowerCase()).then(function(h){return h===MASTER_HASH;}):Promise.resolve(false);}
// Descobre quem esta logado e quais telas pode usar. null = sem acesso ao sistema
function carregarAcesso(user){
  var email=(user&&user.email||"").trim().toLowerCase();
  if(!email)return Promise.resolve(null);
  return isMasterEmail(email).then(function(m){
    if(m)return {master:true,email:email,nome:"Master",perms:{}};
    return _sb.from("timbo_usuarios").select("email,nome,ativo,perms").eq("email",email).maybeSingle().then(function(r){
      if(r.error||!r.data||r.data.ativo===false)return null;
      return {master:false,email:email,nome:r.data.nome||email,perms:r.data.perms||{}};
    });
  });
}
function permTela(p){
  if(p==="encargos")p="indices"; // mesma permissao da tela Indices
  if(!ACESSO)return "nenhum";
  if(ACESSO.master)return "editar";
  var v=ACESSO.perms[p];
  var t=TELAS.find(function(x){return x.k===p;});
  if(t&&t.soVer&&v==="editar")v="ver";
  return v==="ver"||v==="editar"?v:"nenhum";
}
function primeiraTela(){
  if(permTela("monitor")!=="nenhum")return "monitor";
  if(permTela("dashboard")!=="nenhum")return "dashboard";
  var t=TELAS.find(function(x){return permTela(x.k)!=="nenhum";});
  return t?t.k:null;
}

function acsSalvar(){
  var email=gv("acs-email").trim().toLowerCase(),nome=gv("acs-nome").trim(),ativo=gv("acs-ativo")!=="0";
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){alert("Informe um e-mail valido.");return;}
  if(ACESSO.master&&email===ACESSO.email){alert("Este e-mail ja e o master.");return;}
  if(!ACESSO.master&&email===ACESSO.email&&!confirm("Voce esta alterando as suas proprias permissoes. Continuar?"))return;
  var perms={};TELAS.forEach(function(t){var r=document.querySelector("input[name='acs-"+t.k+"']:checked");var v=r?r.value:"nenhum";if(v!=="nenhum")perms[t.k]=v;});
  var novo=!ACS_LISTA.some(function(x){return x.email===email;});
  var s1=gv("acs-senha"),s2=gv("acs-senha2");
  if(novo&&!s1&&!confirm("Nenhuma senha informada. O login so vai funcionar se este e-mail ja existir no Supabase. Continuar?"))return;
  if(s1&&s1.length<8){alert("A senha precisa ter pelo menos 8 caracteres.");return;}
  if(s1!==s2){alert("As senhas nao conferem.");return;}
  if(!Object.keys(perms).length&&!confirm("Nenhuma tela liberada. O usuario nao vai conseguir usar o sistema. Salvar assim mesmo?"))return;
  var b=document.getElementById("acs-sav");if(b)b.disabled=true;
  _sb.from("timbo_usuarios").upsert({email:email,nome:nome,ativo:ativo,perms:perms,atualizado:new Date().toISOString()}).then(function(r){
    if(r.error)throw new Error(r.error.message);
    if(s1)return _sb.rpc("timbo_definir_senha",{p_email:email,p_senha:s1}).then(function(x){if(x.error)throw new Error("acesso salvo, mas a senha nao foi definida: "+x.error.message);});
  }).then(function(){
    acsFechar();ACS_LISTA=null;rAcessos();
    showSync("Acesso de "+email+" salvo",true);setTimeout(function(){document.getElementById("sync-bar").style.display="none";},2500);
  }).catch(function(e){if(b)b.disabled=false;showSync("Erro ao salvar acesso: "+e.message,false,true);});
}
function acsSenha(email){
  var s=prompt("Nova senha para "+email+" (minimo 8 caracteres):");
  if(s===null)return;
  if(s.length<8){alert("A senha precisa ter pelo menos 8 caracteres.");return;}
  var s2=prompt("Repita a nova senha:");
  if(s2!==s){alert("As senhas nao conferem. Nada foi alterado.");return;}
  _sb.rpc("timbo_definir_senha",{p_email:email,p_senha:s}).then(function(r){
    if(r.error)throw new Error(r.error.message);
    showSync("Senha de "+email+" redefinida",true);setTimeout(function(){document.getElementById("sync-bar").style.display="none";},2500);
  }).catch(function(e){showSync("Erro ao redefinir senha: "+e.message,false,true);});
}
function acsExcluir(email){
  if(!confirm("Remover o acesso de "+email+"?\n\nA pessoa nao entra mais no sistema. (O usuario continua existindo no Supabase Authentication.)"))return;
  _sb.from("timbo_usuarios").delete().eq("email",email).then(function(r){
    if(r.error)throw new Error(r.error.message);
    ACS_LISTA=null;rAcessos();
  }).catch(function(e){showSync("Erro: "+e.message,false,true);});
}

// ═══ CALCULOS AUTOMATICOS SOBRE O SALARIO ═══
function calcSal(sal){
  sal=+sal||0;
  return {terco:+(sal/3).toFixed(2),dec13:+sal.toFixed(2)};
}
// Beneficios do colaborador (valores digitados). anual=true entra no custo mensal dividido por 12
var BENEF=[
  {k:"adic",lb:"Adicional de salario"},
  {k:"hextra",lb:"Hora extra"},
  {k:"pprodPct",lb:"Premio de producao",pct:true},
  {k:"cesta",lb:"Cesta basica"},
  {k:"pmetas",lb:"Premio metas"},
  {k:"bonus",lb:"Bonus anual",anual:true},
  {k:"refeit",lb:"Refeitorio"}
];
// Custo empresa mensal: mensais + provisao mensal (1/12) do 1/3 ferias, 13o e bonus anual
// Assiduidade = Premio Cartao Beneficio (tela Premios) do mes atual, ja com os descontos de faltas/atrasos/5S
function assidInfo(e,mes){
  if(!e||!e.id||isMEI(e))return null;
  var pr=DB.pr.find(function(p){return p.eid===e.id;});if(!pr)return null;
  mes=mes||curMes();
  var d=calcDesc(e.id,mes,pr.val);
  return {bruto:pr.val,pct:d.pct,desc:+d.desc.toFixed(2),rec:+d.rec.toFixed(2),mes:mes};
}
function calcCusto(e,mes){
  mes=mes||e._mes;
  var sal=salMensal(e),c=isMEI(e)?{terco:0,dec13:0}:calcSal(sal),t=sal+(c.terco+c.dec13)/12+encVal(e,"inss")+encVal(e,"fgts");
  var ai=assidInfo(e,mes);if(ai)t+=ai.rec;
  BENEF.forEach(function(b){var v=+e[b.k]||0;t+=b.pct?pprodVal(e):b.anual?v/12:v;});
  return +t.toFixed(2);
}
// Premio de producao = % do mes (lancado no colaborador) sobre o salario
// Terceirizado: C.C. Infomodulus do tipo terceirizado ou categoria marcada como Terceirizado PJ
function isTerceirizado(e){
  var g=e&&e.grupo?(DB.grupos||[]).find(function(x){return x.id===e.grupo;}):null;
  if(g)return g.tipo==="terceiro";
  var c=(pcGet("cfg")||{}).cats||[],nm=pcCatNome(e),k=c.find(function(x){return x.nome===nm;});
  return !!k&&k.tipo==="pj";
}
function pprodVal(e){return typeof e.pprodPct==="number"?+(salMensal(e)*e.pprodPct/100).toFixed(2):0;}
function numVal(id){var t=gv(id).trim();if(t==="")return null;var v=parseFloat(t.replace(",","."));return isNaN(v)||v<0?NaN:v;}
function updSalCalc(){
  var v=numVal("esal"),ok=v!==null&&!isNaN(v),mei=gv("evinc")==="MEI",hora=mei&&gv("emeitipo")==="hora";
  var hrs=numVal("emeihoras");if(hrs===null||isNaN(hrs)||hrs<=0)hrs=220;
  var a=document.getElementById("eterco"),b=document.getElementById("e13"),cu=document.getElementById("ecusto");
  if(!a||!b)return;
  if(!ok||mei){a.value="";b.value="";}
  else{var c=calcSal(v);a.value=fmtBRL(c.terco);b.value=fmtBRL(c.dec13);}
  var sh=document.getElementById("esalhint");
  if(sh){sh.style.display=hora?"":"none";sh.textContent=!hora?"":ok?"Equivalente mensal: "+fmtBRL(v*hrs)+" ("+hrs+"h x "+fmtBRL(v)+")":"Informe o valor da hora; o custo mensal considera "+hrs+"h no mes.";}
  var ai=mei?null:assidInfo({id:gv("eid")}),av=document.getElementById("eassidv");
  if(av)av.value=mei?"Nao se aplica a MEI":ai?fmtBRL(ai.rec)+(ai.pct>0?"  (premio "+fmtBRL(ai.bruto)+" - "+pct1(ai.pct)+" de desconto em "+fmtM(ai.mes)+")":"  (sem descontos em "+fmtM(ai.mes)+")"):"Sem premio cadastrado em Premios";
  if(cu){
    var o={id:gv("eid"),vinc:mei?"MEI":"CLT",meiTipo:hora?"hora":"mensal",meiHoras:hrs,sal:ok?v:undefined},alg=ok||!!ai;
    BENEF.forEach(function(x){var n=numVal("e"+x.k);if(n!==null&&!isNaN(n)){o[x.k]=n;alg=true;}});
    ["inss","fgts"].forEach(function(k){var n=numVal("e"+k),el=document.getElementById("e"+k);if(n!==null&&!isNaN(n)){o[k+"Man"]=n;alg=true;}if(el)el.placeholder="Auto: "+fmtBRL(encAuto(o,k));});
    var eh=document.getElementById("enchint");
    if(eh)eh.textContent=mei&&!encCfg().mei?"MEI: sem INSS/FGTS automatico. Preencha somente se houver encargo.":"Automatico: INSS "+pct2(encPct("inss"))+" e FGTS "+pct2(encPct("fgts"))+" sobre a base de calculo ("+fmtBRL(encBase(o))+"), definida na tela Encargos INSS/FGTS. Digite um valor para substituir; deixe vazio para voltar ao automatico.";
    cu.value=alg?fmtBRL(calcCusto(o)):"";
  }
}
function empresasCad(){
  var s={};DB.emp.forEach(function(e){if(e.empresa)s[e.empresa]=1;});
  ((pcGet("cfg")||{}).cats||[]).forEach(function(c){if(c.nome&&c.nome!=="(Sem categoria)")s[c.nome]=1;});
  return Object.keys(s).sort();
}
function savEmp(){
  var id=gv("eid");
  var nome=gv("enome").trim(),func=gv("efunc").trim(),ccid=gv("ecc"),adm=gv("eadm"),aniv=gv("eaniv");
  var salTx=gv("esal").trim(),sal=salTx===""?null:parseFloat(salTx.replace(",","."));
  if(sal!==null&&(isNaN(sal)||sal<0)){alert("Informe um salario valido.");return;}
  var ativo=gv("eativo")==="1",vinc=gv("evinc")==="MEI"?"MEI":"CLT";
  var empresa=gv("eempresa").trim(),horario=gv("ehorario").trim(),bv={};
  for(var bi=0;bi<BENEF.length;bi++){var nb=numVal("e"+BENEF[bi].k);if(isNaN(nb)){alert("Valor invalido em "+BENEF[bi].lb+".");return;}bv[BENEF[bi].k]=nb;}
  if(!nome||!func||!adm){alert("Preencha nome, funcao e admissao.");return;}
  var old=id?DB.emp.find(function(e){return e.id===id;}):null;
  if(old&&old.dem&&ativo&&!confirm(nome+" esta demitido. Marcar como ativo cancela a demissao. Continuar?"))return;
  var obj=Object.assign({},old||{dem:""},{id:id||uid(),nome:nome,func:func,ccid:ccid,adm:adm,aniv:aniv,ativo:ativo,vinc:vinc});
  if(sal===null){delete obj.sal;delete obj.terco;delete obj.dec13;}
  else{var cs=vinc==="MEI"?{terco:0,dec13:0}:calcSal(sal);obj.sal=+sal.toFixed(2);obj.terco=cs.terco;obj.dec13=cs.dec13;}
  obj.empresa=empresa;obj.horario=horario;
  if(document.getElementById("epcfora")&&document.getElementById("epcfora").checked)obj.pcFora=true;else delete obj.pcFora;
  if(vinc==="MEI"){obj.meiTipo=gv("emeitipo")==="hora"?"hora":"mensal";
    if(obj.meiTipo==="hora"){var hh=numVal("emeihoras");if(isNaN(hh)){alert("Informe as horas por mes validas.");return;}obj.meiHoras=hh&&hh>0?hh:220;}else delete obj.meiHoras;}
  else{delete obj.meiTipo;delete obj.meiHoras;}
  var encM={};for(var ei=0,ek=["inss","fgts"];ei<2;ei++){var nv=numVal("e"+ek[ei]);if(isNaN(nv)){alert("Valor invalido em "+ek[ei].toUpperCase()+".");return;}encM[ek[ei]]=nv;}
  BENEF.forEach(function(b){if(bv[b.k]===null)delete obj[b.k];else obj[b.k]=+bv[b.k].toFixed(2);});
  delete obj.assid;
  ["inss","fgts"].forEach(function(k){if(encM[k]===null)delete obj[k+"Man"];else obj[k+"Man"]=+encM[k].toFixed(2);});
  ["inss","fgts"].forEach(function(k){if(encManual(obj,k)&&Math.abs(obj[k+"Man"]-encAuto(obj,k))<0.005)delete obj[k+"Man"];});
  // valores do formulario = mes selecionado no filtro do Cadastro
  var mmv=empMesSel(),dmv=mvPick(obj);obj.mv=Object.assign({},old&&old.mv||{});
  var oldL=old&&old.mv&&old.mv[mmv]&&old.mv[mmv].salL;if(oldL&&oldL.length&&typeof dmv.sal==="number"&&Math.abs(dmv.sal-salSoma(oldL))<0.01)dmv.salL=oldL;
  if(Object.keys(dmv).length)obj.mv[mmv]=dmv;else delete obj.mv[mmv];
  mvSync(obj);
  obj.custo=calcCusto(obj);
  if(ativo){
    if(obj.inatHist&&old&&!isAtivo(old)){var hj=hoje();obj.inatHist=obj.inatHist.map(function(x){return !x.fim||x.fim>=hj?Object.assign({},x,{fim:x.ini>hj?x.ini:hj}):x;});}
    obj.dem="";delete obj.motdem;delete obj.obsdem;delete obj.inat;delete obj.motinat;delete obj.inatFim;
  }
  else if(!obj.dem){
    var mi=gv("einatmot"),ii=gv("einatini")||hoje(),fi=gv("einatfim");
    if(!mi){alert("Selecione o motivo da inatividade (ou cadastre um novo).");return;}
    if(fi&&fi<ii){alert("A data de fim da inatividade nao pode ser anterior ao inicio.");return;}
    if(!(DB.motafas||[]).some(function(m){return m.tipo==="inat";})){if(!DB.motafas)DB.motafas=[];MI_PAD.forEach(function(x){DB.motafas.push(Object.assign({},x));});}
    var hist=(obj.inatHist||[]).slice(),ix=-1;
    hist.forEach(function(x,i){if(x.ini===(old&&old.inat)||(!x.fim&&old&&!isAtivo(old)))ix=i;});
    var reg={id:ix>=0?hist[ix].id:uid(),mot:mi,ini:ii,fim:fi||""};
    if(ix>=0)hist[ix]=reg;else hist.push(reg);
    obj.inatHist=hist;obj.inat=ii;obj.motinat=mi;obj.inatFim=fi||"";
  }
  if(obj.dem&&adm>obj.dem){alert("A admissao nao pode ser posterior a demissao ("+fmtD(obj.dem)+").");return;}
  if(id){DB.emp=DB.emp.map(function(e){return e.id===id?obj:e;});}else{DB.emp.push(obj);}
  dbSave();rEmp();
}

  area.innerHTML=empExtraArea(e);

function canEmp(){
  ["eid","enome","efunc","eadm","eaniv","esal","eempresa","ehorario","eadic","ehextra","epprodPct","ecesta","eassid","epmetas","ebonus","erefeit","emeihoras","einss","efgts"].forEach(function(id){var el=document.getElementById(id);if(el)el.value="";});

}

function lancInfo(){
  var info=document.getElementById("linfo"),ti=TIPOS.find(function(x){return x.k===lancT;}),fa=lancT==="falta";
  var r1=document.getElementById("lftrow");if(r1)r1.style.display=fa?"":"none";
  var r2=document.getElementById("lmultrow");if(r2)r2.style.display=fa?"":"none";
  if(info&&ti){
    var semD=fa&&lancFT&&!ftDesconta(lancFT),p=getPct(lancT,gv("ldata")||hoje()),n=fa&&lancMulti?lancDias.length:1;
    info.style.background=(semD?"#1a7a4a":ti.co)+"18";info.style.color=semD?"#1a7a4a":ti.co;

    if(fa&&lancMulti)tx+=" &middot; "+n+" dia"+(n!==1?"s":"")+" selecionado"+(n!==1?"s":"")+(!semD&&n>1?" (total -"+Math.min(100,p*n)+"%)":"");
    info.innerHTML="<i class='ti "+ti.ic+"'></i> "+tx;

// Varios dias de falta no mesmo lancamento
var lancMulti=false,lancDias=[];
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function setLancMulti(on){
  lancMulti=!!on;
  var b1=document.getElementById("lm1"),b2=document.getElementById("lm2");
  if(b1)b1.classList.toggle("on",!lancMulti);if(b2)b2.classList.toggle("on",lancMulti);
  var ar=document.getElementById("lmultarea");if(ar)ar.style.display=lancMulti?"":"none";
  var dw=document.getElementById("ldatawrap");if(dw)dw.style.display=lancMulti?"none":"";
  if(lancMulti&&!lancDias.length){var d=gv("ldata");if(d)lancDias=[d];}
  renderLancDias();lancInfo();
}
function addLancDias(){
  var de=gv("lmde"),ate=gv("lmate")||de;
  if(!de){alert("Informe a data inicial.");return;}
  if(ate<de){alert("A data final nao pode ser anterior a inicial.");return;}
  var so=document.getElementById("lmuteis").checked,d=new Date(de+"T12:00:00"),fim=new Date(ate+"T12:00:00"),n=0;
  if((fim-d)/864e5>366){alert("Periodo muito longo (maximo 1 ano).");return;}
  while(d<=fim){
    var ds=ymd(d);
    if(!(so&&de!==ate&&!pcDiaInfo(ds).trab)&&lancDias.indexOf(ds)<0){lancDias.push(ds);n++;}
    d.setDate(d.getDate()+1);
  }
  lancDias.sort();
  if(!n)alert("Nenhum dia novo adicionado (ja estavam na lista ou nao sao dias trabalhados).");
  var ma=document.getElementById("lmate");if(ma)ma.value="";
  renderLancDias();lancInfo();
}
function remLancDia(ds){lancDias=lancDias.filter(function(x){return x!==ds;});renderLancDias();lancInfo();}
function renderLancDias(){
  var el=document.getElementById("lmchips");if(!el)return;
  el.innerHTML=lancDias.length?lancDias.map(function(ds){
    return "<span class='chip'>"+fmtD(ds)+" "+DSEM[new Date(ds+"T12:00:00").getDay()]
      +"<button type='button' onclick=\"remLancDia('"+ds+"')\" aria-label='Remover'><i class='ti ti-x'></i></button></span>";
  }).join(""):"<span style='color:#999;font-size:12px'>Nenhum dia selecionado. Informe a data (ou o periodo) e clique em Adicionar.</span>";
}

function addMotRap(sel){
  var nm=gv(sel+"-nm").trim();
  if(!nm){alert("Informe o nome do motivo.");return;}
  var tipo=sel==="etmotivo"?gv("ettipo"):lancT;
  var ex=DB.motivos.find(function(m){return m.tipo===tipo&&m.nome.toLowerCase()===nm.toLowerCase();});
  var novo=ex||{id:uid(),tipo:tipo,nome:nm,desc:""};
  if(!ex){DB.motivos.push(novo);dbSave();}
  var s=document.getElementById(sel);if(s)s.innerHTML=motOpts(tipo,novo.id);
  document.getElementById(sel+"-nm").value="";
  document.getElementById(sel+"-novo").classList.remove("on");

function savLanc(){
  var eid=gv("lemp"),obs=gv("lobs"),motivo_id=gv("lmotivo");
  var multi=lancT==="falta"&&lancMulti;
  var datas=multi?lancDias.slice():[gv("ldata")].filter(Boolean);
  if(!eid||!datas.length){alert(multi?"Selecione o colaborador e ao menos um dia.":"Selecione colaborador e data.");return;}
  var emp=DB.emp.find(function(e){return e.id===eid;});
  if(emp&&emp.dem){var fora=datas.filter(function(d){return gmk(d)>gmk(emp.dem);});
    if(fora.length){alert("Colaborador demitido em "+fmtD(emp.dem)+". Nao e possivel lancar em "+fora.map(function(d){return fmtD(d);}).join(", ")+".");return;}}
  if(lancT==="falta"&&!lancFT){alert("Selecione o tipo de falta.");var s=document.getElementById("lftsel");if(s)s.focus();return;}
  if(multi){
    var ja={};DB.oc.forEach(function(o){if(o.eid===eid&&o.tipo==="falta")ja[o.data]=1;});
    var dup=datas.filter(function(d){return ja[d];});
    datas=datas.filter(function(d){return !ja[d];});
    if(!datas.length){alert("Todos os dias selecionados ja tem falta lancada para este colaborador.");return;}
    if(dup.length&&!confirm("Ja existe falta lancada em: "+dup.map(function(d){return fmtD(d);}).join(", ")+".\nEsses dias serao ignorados. Lancar os outros "+datas.length+" dia(s)?"))return;
  }
  datas.forEach(function(d){
    var n={id:uid(),eid:eid,tipo:lancT,data:d,obs:obs,motivo_id:motivo_id};if(lancT==="falta")n.ftipo=lancFT;
    DB.oc.push(n);
  });
  dbSave();rLanc();
}

    if(el.dataset.dia){if(dia)dia.style.display=vis?"":"none";dia=el;vis=false;return;}
    var ok=!q||el.dataset.q.indexOf(q)>=0;el.style.display=ok?"":"none";if(ok)vis=true;});
  if(dia)dia.style.display=vis?"":"none";}

    else{btn.style.borderColor="#dfe5ee";btn.style.background="#fff";btn.style.color="#777";}
  });

function savEdtLanc(id){
  var tipo=document.getElementById("ettipo").value,data=document.getElementById("etdata").value,obs=document.getElementById("etobs").value;
  if(!data){alert("Informe a data.");return;}
  var o=DB.oc.find(function(x){return x.id===id;});
  var emp=DB.emp.find(function(e){return e.id===o.eid;});
  if(emp&&emp.dem&&gmk(data)>gmk(emp.dem)){alert(emp.nome+" foi demitido em "+fmtD(emp.dem)+". Data invalida.");return;}
  var etmot=document.getElementById("etmotivo")&&document.getElementById("etmotivo").value||"";
  var etft=tipo==="falta"?gv("etft"):"";
  if(tipo==="falta"&&!etft){alert("Selecione o tipo de falta.");return;}
  DB.oc=DB.oc.map(function(x){if(x.id!==id)return x;var n=Object.assign({},x,{tipo:tipo,data:data,obs:obs,motivo_id:etmot});if(etft)n.ftipo=etft;else delete n.ftipo;return n;});
  dbSave();closeModal();aposEditarLanc();
}

function savMotDemPg(){
  var nm=gv("mdnome").trim();if(!nm){alert("Informe o nome do motivo.");return;}
  if(DB.motdem.find(function(m){return m.nome.toLowerCase()===nm.toLowerCase();})){alert("Esse motivo ja existe.");return;}
  DB.motdem.push({id:uid(),nome:nm});dbSave();rMotivos();
}
function delMotDem(id){
  var cnt=DB.emp.filter(function(e){return e.motdem===id;}).length;
  if(!confirm(cnt?"Este motivo esta em "+cnt+" demissao(oes). Remover mesmo assim? (elas ficarao como Sem motivo)":"Remover este motivo?"))return;
  DB.motdem=DB.motdem.filter(function(m){return m.id!==id;});dbSave();rMotivos();
}
var motTipoSel="falta";
function setMotTipo(t){
  motTipoSel=t;
  var el=document.getElementById("mot-tipo-sel");if(el)el.value=t;
  var bf=document.getElementById("motbf"),ba=document.getElementById("motba");
  if(bf){if(t==="falta"){bf.style.borderColor=RED;bf.style.background=RED+"18";bf.style.color=RED;}else{bf.style.borderColor="#dfe5ee";bf.style.background="#fff";bf.style.color="#777";}}
  if(ba){if(t==="atraso"){ba.style.borderColor=GLD;ba.style.background=GLD+"18";ba.style.color=GLD;}else{ba.style.borderColor="#dfe5ee";ba.style.background="#fff";ba.style.color="#777";}}
  // Update motivo list select
  var sel=document.getElementById("mot-tipo");if(sel)sel.value=t;
}
function savMot(){
  var id=document.getElementById("mot-id").value;
  var tipo=document.getElementById("mot-tipo-sel").value;
  var nome=document.getElementById("mot-nome").value.trim();
  var desc=document.getElementById("mot-desc").value.trim();
  if(!nome){alert("Informe o nome do motivo.");return;}
  var obj={id:id||uid(),tipo:tipo,nome:nome,desc:desc};
  if(id){DB.motivos=DB.motivos.map(function(x){return x.id===id?obj:x;});}else{DB.motivos.push(obj);}
  dbSave();canMot();rMotivos();
}
function edtMot(id){
  var m=DB.motivos.find(function(x){return x.id===id;});if(!m)return;
  document.getElementById("mot-id").value=id;
  document.getElementById("mot-nome").value=m.nome;
  document.getElementById("mot-desc").value=m.desc||"";
  document.getElementById("mot-ft").textContent="Editar motivo";
  document.getElementById("mot-cb").style.display="";
  document.querySelector("#p-motivos .btnp").textContent="Salvar alteracoes";
  setMotTipo(m.tipo);
}
function canMot(){
  ["mot-id","mot-nome","mot-desc"].forEach(function(id){var el=document.getElementById(id);if(el)el.value="";});
  document.getElementById("mot-ft").textContent="Novo motivo";
  document.getElementById("mot-cb").style.display="none";
  var btn=document.querySelector("#p-motivos .btnp");if(btn)btn.textContent="Cadastrar";
}
function delMot(id){
  if(!confirm("Remover este motivo?"))return;
  DB.motivos=DB.motivos.filter(function(x){return x.id!==id;});
  dbSave();rMotivos();
}
function savSen(){
  var id=document.getElementById("sen-id").value;
  var nome=document.getElementById("sen-nome").value.trim();
  var desc=document.getElementById("sen-desc").value.trim();
  var cor=document.getElementById("sen-cor").value||PUR;
  if(!nome){alert("Informe o nome do senso.");return;}

  if(id){DB.sensos=DB.sensos.map(function(x){return x.id===id?obj:x;});}else{DB.sensos.push(obj);}

}

function s5Base(){
  var modo=gv("s5modo")||s5Modo;
  var ccid=gv("s5cc");
  var ativos=DB.emp.filter(ativoVis);
  if(modo==="geral")return ativos.map(function(e){return e.id;});
  return ccid?ativos.filter(function(e){return e.ccid===ccid;}).map(function(e){return e.id;}):[];
}
function s5Reset(){s5Sel=s5Base();upd5SPreview();}
function s5Rem(id){s5Sel=s5Sel.filter(function(x){return x!==id;});upd5SPreview();}
function s5Add(id){if(id&&s5Sel.indexOf(id)<0)s5Sel.push(id);upd5SPreview();}
function setModo5S(m){
  s5Modo=m;
  var el=document.getElementById("s5modo");if(el)el.value=m;
  var bgeral=document.getElementById("s5mgeral"),bcc=document.getElementById("s5mcc");
  var ccrow=document.getElementById("s5ccrow");
  if(m==="geral"){
    if(bgeral){bgeral.style.borderColor=RED;bgeral.style.background=RED+"18";bgeral.style.color=RED;}
    if(bcc){bcc.style.borderColor="#dfe5ee";bcc.style.background="#fff";bcc.style.color="#777";}
    if(ccrow)ccrow.style.display="none";
  }else{
    if(bcc){bcc.style.borderColor=BL;bcc.style.background=BL+"18";bcc.style.color=BL;}
    if(bgeral){bgeral.style.borderColor="#dfe5ee";bgeral.style.background="#fff";bgeral.style.color="#777";}
    if(ccrow)ccrow.style.display="";
  }
  s5Reset();
}
function upd5SPreview(){
  var pl=document.getElementById("s5prevlist");if(!pl)return;
  var modo=gv("s5modo")||"geral",ccid=gv("s5cc");
  var base=s5Base();
  var emps=s5Sel.map(function(id){return DB.emp.find(function(e){return e.id===id;});}).filter(Boolean)
    .sort(function(a,b){return a.nome.localeCompare(b.nome);});
  var alterado=base.length!==s5Sel.length||base.some(function(id){return s5Sel.indexOf(id)<0;});
  var rb=document.getElementById("s5restore");if(rb)rb.style.display=alterado?"":"none";
  if(emps.length===0){
    pl.innerHTML="<span style='color:#aaa'>Nenhum colaborador"+(modo==="cc"&&!ccid?" (selecione um C.C. Senior ou adicione abaixo)":"")+"</span>";
  }else{
    pl.innerHTML="<strong style='color:"+B+"'>"+emps.length+"</strong> colaborador"+(emps.length!==1?"es":"")+" afetado"+(emps.length!==1?"s":"")
      +" <span style='color:#9aa3ad'>&middot; clique no x para excluir</span>"
      +"<div style='display:flex;flex-wrap:wrap;gap:4px;margin-top:6px'>"
      +emps.map(function(e){
        var extra=base.indexOf(e.id)<0;
        return "<span class='chip"+(extra?" add":"")+"' title='"+esc(e.nome)+(extra?" (adicionado manualmente)":"")+"'>"+esc(nome1(e))
          +"<button type='button' onclick=\"s5Rem('"+e.id+"')\" aria-label='Excluir "+esc(e.nome)+"'><i class='ti ti-x'></i></button></span>";
      }).join("")
      +"</div>";
  }
  var add=document.getElementById("s5add");
  if(add){
    var fora=DB.emp.filter(function(e){return ativoVis(e)&&s5Sel.indexOf(e.id)<0;}).sort(function(a,b){return a.nome.localeCompare(b.nome);});
    add.innerHTML="<option value=''>+ Adicionar colaborador"+(fora.length?" ("+fora.length+" disponive"+(fora.length!==1?"is":"l")+")":"")+"</option>"
      +fora.map(function(e){var c=DB.cc.find(function(x){return x.id===e.ccid;});return "<option value='"+e.id+"'>"+esc(e.nome)+(c?" - "+esc(c.cod):"")+"</option>";}).join("");
    add.disabled=fora.length===0;
  }
}
function sav5S(){
  var id=gv("s5id");
  var modo=gv("s5modo");
  var ccid=gv("s5cc");
  var data=gv("s5data");
  var obs=gv("s5obs").trim();
  if(!data){alert("Informe a data.");return;}
  if(modo==="cc"&&!ccid){alert("Selecione o C.C. Senior.");return;}
  var emps=s5Sel.map(function(x){return DB.emp.find(function(e){return e.id===x;});}).filter(Boolean);
  if(emps.length===0){alert("Nenhum colaborador afetado. Adicione ao menos um colaborador.");return;}
  var s5senso=gv("s5senso");
  var obj={id:id||uid(),modo:modo,ccid:modo==="cc"?ccid:"",data:data,obs:obs,senso_id:s5senso,eids:emps.map(function(e){return e.id;})};
  if(id){
    DB.oc5=DB.oc5.map(function(x){return x.id===id?obj:x;});
    DB.oc=DB.oc.filter(function(o){return o.s5ref!==id;});
  }else{
    DB.oc5.push(obj);
  }
  emps.forEach(function(e){
    DB.oc.push({id:uid(),eid:e.id,tipo:"5s",data:data,obs:obs,s5ref:obj.id,senso_id:s5senso});
  });
  dbSave();r5S();
  if(pg==="dashboard"){rDash();reopenDrill();}
}
function edt5S(id){
  var o=DB.oc5.find(function(x){return x.id===id;});if(!o)return;
  can5S();
  document.getElementById("s5id").value=id;
  document.getElementById("s5data").value=o.data;
  document.getElementById("s5obs").value=o.obs||"";
  var ss=document.getElementById("s5senso");if(ss)ss.value=o.senso_id||"";
  document.getElementById("s5ft").textContent="Editar infracao 5S";
  document.getElementById("s5sav").textContent="Salvar alteracoes";
  if(o.modo==="cc"){var cc=document.getElementById("s5cc");if(cc)cc.value=o.ccid||"";}
  setModo5S(o.modo);
  // lista salva (inclui ajustes manuais); registros antigos: colaboradores que receberam o desconto
  s5Sel=s5Afetados(o).map(function(e){return e.id;});
  upd5SPreview();
  openMd("md-5s");
}
function can5S(){
  var i=document.getElementById("s5id");if(!i)return;
  i.value="";
  document.getElementById("s5data").value=hoje();
  document.getElementById("s5obs").value="";
  var ss=document.getElementById("s5senso");if(ss)ss.value="";
  var cc=document.getElementById("s5cc");if(cc)cc.value="";
  document.getElementById("s5ft").textContent="Nova infracao 5S";
  document.getElementById("s5sav").textContent="Lancar Infracao 5S";
  setModo5S("geral");
  closeMd("md-5s");
}
function del5S(id){
  if(!confirm("Remover esta infracao 5S e todos os descontos vinculados?"))return;
  DB.oc5=DB.oc5.filter(function(x){return x.id!==id;});
  DB.oc=DB.oc.filter(function(o){return o.s5ref!==id;});
  dbSave();r5S();
  if(pg==="dashboard"){rDash();reopenDrill();}
}

function aplTodos(){
  var v=parseFloat(document.getElementById("ptodos").value);
  if(isNaN(v)||v<=0){alert("Informe um valor valido.");return;}
  var ativos=DB.emp.filter(function(e){return ativoVis(e)&&!isMEI(e);});
  if(!confirm("Aplicar "+fmtBRL(v)+" para todos os "+ativos.length+" colaboradores CLT ativos?"))return;
  ativos.forEach(function(e){DB.pr=DB.pr.filter(function(p){return p.eid!==e.id;});DB.pr.push({eid:e.id,val:v});});
  dbSave();rPrem();var inp=document.getElementById("ptodos");if(inp)inp.value=v;
}
function savPr(eid){
  var v=parseFloat(document.getElementById("pv"+eid).value);
  if(isNaN(v)||v<=0){alert("Informe um valor valido.");return;}
  DB.pr=DB.pr.filter(function(p){return p.eid!==eid;});DB.pr.push({eid:eid,val:v});dbSave();rPrem();
}

var MPAL=["#1E5BC6","#c0392b","#e6a817","#7b3fa0","#1a7a4a","#00348F","#e67e22","#5d6d7e","#16a085","#d35400"];
function rMon(){
  killCH();
  var anoAtual=String(new Date().getFullYear());
  var selAno=gv("mon-ano")||anoAtual;
  var selMes=gv("mon-mes")||curMes();
  selMes=selAno+"-"+selMes.split("-")[1];

  var anos={};anos[anoAtual]=1;
  DB.emp.forEach(function(e){if(!vis(e))return;if(e.adm)anos[e.adm.slice(0,4)]=1;if(e.dem)anos[e.dem.slice(0,4)]=1;});
  var anoOpts=Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");

  function fimMes(m){var p=m.split("-");var d=new Date(+p[0],+p[1],0);return p[0]+"-"+p[1]+"-"+String(d.getDate()).padStart(2,"0");}
  function prevMes(m){var p=m.split("-").map(Number);var d=new Date(p[0],p[1]-2,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
  var EMPV=DB.emp.filter(vis),ocV=ocVisF();
  function quadro(m,fn){var f=fimMes(m);return EMPV.filter(function(e){return (!e.adm||e.adm<=f)&&(!e.dem||e.dem>f)&&(!fn||fn(e));}).length;}
  function contr(m){return EMPV.filter(function(e){return e.adm&&e.adm.slice(0,7)===m;});}
  function demit(m){return EMPV.filter(function(e){return e.dem&&e.dem.slice(0,7)===m;});}

  var ultimo=selAno===anoAtual?new Date().getMonth()+1:12;
  if(selAno>anoAtual)ultimo=12;
  var meses=[];for(var i=1;i<=ultimo;i++)meses.push(selAno+"-"+String(i).padStart(2,"0"));
  var lbl=meses.map(function(m){return MOS[parseInt(m.split("-")[1],10)-1];});
  var GPALQ=["#00348F","#1E5BC6","#16a085","#e6a817","#7b3fa0","#a868d0","#d35400","#5d6d7e","#c0392b","#1a7a4a"];
  var gsQ=gruposOrd(),idsQ={};gsQ.forEach(function(g){idsQ[g.id]=1;});
  var aQuadroG=gsQ.map(function(g,i){return{id:g.id,lb:g.nome,cor:GPALQ[i%GPALQ.length],data:meses.map(function(m){return quadro(m,function(e){return e.grupo===g.id;});})};});
  var semGQ=meses.map(function(m){return quadro(m,function(e){return !(e.grupo&&idsQ[e.grupo]);});});
  if(semGQ.some(function(v){return v>0;}))aQuadroG.push({id:"_sem",lb:"Sem C.C. Infomódulus",cor:"#b0b8c1",data:semGQ});
  var aQuadro=meses.map(function(m){return quadro(m);}),aContr=meses.map(function(m){return contr(m).length;}),aDem=meses.map(function(m){return demit(m).length;});

  var ativos=EMPV.filter(isAtivo).length,inativos=EMPV.length-ativos;
  var nClt=EMPV.filter(function(e){return isAtivo(e)&&!isMEI(e);}).length;
  var nTerc=EMPV.filter(function(e){return isAtivo(e)&&isTerceirizado(e);}).length;
  var qMes=quadro(selMes),qIni=quadro(prevMes(selMes));
  var cMes=contr(selMes),dMes=demit(selMes);
  var media=(qIni+qMes)/2;
  var turn=media>0?((cMes.length+dMes.length)/2)/media*100:0;
  var mlb=fmtM(selMes);
  var dAno=EMPV.filter(function(e){return e.dem&&e.dem.slice(0,4)===selAno;});
  var cAno=EMPV.filter(function(e){return e.adm&&e.adm.slice(0,4)===selAno;});

  function motBD(list){
    var map={};list.forEach(function(e){var n=motDemNome(e.motdem);map[n]=(map[n]||0)+1;});
    var lbs=Object.keys(map).sort(function(a,b){return map[b]-map[a];});
    return{labels:lbs,values:lbs.map(function(k){return map[k];}),colors:lbs.map(function(k){var i=DB.motdem.findIndex(function(m){return m.nome===k;});return i<0?"#9aa3ad":MPAL[i%MPAL.length];})};
  }
  var bdMes=motBD(dMes),bdAno=motBD(dAno);

  // ABSENTEISMO = faltas / (colaboradores x dias uteis) x 100  (dias uteis = seg a sex; mes atual conta ate hoje)
  function diasUteis(m){
    var p=m.split("-").map(Number),hj=hoje(),n=0,last=new Date(p[0],p[1],0).getDate();
    for(var d=1;d<=last;d++){
      var ds=m+"-"+String(d).padStart(2,"0");
      if(ds>hj)break;
      var w=new Date(p[0],p[1]-1,d).getDay();
      if(w!==0&&w!==6)n++;
    }
    return n;
  }
  function absent(m,ccid){
    var f=fimMes(m),ini=m+"-01";
    var emps=EMPV.filter(function(e){return (!e.adm||e.adm<=f)&&(!e.dem||e.dem>=ini)&&(ccid===undefined||(e.ccid||"")===ccid);});
    var ids={};emps.forEach(function(e){ids[e.id]=1;});
    var faltas=DB.oc.filter(function(o){return o.tipo==="falta"&&gmk(o.data)===m&&ocV(o)&&(ccid===undefined||ids[o.eid]);}).length;
    var atrasos=DB.oc.filter(function(o){return o.tipo==="atraso"&&gmk(o.data)===m&&ocV(o)&&(ccid===undefined||ids[o.eid]);}).length;
    var du=diasUteis(m),base=emps.length*du;
    return{pct:base>0?faltas/base*100:0,faltas:faltas,atrasos:atrasos,du:du,hc:emps.length};
  }
  var aAbs=meses.map(function(m){return absent(m);});
  var absMes=absent(selMes);
  var absAnoF=0,absAnoB=0;
  meses.forEach(function(m,i){absAnoF+=aAbs[i].faltas;absAnoB+=aAbs[i].hc*aAbs[i].du;});
  var absAno=absAnoB>0?absAnoF/absAnoB*100:0;
  var duAno=aAbs.reduce(function(a,r){return a+r.du;},0);
  // acumulado do ano mes a mes (faltas somadas / base somada)
  var accF=0,accB=0,aAbsAcc=aAbs.map(function(r){accF+=r.faltas;accB+=r.hc*r.du;return accB>0?accF/accB*100:0;});
  // absenteismo do ano por C.C. Senior
  function absentAno(ccid){
    var f=0,b=0,hc={};
    meses.forEach(function(m){var r=absent(m,ccid);f+=r.faltas;b+=r.hc*r.du;});
    return{pct:b>0?f/b*100:0,faltas:f};
  }
  // absenteismo do ano por colaborador (dias uteis dos meses em que estava na empresa)
  var rankAbs=EMPV.map(function(e){
    var du=0,f=0;
    meses.forEach(function(m){
      var fim=fimMes(m),ini=m+"-01";
      if(!((!e.adm||e.adm<=fim)&&(!e.dem||e.dem>=ini)))return;
      du+=diasUteis(m);
      f+=DB.oc.filter(function(o){return o.eid===e.id&&o.tipo==="falta"&&gmk(o.data)===m;}).length;
    });
    return{e:e,f:f,du:du,pct:du>0?f/du*100:0};
  }).filter(function(x){return x.f>0;}).sort(function(a,b){return b.pct-a.pct||b.f-a.f;});
  var ccAbs=DB.cc.map(function(c){var r=absent(selMes,c.id);r.lb=c.cod+" - "+c.desc;r.ano=absentAno(c.id);return r;});
  var semCC=absent(selMes,"");semCC.ano=absentAno("");if(semCC.hc>0||semCC.ano.faltas>0){semCC.lb="Sem C.C. Senior";ccAbs.push(semCC);}
  ccAbs=ccAbs.filter(function(r){return r.hc>0||r.ano.pct>0;}).sort(function(a,b){return b.ano.pct-a.ano.pct||b.pct-a.pct;});
  function pctF(v){return v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:2})+"%";}

  var movs=cMes.map(function(e){return{t:"c",d:e.adm,e:e};}).concat(dMes.map(function(e){return{t:"d",d:e.dem,e:e};}))
    .sort(function(a,b){return b.d.localeCompare(a.d);});
  var movHTML=movs.length===0?"<div class='empty' style='padding:1.5rem'><i class='ti ti-arrows-exchange'></i>Sem admissoes ou demissoes em "+mlb+"</div>":
    movs.map(function(x){
      var c=x.t==="c";
      return "<div style='display:flex;align-items:center;gap:10px;padding:.5rem 0;border-bottom:1px solid #f1f4f8'>"
        +"<div style='width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:"+(c?GRN:RED)+"18;color:"+(c?GRN:RED)+"'><i class='ti "+(c?"ti-user-plus":"ti-user-minus")+"' style='font-size:16px'></i></div>"
        +"<div style='min-width:0;flex:1'><div style='font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>"+esc(x.e.nome)+"</div>"
        +"<div style='font-size:11px;color:#999'>"+(c?"Admissao":"Demissao")+" em "+fmtD(x.d)+(c?"":" &middot; "+esc(motDemNome(x.e.motdem)))+"</div></div></div>";
    }).join("");

  function kpi(lb,v,c,sub){return "<div class='mon-kpi' style='--c:"+c+"'><div class='k-l'>"+lb+"</div><div class='k-v'>"+v+"</div><div class='k-s'>"+esc(sub)+"</div></div>";}
  function chartCard(title,color,icon,inner,h){
    return "<div class='card'>"
      +"<div class='mon-tt' style='color:"+color+"'><i class='ti "+icon+"'></i>"+title+"</div>"
      +(h?"<div style='height:"+h+"px;position:relative'>"+inner+"</div>":inner)+"</div>";
  }
  function semDados(msg){return "<div class='empty' style='padding:1.5rem 1rem'><i class='ti ti-chart-pie'></i>"+msg+"</div>";}

  document.getElementById("p-monitor").innerHTML=
    "<div class='pg-hd'><div><h1 class='h1'>Monitoramento de Colaboradores</h1>"
    +"<div class='sub'>Quadro, contratacoes, demissoes, absenteismo e motivos de saida</div></div>"
    +"<div style='display:flex;align-items:center;gap:8px;flex-wrap:wrap'>"
    +"<div style='display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #dfe5ee;border-radius:8px;padding:.35rem .75rem'>"
    +"<i class='ti ti-calendar' style='color:#888;font-size:15px'></i><span style='font-size:12px;color:#555;font-weight:600'>Ano:</span>"
    +"<select id='mon-ano' onchange='rMon()' style='border:none;outline:none;box-shadow:none;font-size:13px;color:"+B+";font-weight:700;background:transparent;width:auto;padding:0'>"+anoOpts+"</select></div>"

    if(gid==="_all"){var k=e.grupo&&ids[e.grupo]?e.grupo:"_sem";return o.indexOf(k)<0;}
    if(gid==="_sem")return !(e.grupo&&ids[e.grupo]);

  }).sort(function(a,b){return (a.empresa||"").localeCompare(b.empresa||"")||a.nome.localeCompare(b.nome);});

      +(permTela("employees")==="editar"?"<td class='act'><button class='ibedt' title='Editar cadastro' onclick=\"fecharMonGrupo();go('employees');setTimeout(function(){edtEmp('"+e.id+"');},40)\"><i class='ti ti-edit'></i></button></td>":"")+"</tr>";
  }).join("");

    +"<div class='sub' style='font-size:12px'>"+fmtM(mes)+" &middot; "+lista.length+" colaborador"+(lista.length!==1?"es":"")+" &middot; custo mensal "+fmtBRL(tc)+"</div></div>"

    +"<div class='mdl-bd' style='padding-top:.6rem'>"

      +"<th style='cursor:default'>FUNCIONÁRIO</th><th style='cursor:default'>CATEGORIA</th><th class='c' style='cursor:default'>FUNÇÃO</th>"

// ═══ KIT PDF PADRAO TIMBÓ (cabecalho com logo, paineis, tabelas, rodape) ═══
function mkPdfKit(titulo,periodo,orient,papel){
  var retrato=orient==="portrait",a3=papel==="a3";
  var doc=new window.jspdf.jsPDF({unit:"mm",format:a3?"a3":"a4",orientation:retrato?"portrait":"landscape",compress:true});
  var lg=a3?420:297,ct=a3?297:210;
  var K={doc:doc,W:retrato?ct:lg,H:retrato?lg:ct,mg:12,BANDH:27,PX:7};
  K.cw=K.W-K.mg*2;
  var C=K.C={ink:[10,31,74],b:[0,52,143],bl:[30,91,198],red:[192,57,43],grn:[26,122,74],gld:[230,168,23],pur:[123,63,160],org:[211,84,0],dk:[122,47,0],line:[226,231,238],txt:[60,60,60],mut:[140,140,140]};
  function fill(c){doc.setFillColor(c[0],c[1],c[2]);}
  function txt(c){doc.setTextColor(c[0],c[1],c[2]);}
  function font(sz,b){doc.setFont("helvetica",b?"bold":"normal");doc.setFontSize(sz);}
  K.fill=fill;K.txt=txt;K.font=font;
  var agora=new Date(),gerado=agora.toLocaleDateString("pt-BR")+" às "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  K.header=function(){
    fill([255,255,255]);doc.rect(0,0,K.W,K.BANDH,"F");
    if(window._logoPNG)doc.addImage(window._logoPNG,"PNG",K.mg-1.5,6.5,30.8,14);
    else{font(18,true);txt(C.b);doc.text("TIMBÓ",K.mg,16);}
    font(15,true);txt(C.ink);doc.text(titulo,K.W-K.mg,11.5,{align:"right"});
    font(8.5);txt([95,105,120]);doc.text(periodo,K.W-K.mg,17.5,{align:"right"});
    font(7);txt([150,158,170]);doc.text("Gerado em "+gerado,K.W-K.mg,22,{align:"right"});
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.4);doc.line(K.mg,K.BANDH,K.W-K.mg,K.BANDH);
    return K.BANDH+8;
  };
  K.section=function(t,y,c){fill(c||C.b);doc.rect(K.mg,y-3.1,2.2,2.2,"F");font(10.5,true);txt([45,45,45]);doc.text(t,K.mg+4.5,y);};
  K.panel=function(x,y,w,h){doc.setFillColor(255,255,255);doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.35);doc.roundedRect(x,y,w,h,2,2,"FD");};
  K.kpi=function(x,y,w,h,lb,val,sub,c){
    K.panel(x,y,w,h);fill(c);doc.rect(x,y,w,1.2,"F");
    font(6.2,true);txt(C.mut);var lbs=doc.splitTextToSize(lb.toUpperCase(),w-5).slice(0,2);
    doc.text(lbs,x+2.8,y+5.4,{lineHeightFactor:1.15});
    var vy=lbs.length>1?y+14.6:y+12.4;
    font(12.5,true);txt(c);doc.text(String(val),x+2.8,vy);
    if(sub){font(6);txt(C.mut);var ls=doc.splitTextToSize(sub,w-5);doc.text(ls[0],x+2.8,vy+4.4);}
  };
  K.chartImg=function(cfg,wmm,hmm){
    if(!cfg)return null;
    var cv=document.createElement("canvas");cv.width=Math.round(wmm*K.PX);cv.height=Math.round(hmm*K.PX);
    cv.style.position="fixed";cv.style.left="-99999px";document.body.appendChild(cv);
    var ch=new Chart(cv,cfg);var img=ch.toBase64Image();ch.destroy();cv.remove();return img;
  };
  K.chartPanel=function(cfg,x,y,w,h,t,c,nota){
    K.panel(x,y,w,h);font(9,true);txt(c);doc.text(t,x+4,y+6.5);
    if(nota){font(7);txt(C.mut);doc.text(nota,x+w-4,y+6.5,{align:"right"});}
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x+4,y+8.8,x+w-4,y+8.8);
    var aw=w-8,ah=h-13;var img=typeof cfg==="function"?K.chartImg(cfg(aw,ah),aw,ah):K.chartImg(cfg,aw,ah);
    if(!img){font(8.5);txt([185,185,185]);doc.text("Sem dados no período",x+w/2,y+h/2,{align:"center"});return;}
    doc.addImage(img,"PNG",x+4,y+10.5,aw,ah);
  };
  K.table=function(y,cols,rows,opt){
    opt=opt||{};var rh=opt.rh||5.6,x=opt.x||K.mg,tw=cols.reduce(function(a,c){return a+c.w;},0),fs=opt.fs||7.2;
    function head(){
      font(fs+.1,true);
      // cabecalho quebra em ate 2 linhas quando o titulo nao cabe na coluna
      var linhas=cols.map(function(c){var l=doc.splitTextToSize(c.h,c.w-2.4);if(l.length>2){l=[l[0],l.slice(1).join(" ")];}
        return l.map(function(t){while(t.length>3&&doc.getTextWidth(t)>c.w-2.2)t=t.slice(0,-1);return t;});});
      var nl=Math.max.apply(null,linhas.map(function(l){return l.length;})),lh=(fs+.1)*0.42,hh=rh+.6+(nl-1)*lh;
      fill(C.b);doc.rect(x,y,tw,hh,"F");txt([255,255,255]);
      var cx=x;cols.forEach(function(c,i){var l=linhas[i],y0=y+hh/2-(l.length-1)*lh/2+1.5;
        l.forEach(function(t,j){doc.text(t,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y0+j*lh,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});});cx+=c.w;});
      y+=hh;
    }
    head();
    rows.forEach(function(r,i){
      if(y+rh>K.H-14){doc.addPage();y=K.header();if(opt.titulo)K.section(opt.titulo+" (continuação)",y,opt.cor);y+=4;head();}
      if(r._total){fill(r._grand?[200,215,238]:[226,236,246]);doc.rect(x,y,tw,rh+.4,"F");}
      else if(r._bg){fill(r._bg);doc.rect(x,y,tw,rh,"F");}
      else if(r._hl){fill([227,240,250]);doc.rect(x,y,tw,rh,"F");}
      else if(i%2===1){fill([248,250,252]);doc.rect(x,y,tw,rh,"F");}
      var cx=x;
      cols.forEach(function(c){
        var v=r[c.k];v=v===undefined||v===null?"":String(v);
        font(fs,r._total||r._hl||c.b);
        while(v.length>3&&doc.getTextWidth(v)>c.w-3)v=v.slice(0,-2);
        txt(r._total&&!c.cor?C.b:(r._cor||(c.cor?c.cor(r):C.txt)));
        doc.text(v,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y+rh/2+1.5,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});
        cx+=c.w;
      });
      y+=r._total?rh+.4:rh;
    });
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x,y,x+tw,y);
    return y;
  };
  K.finalizar=function(nome){
    var n=doc.getNumberOfPages();
    for(var p=1;p<=n;p++){
      doc.setPage(p);doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.3);doc.line(K.mg,K.H-9,K.W-K.mg,K.H-9);
      font(7.2);txt([160,160,160]);
      doc.text("Timbó Papéis Especiais - Gestão de Prêmios",K.mg,K.H-5);
      doc.text(titulo,K.W/2,K.H-5,{align:"center"});
      doc.text("Página "+p+"/"+n,K.W-K.mg,K.H-5,{align:"right"});
    }
    doc.save(nome);
  };
  return K;
}

// Monta os dados do relatorio: secoes por C.C. Senior, linhas e totais
function ccRelDados(ccSel,sit,comSem){
  var ids={};DB.cc.forEach(function(c){ids[c.id]=1;});
  var secs=[];
  var alvo=ccSel==="_sem"?[]:ccSel?ccOrd().filter(function(c){return c.id===ccSel;}):ccOrd();
  function linha(e){
    var v=function(k){var x=empCampoVal(e,k);return x===null?0:x;};
    var sal=v("sal"),te=+(v("terco")/12).toFixed(2),d13=+(v("dec13")/12).toFixed(2),inss=v("inss"),fgts=v("fgts"),cu=v("custo"); // 1/3 e 13º como provisao mensal (igual ao custo empresa)
    var out=+(cu-sal-te-d13-inss-fgts).toFixed(2);if(Math.abs(out)<0.015)out=0; // residuo de arredondamento
    return {nome:e.nome,empresa:e.empresa||"",func:e.func||"",grupo:empTxt(e,"grupo"),sit:empSitTxt(e),adm:e.adm?fmtD(e.adm):"",
      sal:sal,terco:te,dec13:d13,inss:inss,fgts:fgts,enc:inss+fgts,outros:out,custo:cu};
  }
  function filtra(fn){return DB.emp.filter(function(e){return (sit==="todos"||isAtivo(e))&&fn(e);})
    .sort(function(a,b){return (a.func||"").localeCompare(b.func||"")||a.nome.localeCompare(b.nome);}).map(linha);}
  alvo.forEach(function(c){secs.push({cod:c.cod,desc:c.desc,resp:c.resp||"",rows:filtra(function(e){return e.ccid===c.id;})});});
  if(ccSel==="_sem"||(!ccSel&&comSem)){
    var r=filtra(function(e){return !(e.ccid&&ids[e.ccid]);});
    if(r.length||ccSel==="_sem")secs.push({cod:"—",desc:"Sem C.C. Senior",resp:"",rows:r,sem:true});
  }
  var NUM=["sal","terco","dec13","inss","fgts","enc","outros","custo"];
  secs.forEach(function(sc){sc.tot={};NUM.forEach(function(k){sc.tot[k]=+sc.rows.reduce(function(a,r){return a+r[k];},0).toFixed(2);});});
  var tot={n:0};NUM.forEach(function(k){tot[k]=+secs.reduce(function(a,sc){return a+sc.tot[k];},0).toFixed(2);});
  tot.n=secs.reduce(function(a,sc){return a+sc.rows.length;},0);
  return {secs:secs,tot:tot};
}

function gerarCCRelPDF(o,D){
  if(!(window.jspdf&&window.jspdf.jsPDF)){alert("As bibliotecas ainda estao carregando. Aguarde alguns segundos e tente novamente.");return;}
  var K=mkPdfKit("Colaboradores por C.C. Senior",ccRelPeriodo(o,D),o.ori,"a4"),doc=K.doc,C=K.C,cw=K.cw;

  var fs=o.ori==="portrait"?7:7.2;

  var y=K.header();

  K.kpi(K.mg,y,kw,kh,"C.C. Senior",D.secs.length,"no relatório",C.b);
  K.kpi(K.mg+(kw+gap),y,kw,kh,"Colaboradores",D.tot.n,o.sit==="todos"?"ativos e inativos":"ativos",C.bl);
  K.kpi(K.mg+2*(kw+gap),y,kw,kh,"Folha (salários)",fmtBRL(D.tot.sal),"soma dos salários",C.grn);
  K.kpi(K.mg+3*(kw+gap),y,kw,kh,"Custo empresa mensal",fmtBRL(D.tot.custo),"salário + encargos + benefícios",C.org);
  y+=kh+9;
  D.secs.forEach(function(sc){
    if(y+24>K.H-14){doc.addPage();y=K.header();}
    var tit=(sc.sem?"":sc.cod+" - ")+sc.desc;
    K.section(tit,y,sc.sem?C.gld:C.b);
    K.font(7.5);K.txt(C.mut);
    doc.text((sc.resp?"Responsável: "+sc.resp+"   ·   ":"")+sc.rows.length+" colaborador"+(sc.rows.length!==1?"es":"")+"   ·   Custo mensal: "+fmtBRL(sc.tot.custo),K.W-K.mg,y,{align:"right"});
    y+=3;
    var rows=sc.rows.map(fmtRow);
    if(!rows.length)rows=[{nome:"Nenhum colaborador neste C.C. Senior"}];
    var tr={_total:true};cols.forEach(function(c){tr[c.k]=c.m?fmtBRL(sc.tot[c.k]):"";});tr.nome="TOTAL DO C.C. SENIOR";
    rows.push(tr);
    y=K.table(y,tcols,rows,{fs:fs,titulo:tit,cor:sc.sem?C.gld:C.b})+8;
  });
  // Resumo
  if(D.secs.length>1){
    if(y+30>K.H-14){doc.addPage();y=K.header();}
    K.section("Resumo por C.C. Senior",y,C.b);y+=3;
    var rc=[{k:"cod",h:"CÓDIGO",p:.8,al:"c"},{k:"desc",h:"C.C. SENIOR",p:2.6},{k:"n",h:"COLAB.",p:.7,al:"c"},{k:"sal",h:"SALÁRIOS",p:1.3,al:"r"},
      {k:"enc",h:"ENCARGOS",p:1.2,al:"r"},{k:"custo",h:"CUSTO EMPRESA MENSAL",p:1.4,al:"r"},{k:"pct",h:"% DO TOTAL",p:.8,al:"r"}];
    var rp=rc.reduce(function(a,c){return a+c.p;},0);
    var rcols=rc.map(function(c){return {k:c.k,h:c.h,w:cw*c.p/rp,al:c.al,b:c.k==="custo"};});
    var rr=D.secs.map(function(sc){return {cod:sc.cod,desc:sc.desc,n:sc.rows.length,sal:fmtBRL(sc.tot.sal),enc:fmtBRL(sc.tot.enc),custo:fmtBRL(sc.tot.custo),
      pct:(D.tot.custo?sc.tot.custo/D.tot.custo*100:0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%"};});
    rr.push({_total:true,_grand:true,cod:"",desc:"TOTAL GERAL",n:D.tot.n,sal:fmtBRL(D.tot.sal),enc:fmtBRL(D.tot.enc),custo:fmtBRL(D.tot.custo),pct:"100,0%"});
    K.table(y,rcols,rr,{fs:fs,titulo:"Resumo por C.C. Senior"});
  }
  K.finalizar("centro-de-custo-"+(o.ori==="portrait"?"retrato":"paisagem")+"-"+hoje()+".pdf");
  fecharCCRel();
}
// Excel (.xlsx) com ExcelJS, carregado sob demanda
function loadExcelJS(){
  if(window.ExcelJS)return Promise.resolve();
  if(window._exjsP)return window._exjsP;
  window._exjsP=new Promise(function(ok,fail){
    var sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";
    sc.onload=function(){ok();};sc.onerror=function(){window._exjsP=null;fail(new Error("Nao foi possivel carregar a biblioteca do Excel. Verifique a internet."));};
    document.head.appendChild(sc);
  });
  return window._exjsP;
}

      var tr=ws.getRow(r);

        cel(cc,v,c,true,TOT);});

    // Aba resumo

      {k:"sal",h:"SALÁRIOS",m:1,w:17},{k:"enc",h:"ENCARGOS (INSS+FGTS)",m:1,w:19},{k:"outros",h:"1/3, 13º E BENEFÍCIOS",m:1,w:19},{k:"custo",h:"CUSTO EMPRESA MENSAL",m:1,w:20},{k:"pct",h:"% DO TOTAL",al:"r",w:12}];
    var wr=wb.addWorksheet("Resumo",{views:[{state:"frozen",ySplit:3}]});

    var rr=4,ln=4+D.secs.length;
    D.secs.forEach(function(sc){

        else cel(cc,v[c.k],c,c.k==="custo");});
      rr++;
    });
    var tg=wr.getRow(rr);
    rc.forEach(function(c,i){var L=wr.getColumn(i+1).letter,cc=tg.getCell(i+1);
      if(i===1)cel(cc,"TOTAL GERAL",c,true,TOT);

      else if(c.k==="pct"){cel(cc,1,c,true,TOT);cc.numFmt="0.0%";}

    return wb.xlsx.writeBuffer();
  }).then(function(buf){

}


// ═══════════════════════════════════════
// ANALISE POR CATEGORIA - PRODUCAO PER CAPITA (dia a dia do mes)
// Contagens vem do sistema (Cadastro, Lancamentos, Afastamentos, Inatividade) e podem ser editadas.
// DB.percap: {id:"cfg",cats:[{nome,tipo,sub,ord}],dias:{"AAAA-MM-DD":{fer,trab}}}  +  {id:"m-AAAA-MM",prod:{d:v},ov:{linha:{d:v}},meta,dias}
// ═══════════════════════════════════════
var pcMesV=null;
var PC_TIPO={clt:"CLT (registrado)",pj:"Terceirizado PJ (soma no total)",fora:"Nao soma no total"};
var DSEM=["dom","seg","ter","qua","qui","sex","sáb"];
function pcMes(){return pcMesV||curMes();}
function pcGet(id){return (DB.percap||[]).find(function(x){return x.id===id;})||null;}
function pcDoc(id,base){if(!DB.percap)DB.percap=[];var d=pcGet(id);if(!d){d=Object.assign({id:id},base||{});DB.percap.push(d);}return d;}
function pcCfg(){return pcGet("cfg")||{id:"cfg",cats:[],dias:{}};}
function pcCatNome(e){return (e.empresa||"").trim()||"(Sem categoria)";}
function pcCats(){
  var cfg=pcCfg(),lst=(cfg.cats||[]).map(function(c){return Object.assign({},c);}),tem={};
  lst.forEach(function(c){tem[c.nome]=1;});
  var mx=lst.reduce(function(a,c){return Math.max(a,c.ord||0);},0);
  var novos={};DB.emp.forEach(function(e){var n=pcCatNome(e);if(!tem[n])novos[n]=1;});
  Object.keys(novos).sort().forEach(function(n){lst.push({nome:n,tipo:/TERCEIR|\bPJ\b/i.test(n)?"pj":"clt",sub:"",ord:++mx,auto:true});});
  return lst.sort(function(a,b){return (a.ord||0)-(b.ord||0)||a.nome.localeCompare(b.nome);});
}
function pcDiaInfo(ds){
  var dt=new Date(ds+"T12:00:00"),dw=dt.getDay(),fim=dw===0||dw===6,o=(pcCfg().dias||{})[ds]||{};
  var fer=o.fer||"",trab=typeof o.trab==="boolean"?o.trab:!(fim||fer);
  return {ds:ds,d:dt.getDate(),dw:dw,fim:fim,fer:fer,trab:trab};
}
function pcRegEm(e,ds){return (!e.adm||e.adm<=ds)&&(!e.dem||e.dem>=ds);}
// Conta na Analise per capita: vinculo no dia e nao marcado como "Nao contar no quadro"
function pcConta(e,ds){return pcRegEm(e,ds)&&!e.pcFora;}
// Calcula a tabela do mes
function pcCalc(m){
  var nd=+fimMesStr(m).slice(8),days=[];for(var i=1;i<=nd;i++)days.push(pcDiaInfo(m+"-"+String(i).padStart(2,"0")));
  var md=pcGet("m-"+m)||{},ov=md.ov||{},prod=md.prod||{};
  var cats=pcCats(),tipoCat={};cats.forEach(function(c){tipoCat[c.nome]=c.tipo;});
  function ovv(k,d,sys){var o=ov[k];return o&&typeof o[d]==="number"?o[d]:sys;}
  function linha(key,label,kind,sysArr,edit,extra){
    var vals=sysArr.map(function(v,i){return edit?ovv(key,days[i].d,v):v;});
    var ed=sysArr.map(function(v,i){return edit&&ov[key]&&typeof ov[key][days[i].d]==="number";});
    return Object.assign({key:key,label:label,kind:kind,vals:vals,sys:sysArr,ed:ed,edit:edit},extra||{});
  }
  var rows=[],catRows=[];
  // categorias (com subtotal quando varias seguidas tem o mesmo grupo)
  cats.forEach(function(c,ci){
    var sys=days.map(function(dy){return DB.emp.filter(function(e){return pcCatNome(e)===c.nome&&pcConta(e,dy.ds)&&!inatEm(e,dy.ds);}).length;});
    var r=linha("cat:"+c.nome,c.nome,"cat",sys,true,{tipo:c.tipo,sub:c.sub||""});rows.push(r);catRows.push(r);
    var nx=cats[ci+1];
    if(c.sub&&(!nx||nx.sub!==c.sub)){
      var mem=catRows.filter(function(x){return x.sub===c.sub;});
      rows.push({key:"sub:"+c.sub,label:c.sub+" - Total",kind:"sub",vals:days.map(function(dy,i){return mem.reduce(function(a,x){return a+x.vals[i];},0);}),bold:true});
    }
  });
  // inativos ficam fora das categorias e entram so nos totais de registrados
  function inatTp(ds,tp){return DB.emp.filter(function(e){var t=tipoCat[pcCatNome(e)];return pcConta(e,ds)&&t!=="fora"&&(!tp||t===tp)&&inatEm(e,ds);}).length;}
  var inCl=days.map(function(dy){return inatTp(dy.ds,"clt");}),inPj=days.map(function(dy){return inatTp(dy.ds,"pj");});
  var inat=linha("inat","Inativos","inat",days.map(function(dy){return inatTp(dy.ds);}),true);
  rows.push(inat);
  var clt=days.map(function(dy,i){return inCl[i]+catRows.filter(function(x){return x.tipo==="clt";}).reduce(function(a,x){return a+x.vals[i];},0);});
  var cpj=days.map(function(dy,i){return clt[i]+inPj[i]+catRows.filter(function(x){return x.tipo==="pj";}).reduce(function(a,x){return a+x.vals[i];},0);});
  var semI=cpj.map(function(v,i){return v-inat.vals[i];});
  rows.push({key:"tclt",label:"TOTAL REGISTRADOS CLT",kind:"tot",vals:clt,bold:true,add:inCl});
  rows.push({key:"tpj",label:"TOTAL REGISTRADOS + TERCEIRIZADOS PJ",kind:"tot",vals:cpj,bold:true,add:inPj});
  rows.push({key:"tsi",label:"TOTAL REGISTRADOS + TERCEIRIZADOS PJ - INATIVOS",kind:"tot",vals:semI,bold:true,big:true});
  // ausencias: faltas lancadas no dia + afastados no dia
  var ausDet=[];
  var ausSys=days.map(function(dy){
    var f=DB.oc.filter(function(o){if(o.tipo!=="falta"||o.data!==dy.ds)return false;var e=DB.emp.find(function(x){return x.id===o.eid;});return e&&!e.pcFora&&tipoCat[pcCatNome(e)]!=="fora";}).length;
    var a=DB.emp.filter(function(e){return pcConta(e,dy.ds)&&tipoCat[pcCatNome(e)]!=="fora"&&!inatEm(e,dy.ds)&&afastadoEm(e,dy.ds);}).length;
    ausDet.push({f:f,a:a});return f+a;
  });
  var aus=linha("aus","AUSENCIAS/FERIAS NO DIA","aus",ausSys,true,{bold:true,det:ausDet});rows.push(aus);
  var nPc=semI.map(function(v,i){return v-aus.vals[i];});
  rows.push({key:"npc",label:"N° PARA PRODUCAO PER CAPITA",kind:"tot",vals:nPc,bold:true});
  var pv=days.map(function(dy){var v=prod[dy.d];return typeof v==="number"?v:null;});
  rows.push({key:"prod",label:"PRODUCAO DO DIA",sub2:"Entrada na Expedicao (manual)",kind:"prod",vals:pv,edit:true,bold:true,money:true});
  var pc=pv.map(function(v,i){return v!==null&&v>0&&nPc[i]>0?v/nPc[i]:null;});
  rows.push({key:"pc",label:"PRODUCAO PER CAPITA",kind:"pc",vals:pc,bold:true,money:true});
  var acc=0,n=0,avg=pc.map(function(v){if(v!==null){acc+=v;n++;}return n?acc/n:null;});
  rows.push({key:"avg",label:"PRODUCAO PER CAPITA MEDIA NO MES",kind:"pc",vals:avg,bold:true,money:true});
  var diasT=typeof md.dias==="number"&&md.dias>0?md.dias:days.filter(function(x){return x.trab;}).length;
  var meta=typeof md.meta==="number"?md.meta:null,metaDia=meta!==null&&diasT>0?meta/diasT:null;
  rows.push({key:"mdia",label:"META DIA PER CAPITA NO MES",sub2:fmtDias(diasT)+" dias trabalhados",kind:"meta",vals:days.map(function(){return metaDia;}),bold:true,money:true});
  // TOTAL PER CAPITA = meta de producao do mes / dias trabalhados / (total registrados + terceirizados PJ - inativos do dia)
  var metaProd=typeof md.metaProd==="number"&&md.metaProd>0?md.metaProd:null;
  rows.push({key:"mtot",label:"TOTAL PER CAPITA (META DO MES)",sub2:metaProd!==null?"Meta "+metaProd.toLocaleString("pt-BR")+" ÷ "+fmtDias(diasT)+" dias ÷ total - inativos":"",kind:"meta",
    vals:metaProd!==null?days.map(function(dy,i){return diasT>0&&semI[i]>0?metaProd/diasT/semI[i]:null;}):days.map(function(){return meta;}),money:true,red:true,porDia:metaProd!==null});
  // coluna do mes
  var trabIx=days.map(function(x,i){return x.trab?i:-1;}).filter(function(i){return i>=0;});
  rows.forEach(function(r){
    if(r.key==="prod"){r.tot=pv.reduce(function(a,v){return a+(v||0);},0);return;}
    if(r.key==="pc"||r.key==="avg"){r.tot=n?acc/n:null;return;}
    if(r.kind==="meta"&&!r.porDia){r.tot=r.vals[0];return;}
    var ix=trabIx.length?trabIx:days.map(function(x,i){return i;});
    r.tot=ix.reduce(function(a,i){return a+(r.vals[i]||0);},0)/ix.length;
  });
  return {m:m,days:days,rows:rows,meta:meta,metaProd:metaProd,diasT:diasT,diasAuto:days.filter(function(x){return x.trab;}).length,metaDia:metaDia,md:md};
}
function fmtDias(v){return (+v).toLocaleString("pt-BR",{maximumFractionDigits:1});}
function pcFmt(r,v,tela){
  if(v===null||v===undefined)return "";
  if(r.money)return (+v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  return String(Math.round(v));
}
function pcFmtTot(r,v){if(v===null||v===undefined)return "";if(r.money)return (+v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});return (+v).toLocaleString("pt-BR",{maximumFractionDigits:1});}
var pcModo="dia",pcDiaV=null;
function pcDiaSel(m,nd){var d=pcDiaV||(m===curMes()?+hoje().slice(8):1);return Math.max(1,Math.min(d,nd));}

      +C.days.map(function(dy,i){if(!vis(i))return "";

        if(r.edit&&!ro){
          var ed=r.key==="prod"?v!==null:r.ed[i];
          var tip=r.key==="prod"?"Producao do dia (manual)":r.ed[i]?"Valor editado. Sistema: "+pcFmt(r,r.sys[i])+" (apague para voltar)":(r.key==="aus"?r.det[i].f+" falta(s) lancada(s) + "+r.det[i].a+" afastado(s)":"Valor do sistema · digite para alterar");
          return "<td class='"+cl+(ed&&r.key!=="prod"?" ed":"")+"'><input class='pc-in' value='"+pcFmt(r,v)+"' title='"+esc(tip)+"' data-k='"+esc(r.key)+"' data-d='"+dy.d+"' onfocus='this.select()' onchange='pcSet(this)' onkeydown='pcKey(event,this)'/></td>";

      }).join("")+(uDia?"":"<td class='pc-tot'>"+pcFmtTot(r,r.tot)+"</td>")+"</tr>";
  }).join("");
  document.getElementById("p-percap").innerHTML=

    +"<select id='pc-ano' onchange='pcSetMes()'>"+Object.keys(ys).sort().map(function(y){return "<option"+(y===m.slice(0,4)?" selected":"")+">"+y+"</option>";}).join("")+"</select></div>"

    +"<div class='card' style='padding:.75rem .85rem'>"

// Tabela profissional para PDF: larguras pelo conteudo, cabecalho sem quebrar palavras, reticencias quando nao cabe
function pdfTabAuto(K,cols,rows,opt){
  var doc=K.doc,cw=opt.cw||K.cw,fs=opt.fs||7.4,minFs=opt.minFs||5.4;
  function medir(f){
    return cols.map(function(c){
      K.font(f-.4,true);
      var hw=Math.max.apply(null,String(c.h).split(/\s+/).map(function(w){return doc.getTextWidth(w);}))+2.6;
      var mx=0;
      rows.forEach(function(r){var v=r[c.k];if(v===undefined||v===null||v==="")return;K.font(f,!!(c.b||r._total));var w=doc.getTextWidth(String(v));if(w>mx)mx=w;});
      var need=Math.max(hw,Math.min(mx+3,c.cap||999),c.min||0);
      return {need:need,hw:hw,full:mx+3};
    });
  }
  var m,f=fs;
  for(;f>=minFs;f=+(f-.2).toFixed(2)){m=medir(f);if(m.reduce(function(a,x){return a+x.need;},0)<=cw)break;}
  if(f<minFs){f=minFs;m=medir(f);}
  var tot=m.reduce(function(a,x){return a+x.need;},0),ws=m.map(function(x){return x.need;});
  if(tot>cw){ // encolhe as colunas de texto flexiveis (o nome guarda uma largura legivel)
    var mins=cols.map(function(c,i){return c.flex?Math.min(ws[i],Math.max(m[i].hw,c.k==="nome"?34:c.minFlex||16)):ws[i];});
    var flex=ws.map(function(w,i){return w-mins[i];}),fl=flex.reduce(function(a,b){return a+b;},0),exc=tot-cw;
    if(fl>=exc)ws=ws.map(function(w,i){return w-exc*flex[i]/fl;});
    else{ // numeros e datas nunca sao cortados: o espaco que sobra vai para os textos
      var fixo=0,smf=0;cols.forEach(function(c,i){if(c.flex)smf+=mins[i];else fixo+=ws[i];});
      var disp=Math.max(cw-fixo,cols.filter(function(c){return c.flex;}).length*6);
      ws=ws.map(function(w,i){return cols[i].flex?mins[i]*disp/smf:w;});
    }
  }else{ // sobra: primeiro completa textos cortados, depois distribui
    var sob=cw-tot;
    cols.forEach(function(c,i){if(sob<=0)return;var falta=Math.max(0,m[i].full-ws[i]);var d=Math.min(falta,sob);ws[i]+=d;sob-=d;});
    var pw=cols.map(function(c){return c.flex?1:.35;}),sp=pw.reduce(function(a,b){return a+b;},0);
    ws=ws.map(function(w,i){return w+sob*pw[i]/sp;});
  }
  return {fs:f,cols:cols.map(function(c,i){return Object.assign({},c,{w:ws[i]});})};
}
function pdfTabDraw(K,y,cols,rows,opt){
  opt=opt||{};var doc=K.doc,C=K.C,fs=opt.fs||7,rh=opt.rh||5.4,x0=opt.x||K.mg,tw=cols.reduce(function(a,c){return a+c.w;},0),LIM=K.H-13;
  function corte(t,w){t=String(t);if(doc.getTextWidth(t)<=w)return t;while(t.length>1&&doc.getTextWidth(t+"…")>w)t=t.slice(0,-1);return t+"…";}

    K.txt([255,255,255]);

      l.forEach(function(t,j){doc.text(t,c.al==="r"?cx+c.w-1.3:c.al==="c"?cx+c.w/2:cx+1.3,yy+j*lh,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});});
      cx+=c.w;});

    if(r._grand){K.fill(C.ink);doc.rect(x0,y,tw,h,"F");}
    else if(r._total){K.fill([231,238,249]);doc.rect(x0,y,tw,h,"F");K.fill(C.bl);doc.rect(x0,y,tw,.35,"F");}
    else if(r._bg){K.fill(r._bg);doc.rect(x0,y,tw,h,"F");}

    cols.forEach(function(c){
      var v=r[c.k],vz=v===undefined||v===null||v===""||v==="-";
      K.font(fs,!!(c.b||r._total));
      var cor=r._grand?[255,255,255]:r._total?(c.cor&&!vz?c.cor(r):C.b):vz?[185,192,201]:(r._cor||(c.cor?c.cor(r):[55,62,72]));
      K.txt(cor);

      if(t)doc.text(t,c.al==="r"?cx+c.w-1.3:c.al==="c"?cx+c.w/2:cx+1.3,y+h/2+fs*.135,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});
      cx+=c.w;
    });
    if(!r._total){doc.setDrawColor(234,238,243);doc.setLineWidth(.15);doc.line(x0,y+h,x0+tw,y+h);}

  });

function catRenomearRefs(de,para){
  DB.emp=DB.emp.map(function(e){return (e.empresa||"").trim()===de?Object.assign({},e,{empresa:para}):e;});
  (DB.percap||[]).forEach(function(d){

function catSalvar(){
  var old=gv("cat-old"),nome=gv("cat-nome").trim(),tipo=gv("cat-tipo")||"clt",sub=gv("cat-sub").trim();
  if(!nome){alert("Informe o nome da categoria.");return;}
  var l=catLista();
  if(l.some(function(c){return c.nome.toLowerCase()===nome.toLowerCase()&&c.nome!==old;})){alert("Ja existe uma categoria com esse nome.");return;}
  if(old){
    var ix=l.findIndex(function(c){return c.nome===old;});
    if(ix>=0)l[ix]=Object.assign(l[ix],{nome:nome,tipo:tipo,sub:sub});
    if(old!==nome)catRenomearRefs(old,nome);
  }else l.push({nome:nome,tipo:tipo,sub:sub});
  catGravar(l);dbSave();catFechar();rCats();

// Visao do colaborador num mes (valores lancados no mes ou cadastro com salario do mes)
function empNoMesView(e,m){

// Decompoe o custo empresa mensal em blocos, com a explicacao de cada calculo
function custoPartes(v,m){
  var P={rem:[],enc:[],prov:[],ben:[],tot:0,sub:{rem:0,enc:0,prov:0,ben:0}};
  if(!v||!empTemValores(v))return P;
  var sal=salMensal(v),mei=isMEI(v),cs=mei?{terco:0,dec13:0}:calcSal(sal),cfg=encCfg(),base=encBase(v,cfg);
  function add(b,lb,calc,val){if(val>0.004){P[b].push({lb:lb,calc:calc,v:val});P.sub[b]+=val;P.tot+=val;}}
  add("rem","Salário",mei&&v.meiTipo==="hora"?fmtBRL(v.sal)+" por hora x "+(+v.meiHoras||220)+" h no mês":"Salário mensal do cadastro",sal);
  add("rem","Adicional de salário","Valor mensal lançado",+v.adic||0);
  add("rem","Hora extra","Valor do mês lançado",+v.hextra||0);
  add("rem","Prêmio de produção",typeof v.pprodPct==="number"?pct2(v.pprodPct)+" x salário "+fmtBRL(sal):"",pprodVal(v));
  ["inss","fgts"].forEach(function(k){
    var man=encManual(v,k),lb=k==="inss"?"INSS patronal":"FGTS";
    add("enc",lb,man?"Valor informado manualmente":pct2(encPct(k,cfg))+" x base de cálculo "+fmtBRL(base),encVal(v,k));
  });
  add("prov","Provisão de 1/3 de férias","(salário "+fmtBRL(sal)+" ÷ 3) ÷ 12 meses",cs.terco/12);
  add("prov","Provisão de 13º salário","salário "+fmtBRL(sal)+" ÷ 12 meses",cs.dec13/12);
  add("prov","Provisão de bônus anual","bônus "+fmtBRL(+v.bonus||0)+" ÷ 12 meses",(+v.bonus||0)/12);
  add("ben","Cesta básica","Valor mensal",+v.cesta||0);
  var ai=assidInfo(v,m);
  if(ai){var d=calcDesc(v.id,m,ai.bruto);
    add("ben","Assiduidade - Prêmio Cartão",ai.pct>0?"prêmio "+fmtBRL(ai.bruto)+" - "+pct1(ai.pct)+" ("+d.f+" falta(s), "+d.a+" atraso(s), "+d.s+" 5S)":"prêmio "+fmtBRL(ai.bruto)+" sem descontos",ai.rec);}
  add("ben","Prêmio metas","Valor mensal",+v.pmetas||0);
  add("ben","Refeitório","Valor mensal",+v.refeit||0);
  return P;
}
function gerarDossie(id,ano,mes,ori){
  var e=DB.emp.find(function(x){return x.id===id;});if(!e)return;

      K.font(6.3,true);K.txt(C.mut);doc.text(fit(String(it[0]).toUpperCase(),cwid-4),x+2,yy+4.6);

  var ocsMes=ocsAno.filter(function(o){return gmk(o.data)===mref;});

  var duMes=ativoRef?dUteis(mref):0,fMes=cnt(ocsMes,"falta");

var relModo="mes",ORGc="#d35400";
function pct1(v){return (v||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";}
function fmtK(v){v=v||0;return Math.abs(v)>=10000?"R$"+(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":fmtBRLInt(v);}
function fimMesStr(m){var p=m.split("-");var d=new Date(+p[0],+p[1],0);return m+"-"+String(d.getDate()).padStart(2,"0");}
function dUteis(m){
  var p=m.split("-").map(Number),hj=hoje(),n=0,last=new Date(p[0],p[1],0).getDate();
  for(var d=1;d<=last;d++){
    if(m+"-"+String(d).padStart(2,"0")>hj)break;
    var w=new Date(p[0],p[1]-1,d).getDay();if(w!==0&&w!==6)n++;

}

// Dados de um mes: premio previsto, pago, perdido (dividido por tipo), absenteismo
function relMes(m,se){
  var r={m:m,linhas:[],pot:0,pago:0,perd:0,lf:0,la:0,ls:0,nf:0,na:0,ns:0,ok:0,absF:0,absBase:0};
  DB.emp.forEach(function(e){
    if(se&&e.id!==se)return;
    if(!contaNoMes(e,m)||isMEI(e))return;
    var pr=DB.pr.find(function(p){return p.eid===e.id;});if(!pr)return;
    var d=calcDesc(e.id,m,pr.val);
    var pf=0,pa=0,ps=0;
    DB.oc.forEach(function(x){
      if(x.eid!==e.id||gmk(x.data)!==m)return;
      var p=ocPct(x);
      if(x.tipo==="falta")pf+=p;else if(x.tipo==="atraso")pa+=p;else if(x.tipo==="5s")ps+=p;
    });
    var raw=pf+pa+ps,k=raw>0?d.desc/raw:0; // desconto limitado a 100%: rateia proporcionalmente
    var l={emp:e,val:pr.val,f:d.f,a:d.a,s:d.s,pct:d.pct,desc:d.desc,rec:d.rec,lf:pf*k,la:pa*k,ls:ps*k};
    r.linhas.push(l);

    if(l.pct===0)r.ok++;
  });

function relAcum(lista){
  var r={linhas:[],pot:0,pago:0,perd:0,lf:0,la:0,ls:0,nf:0,na:0,ns:0,absF:0,absBase:0},col={};

      ["val","desc","rec","f","a","s","lf","la","ls"].forEach(function(k){c[k]+=l[k];});
    });
  });
  r.linhas=Object.keys(col).map(function(k){var c=col[k];c.pct=c.val>0?c.desc/c.val*100:0;return c;});
