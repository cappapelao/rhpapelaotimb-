function _chk(r){ if(r.error) throw new Error(r.error.message); return r.data; }
function _sha256(s){
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2);}).join("");
  });
}


// Camada compativel com o codigo antigo: _db.collection(x).doc(id).get/set/delete
var _db = {
  collection: function(){
    return { doc: function(id){
      return {
        get: function(){
          return _sb.from(TABELA).select("conteudo").eq("id", id).maybeSingle().then(function(r){
            var d = _chk(r);
            return { exists: !!d, data: function(){ return d ? d.conteudo : undefined; } };
          });
        },
        set: function(obj){
          return _sb.from(TABELA).upsert({ id: id, conteudo: obj, atualizado: new Date().toISOString() }).then(_chk);
        },
        delete: function(){
          return _sb.from(TABELA).delete().eq("id", id).then(_chk);
        }
      };
    } };
  }
};

.rp .pdf-chk{border:none;border-radius:0;max-height:178px;grid-template-columns:1fr;padding:.25rem .35rem;gap:0}

.rp-ft{display:flex;align-items:center;gap:12px;padding:.8rem 1.25rem;border-top:1px solid #eef1f6;background:#fff;border-radius:0 0 14px 14px}

.rp-prev .pi{width:34px;height:34px;border-radius:9px;background:#eef4fc;color:var(--deep);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

.rp-ft .btnp{min-width:150px}
@media (max-width:820px){.rp-body{grid-template-columns:1fr}.rp-col+.rp-col{border-left:none;border-top:1px solid #eef1f6}}
/* ===== Per capita: colaboradores do numero clicado ===== */
.pc-num{display:block;width:100%;height:100%;min-height:26px;border:none;background:transparent;font:inherit;color:inherit;cursor:pointer;padding:0 4px;border-radius:2px}
.pc-num:hover{background:#e6f0ff;color:#00348F;text-decoration:underline;text-underline-offset:2px}
.pc-num:focus-visible{outline:none;box-shadow:inset 0 0 0 2px #1E5BC6}
.pcp .mdl-bd{padding:0}
.pcp-hd{display:flex;align-items:center;gap:12px;min-width:0}

.pcp-dn{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}

.pcp-dn button:hover{background:#eef4fc}.pcp-dn button:disabled{opacity:.3;cursor:default}
.pcp-dn span{font-size:11.5px;font-weight:800;color:#2a3542;padding:0 7px;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:22px}
.pcp-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;padding:.9rem 1.25rem .2rem}
.pcp-k{border:1px solid #e6ebf2;border-radius:10px;padding:.5rem .7rem;background:#fff;position:relative;overflow:hidden}

.pcp-k span{display:block;font-size:10px;font-weight:800;color:#8a94a0;text-transform:uppercase;letter-spacing:.4px}
.pcp-k b{display:block;font-size:18px;font-weight:800;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
.pcp-k small{font-size:11px;color:#8a94a0;font-weight:600}
.pcp-aj{margin:.7rem 1.25rem 0;border:1px solid #f2dfb0;background:#fffaf0;border-radius:10px;padding:.55rem .75rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:#6b5420}

.pcp-aj input{width:90px!important;padding:.3rem .5rem!important;font-weight:800;text-align:center}
.pcp-aj .btng,.pcp-aj .btnp{padding:.35rem .7rem;font-size:12px}
.pcp-aj.info{border-color:#dbe6f5;background:#f4f8fd;color:#3a4f6e}.pcp-aj.info i{color:#1E5BC6}
.pcp-tb{display:flex;align-items:center;gap:8px;padding:.8rem 1.25rem .6rem;flex-wrap:wrap}
.pcp-tb .bal-srch input{width:260px!important}
.pcp-tb .sp{flex:1}
.pcp-ro{font-size:11.5px;font-weight:700;color:#8a5a00;background:#fdf3e1;border-radius:6px;padding:3px 8px;display:inline-flex;align-items:center;gap:4px}
.pcp-wrap{margin:0 1.25rem;border:1px solid #e3e9f1;border-radius:10px;overflow:auto;max-height:52vh}
.pcp-t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.pcp-t thead th{position:sticky;top:0;z-index:2;background:#0A1F4A;color:#fff;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:.55rem .6rem;white-space:nowrap}
.pcp-t thead th.c{text-align:center}
.pcp-t td{padding:.38rem .6rem;border-bottom:1px solid #eef1f6;vertical-align:middle;background:#fff}
.pcp-t tr:hover td{background:#f8fafd}
.pcp-t tr.gh td{background:#f2f6fc;font-size:11px;font-weight:800;color:#0A1F4A;text-transform:uppercase;letter-spacing:.4px;padding:.4rem .6rem;position:sticky;top:33px;z-index:1}
.pcp-t tr.gh td span{color:#8a94a0;font-weight:700;text-transform:none;letter-spacing:0;margin-left:6px}
.pcp-t tr.mod td{background:#fffbea}
.pcp-t tr.mod td:first-child{box-shadow:inset 3px 0 0 #e6a817}
.pcp-p{display:flex;align-items:center;gap:9px;min-width:210px}
.pcp-av{width:30px;height:30px;border-radius:50%;background:#1E5BC6;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pcp-av.pj{background:#7b3fa0}
.pcp-p b{display:block;font-size:12.5px;color:#1f2a37;line-height:1.2}
.pcp-p small{display:block;font-size:11px;color:#8a94a0;font-weight:600}
.pcp-t select,.pcp-t input[type=text]{width:100%;min-width:118px;padding:.32rem .45rem!important;font-size:12px!important;border-radius:6px!important}
.pcp-t select.chg,.pcp-t input.chg{border-color:#e6a817!important;background:#fffdf3;box-shadow:0 0 0 2px rgba(230,168,23,.18)!important}
.pcp-t td.act{white-space:nowrap;text-align:center}
.pcp-st{font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;white-space:nowrap;display:inline-block;margin:1px 0}
.pcp-st.at{background:#e3f4ea;color:#1a7a4a}.pcp-st.af{background:#fdf3e1;color:#8a5a00}.pcp-st.in{background:#eceff2;color:#6b7580}.pcp-st.fa{background:#fbe7e5;color:#c0392b}.pcp-st.pj{background:#f1e7f8;color:#7b3fa0}
.pcp-ft{display:flex;align-items:center;gap:10px;padding:.85rem 1.25rem;border-top:1px solid #eef1f6;margin-top:.9rem}
.pcp-ft .inf{flex:1;font-size:12px;color:#7a8592;display:flex;align-items:center;gap:6px}
.pcp-ft .inf b{color:#8a5a00}
.pcp-vz{padding:2rem;text-align:center;color:#9aa3ad;font-size:13px}
.pcp-vz i{display:block;font-size:30px;margin-bottom:.4rem;color:#c5ccd6}
/* ===== Lancamento de faltas e atrasos ===== */
.lc-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem;margin-bottom:1rem}
.lc-k{background:#fff;border-radius:12px;padding:.7rem .9rem .7rem 1rem;box-shadow:0 1px 4px rgba(10,31,74,.07);position:relative;overflow:hidden}
.lc-k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}

.lc-tb .sp{flex:1}
.lc-tb select{width:auto!important;padding:.4rem .6rem!important;font-size:12.5px!important}
.lc-tb #lfe{width:220px!important}
.lc-tb .bal-srch input{width:230px!important;padding-top:.4rem!important;padding-bottom:.4rem!important;font-size:12.5px}
.lc-chips{display:flex;flex-wrap:wrap;gap:6px;padding:.6rem .9rem;border-bottom:1px solid #eef1f6;background:#fafbfd}
.lc-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#4a5566;background:#fff;border:1px solid #e3e9f1;border-radius:20px;padding:3px 10px}

.lc-chip .d{width:7px;height:7px;border-radius:50%}
.lc-day{display:flex;align-items:center;gap:10px;padding:.5rem .9rem;background:#f6f8fb;border-bottom:1px solid #eef1f6;font-size:11.5px;font-weight:800;color:#3a4656;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;z-index:1}
.lc-day i{font-size:15px;color:var(--blue)}
.lc-day span{font-weight:700;color:#8a94a0;text-transform:none;letter-spacing:0}
.lc-r{display:grid;grid-template-columns:minmax(210px,1.3fr) minmax(160px,.9fr) minmax(0,1.6fr) 110px 76px;gap:12px;align-items:center;padding:.6rem .9rem;border-bottom:1px solid #f1f4f8;transition:background .12s}
.lc-r:hover{background:#f8fafd}
.lc-p{display:flex;align-items:center;gap:10px;min-width:0}
.lc-av{width:34px;height:34px;border-radius:50%;color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lc-p b{display:block;font-size:13px;color:#1f2a37;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-p small{display:block;font-size:11px;color:#8a94a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-tp{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.lc-bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;white-space:nowrap}
.lc-bdg i{font-size:13px}
.lc-sub{font-size:11.5px;color:#4a5566;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lc-obs{font-size:12px;color:#6b7580;line-height:1.35;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.lc-ds{text-align:right}
.lc-ds span{display:inline-block;font-size:12px;font-weight:800;border-radius:20px;padding:3px 10px;white-space:nowrap}
.lc-ds .on{background:#fbe7e5;color:#c0392b}.lc-ds .at{background:#fdf3e1;color:#8a5a00}.lc-ds .off{background:#e3f4ea;color:#1a7a4a}
.lc-ac{display:flex;gap:2px;justify-content:flex-end}
.lc-hd{display:grid;grid-template-columns:minmax(210px,1.3fr) minmax(160px,.9fr) minmax(0,1.6fr) 110px 76px;gap:12px;padding:.45rem .9rem;font-size:10px;font-weight:800;color:#8a94a0;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #eef1f6}

.lc-list{max-height:calc(100vh - 330px);overflow-y:auto}
@media (max-width:900px){.lc-r,.lc-hd{grid-template-columns:1fr auto}.lc-r .lc-tp,.lc-r .lc-obs,.lc-hd span:nth-child(2),.lc-hd span:nth-child(3){grid-column:1/-1}.lc-hd{display:none}}

<script>
// ═══════════════════════════════════════
// DB GLOBAL
// ═══════════════════════════════════════
var DB={emp:[],oc:[],pr:[],idx:[],cc:[],oc5:[],motivos:[],sensos:[],motdem:[],motafas:[],reaj:[],grupos:[],receita:[],folhafech:[],percap:[]};
var SAVE_TIMER=null;

function dbLoad(){
  return window._fbLoad();
}

function dbSave(){
  if(ACESSO&&!ACESSO.master&&permTela(pg)!=="editar"){
    showSync("Voce tem permissao somente para visualizar esta tela. Nada foi gravado.",false,true);
    window._fbLoad().then(function(){go(pg);});
    return;
  }
  if(!window._dbLoaded){
    showSync("Os dados nao foram carregados do servidor. Recarregue a pagina antes de salvar.",false,true);
    return;
  }
  clearTimeout(SAVE_TIMER);
  showSync("Salvando...",false);
  SAVE_TIMER=setTimeout(function(){
    if(!window._fbSave){
      showSync("Servidor nao carregado!",false,true);
      return;
    }
    window._fbSave().then(function(){
      var t=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      showSync("Salvo "+t,true);
      setTimeout(function(){document.getElementById("sync-bar").style.display="none";},3000);
    }).catch(function(e){
      showSync("Erro: "+e.message,false,true);
    });
  },600);
}

function showSync(msg,ok,err){
  var bar=document.getElementById("sync-bar");
  var spin=document.getElementById("sync-spin");
  var txt=document.getElementById("sync-msg");
  bar.style.display="flex";
  bar.className="sync-bar"+(ok?" ok":err?" err":"");
  spin.style.display=(ok||err)?"none":"inline-block";
  txt.textContent=msg;
}

// ═══════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════
function toggleSenha(){
  var inp=document.getElementById("lp");
  var icon=document.getElementById("eye-icon");
  if(inp.type==="password"){
    inp.type="text";
    icon.className="ti ti-eye-off";
  }else{

var _loginOcupado=false;
function doLogin(){
  if(_loginOcupado)return;
  var u=document.getElementById("lu").value.trim().toLowerCase();
  var p=document.getElementById("lp").value;
  var err=document.getElementById("lerr");
  var btn=document.getElementById("btn-login");
  err.style.display="none";
  function falha(msg){err.textContent=msg;err.style.display="block";}
  if(!u||!p){falha("Informe e-mail e senha.");return;}
  _loginOcupado=true;btn.disabled=true;
  var lembrar=!!(document.getElementById("lrem")&&document.getElementById("lrem").checked);
  try{
    if(lembrar){localStorage.setItem("timbo_lembrar","1");localStorage.setItem("timbo_email",u);}
    else{localStorage.removeItem("timbo_lembrar");localStorage.removeItem("timbo_email");}
  }catch(e){}
  showSync("Entrando...",false);
  _sb.auth.signInWithPassword({email:u,password:p}).then(function(r){
    if(r.error)throw r.error;
    return carregarAcesso(r.data&&r.data.user).then(function(ac){
      if(!ac){_sb.auth.signOut();throw new Error("sem-acesso");}
      ACESSO=ac;
      document.getElementById("lp").value="";
      return entrarApp();
    });
  }).catch(function(e){
    document.getElementById("sync-bar").style.display="none";
    var m=(e&&e.message||"").toLowerCase();
    falha(m.indexOf("rate")>=0||m.indexOf("too many")>=0?"Muitas tentativas. Aguarde alguns minutos.":
          m.indexOf("fetch")>=0||m.indexOf("network")>=0?"Sem conexão com o servidor.":
          m.indexOf("not confirmed")>=0?"E-mail ainda não confirmado no Supabase.":
          m.indexOf("sem-acesso")>=0?"Este e-mail não tem acesso liberado. Fale com o administrador.":"E-mail ou senha incorretos");
  }).then(function(){_loginOcupado=false;btn.disabled=false;});
}

function aplicarSeedColab(){
  var marca=_db.collection("timbo").doc("seed_colab_v1");
  return marca.get().then(function(s){
    if(s.exists)return;
    var ja={};DB.emp.forEach(function(e){ja[(e.nome||"").trim().toUpperCase()]=1;});
    var n=0;
    SEED_COLAB.forEach(function(x){
      if(ja[x.nome.toUpperCase()])return;
      DB.emp.push({id:uid(),nome:x.nome,func:x.func,empresa:x.empresa,horario:x.horario,ccid:"",adm:"",aniv:"",vinc:"CLT",ativo:!x.dem,dem:x.dem||""});
      n++;
    });
    var fim=function(){return marca.set({aplicado:new Date().toISOString(),qtd:n});};
    if(!n)return fim();
    return window._fbSave().then(fim).then(function(){
      showSync(n+" colaboradores importados da planilha",true);
      setTimeout(function(){document.getElementById("sync-bar").style.display="none";},3500);
      if(pg==="employees")rEmp();else if(pg==="dashboard")rDash();
    });
  }).catch(function(e){console.warn("Importacao inicial falhou:",e&&e.message);});

var _updOcupado=false;
function atualizarSistema(){
  if(_updOcupado)return;
  _updOcupado=true;
  var b=document.getElementById("btn-upd");if(b){b.classList.add("on");b.disabled=true;}
  showSync("Atualizando sistema...",false);
  clearTimeout(SAVE_TIMER);
  var salvar=window._dbLoaded?window._fbSave().catch(function(){}):Promise.resolve();
  salvar.then(function(){return _sb.auth.getSession();}).then(function(r){
    var u=r&&r.data&&r.data.session&&r.data.session.user;
    if(!u)throw new Error("Sessao expirada. Entre novamente.");
    return carregarAcesso(u);
  }).then(function(ac){
    if(!ac)throw new Error("Seu acesso foi removido. Fale com o administrador.");
    ACESSO=ac;aplicarPermissoes();
    return window._fbLoad();
  }).then(function(){
    var t=permTela(pg)==="nenhum"?primeiraTela():pg;
    if(t)go(t);
    var hr=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    var inf=document.getElementById("upd-info");if(inf)inf.textContent="Atualizado as "+hr;
    showSync("Sistema atualizado "+hr,true);
    setTimeout(function(){document.getElementById("sync-bar").style.display="none";},2500);
  }).catch(function(e){
    showSync("Erro ao atualizar: "+(e&&e.message||e),false,true);
  }).then(function(){
    _updOcupado=false;
    if(b){b.classList.remove("on");b.disabled=false;}
  });
}

function prepararLogin(){
  try{
    var em=localStorage.getItem("timbo_email"),lb=localStorage.getItem("timbo_lembrar")==="1";
    var r=document.getElementById("lrem");if(r)r.checked=lb;
    if(em){document.getElementById("lu").value=em;}
  }catch(e){}
}
function startApp(){
  prepararLogin();
  var ls=document.getElementById("loading-screen");
  // Nenhum dado e lido antes do login
  _sb.auth.getSession().then(function(r){
    var s=r&&r.data&&r.data.session;
    return (s?carregarAcesso(s.user):Promise.resolve(null)).then(function(ac){
      if(s&&ac){ACESSO=ac;entrarApp();return;}
      if(s)_sb.auth.signOut();
      ls.style.display="none";document.getElementById("lgw").style.display="flex";
    });
  }).catch(function(){
    ls.style.display="none";document.getElementById("lgw").style.display="flex";
  });
}
if(window._fbReady){
  startApp();
}else{
  document.addEventListener("fb-ready",startApp);
  setTimeout(function(){
    if(!window._fbReady){
      document.getElementById("load-msg").textContent="Erro de conexao. Verifique a internet.";
    }
  },10000);
}

// DB definido pelo Supabase acima

function gmk(dt){var d=new Date(dt+"T12:00:00");return d.getFullYear()+"-"+(""+(d.getMonth()+1)).padStart(2,"0");}
function hoje(){return new Date().toISOString().slice(0,10);}
function curMes(){return gmk(hoje());}
function uid(){return Date.now()+""+Math.random().toString(36).slice(2,6);}
function esc(s){return(s==null?"":""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function fmtBRL(v){
  v=(typeof v==="number"&&!isNaN(v))?v:(parseFloat(v)||0);
  return "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtBRLInt(v){
  v=(typeof v==="number"&&!isNaN(v))?v:(parseFloat(v)||0);
  return "R$"+Math.round(v).toLocaleString("pt-BR");
}
function fmtM(m){var p=m.split("-");return MOS[parseInt(p[1])-1]+"/"+p[0];}
function ini(n){return n.split(" ").map(function(w){return w[0];}).slice(0,2).join("").toUpperCase();}
function tEmp(a,d){
  if(!a)return "admissao nao informada";
  var i=new Date(a+"T12:00:00"),f=d?new Date(d+"T12:00:00"):new Date();
  var anos=(f-i)/(1000*60*60*24*365.25);
  if(anos<1){var m=Math.floor(anos*12);return m<=0?"< 1 mes":m+" mes"+(m>1?"es":"");}
  return anos.toFixed(1)+" anos";
}
function getPct(tipo,data){
  var at=DB.idx.filter(function(x){return x.tipo===tipo&&x.ini<=data&&(!x.fim||x.fim>=data);});
  if(at.length>0)return at[at.length-1].pct;
  return {falta:15,atraso:5,"5s":10}[tipo]||0;
}
// Tipos de falta (Suspensao, Falta Justificada, Falta Injustificada...) - parametro "desconta do premio"
var FT_PAD=[{id:"ft_injust",tipo:"ftipo",nome:"Falta Injustificada",desconta:true},{id:"ft_just",tipo:"ftipo",nome:"Falta Justificada",desconta:false},{id:"ft_susp",tipo:"ftipo",nome:"Suspensão",desconta:true}];
function fTipos(){var l=(DB.motivos||[]).filter(function(m){return m.tipo==="ftipo";});return l.length?l:FT_PAD.map(function(x){return Object.assign({},x);});}
function fTiposMat(){if(!(DB.motivos||[]).some(function(m){return m.tipo==="ftipo";}))FT_PAD.forEach(function(x){DB.motivos.push(Object.assign({},x));});}
function ftInfo(id){return id?fTipos().find(function(x){return x.id===id;})||null:null;}
function ftDesconta(id){var f=ftInfo(id);return !f||f.desconta!==false;}
function ocPct(o){return o.tipo==="falta"&&!ftDesconta(o.ftipo)?0:getPct(o.tipo,o.data);}
function calcDesc(eid,mes,val){
  var ocs=DB.oc.filter(function(x){return x.eid===eid&&gmk(x.data)===mes;});
  var f=ocs.filter(function(x){return x.tipo==="falta";}).length;
  var a=ocs.filter(function(x){return x.tipo==="atraso";}).length;
  var s=ocs.filter(function(x){return x.tipo==="5s";}).length;
  var pct=0;ocs.forEach(function(x){pct+=ocPct(x);});
  pct=Math.min(100,pct);
  return{f:f,a:a,s:s,pct:pct,desc:(pct/100)*val,rec:val*(1-pct/100)};
}
function getMeses(){
  var s={};s[curMes()]=1;DB.oc.forEach(function(o){s[gmk(o.data)]=1;});
  return Object.keys(s).sort().reverse();
}
function mSel(id,val){
  var ms=getMeses(),h="<select id="+JSON.stringify(id)+" style='padding:.4rem .75rem;border:1.5px solid #dfe5ee;border-radius:8px;font-size:13px;color:"+B+";font-weight:600;background:#fff;width:auto'>";
  ms.forEach(function(m){h+="<option value="+JSON.stringify(m)+(m===val?" selected":"")+">"+fmtM(m)+"</option>";});
  return h+"</select>";
}
function sCard(lb,val,col,ic,sub){
  return "<div style='background:#fff;border-radius:12px;padding:1rem 1.25rem;box-shadow:0 2px 8px rgba(0,0,0,.07);border-top:3px solid "+col+"'>"
    +"<div style='display:flex;justify-content:space-between;align-items:flex-start'>"
    +"<div><div style='font-size:11px;color:#888;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px'>"+lb+"</div>"
    +"<div style='font-size:20px;font-weight:800;color:"+col+"'>"+esc(val)+"</div>"
    +(sub?"<div style='font-size:11px;color:#aaa;margin-top:2px'>"+esc(sub)+"</div>":"")+"</div>"
    +(ic?"<i class='ti "+ic+"' style='font-size:26px;color:"+col+";opacity:.15'></i>":"")
    +"</div></div>";
}


// ═══ STATUS DO COLABORADOR ═══
// Ativo: campo "ativo" (novo). Cadastros antigos sem o campo: ativo se nao tiver data de demissao.
function isAtivo(e){
  var a=e.ativo===undefined?!e.dem:e.ativo!==false;
  // Inativo com vigencia: antes do inicio ou depois do fim volta a contar como ativo
  if(!a&&!e.dem&&e.inat){var h=hoje();if(e.inat>h)return true;if(e.inatFim&&e.inatFim<h)return true;}
  return a;
}
// Inativo (temporario) em uma data
function inatEm(e,ds){
  if(e.dem&&e.dem<ds)return false;
  if(e.inatHist&&e.inatHist.length)return e.inatHist.some(function(x){return x.ini&&x.ini<=ds&&(!x.fim||x.fim>=ds);});
  if(e.ativo===false&&!e.dem)return (!e.inat||e.inat<=ds)&&(!e.inatFim||e.inatFim>=ds);
  return false;
}
// Conta para o mes (premios/relatorios): ativo, ou saiu (demissao/inativacao) depois daquele mes.
function empNoMes(e,mes){
  if(isAtivo(e))return true;
  var c=e.dem||e.inat;
  return !!c&&gmk(c)>mes;
}
function fmtD(d){if(!d)return "";var p=d.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:d;}
function gv(id){var el=document.getElementById(id);return el?el.value:"";}

// ═══ AFASTAMENTO E DATAS COMEMORATIVAS ═══
function mmdd(d){return d&&d.length>=10?d.slice(5,10):"";} // "MM-DD"
function anosInt(dataRef,dataBase){ // anos inteiros completos de dataBase ate dataRef
  if(!dataBase)return 0;
  var b=new Date(dataBase+"T12:00:00"),r=new Date(dataRef+"T12:00:00");
  var a=r.getFullYear()-b.getFullYear();
  if(r.getMonth()<b.getMonth()||(r.getMonth()===b.getMonth()&&r.getDate()<b.getDate()))a--;
  return a;
}
// Colaborador afastado em uma data especifica (dentro de algum periodo de afastamento)
function afastadoEm(e,data){
  if(!e.afast||!e.afast.length)return null;
  for(var i=0;i<e.afast.length;i++){
    var af=e.afast[i];
    if(af.ini&&af.ini<=data&&(!af.fim||af.fim>=data))return af;
  }
  return null;
}
// Colaborador afastado durante o mes m ("YYYY-MM") - qualquer sobreposicao com o mes
function afastadoNoMes(e,m){
  if(!e.afast||!e.afast.length)return false;
  var ini=m+"-01",fim=fimMesStr(m);
  return e.afast.some(function(af){return af.ini&&af.ini<=fim&&(!af.fim||af.fim>=ini);});
}
// Colaborador visivel no sistema: nao esta afastado hoje (afastado some de todas as telas e relatorios, exceto Colaboradores)
function vis(e){return !!e&&!afastadoEm(e,hoje());}
function ativoVis(e){return isAtivo(e)&&vis(e);}
// Filtro de lancamentos: oculta ocorrencias de colaboradores afastados
function ocVisF(){var h={};DB.emp.forEach(function(e){if(!vis(e))h[e.id]=1;});return function(o){return !h[o.eid];};}
// Conta para premios/relatorios: dentro do vinculo E nao afastado no mes E nao afastado hoje
function contaNoMes(e,m){return empNoMes(e,m)&&!afastadoNoMes(e,m)&&vis(e);}


// ═══ DETALHE DOS GRAFICOS DO DASHBOARD (clique para ver e editar) ═══
var DRILL=null;
function lblSenso(o){var s=o.senso_id?DB.sensos.find(function(x){return x.id===o.senso_id;}):null;return s?s.nome:"Sem criterio";}
function lblMotivo(o){var m=o.motivo_id?DB.motivos.find(function(x){return x.id===o.motivo_id;}):null;return m?m.nome:"Sem motivo";}
function attachDrill(chart,tipo){
  if(!chart)return;
  var cv=chart.canvas;
  cv.title="Clique para ver e editar os lancamentos";
  cv.addEventListener("click",function(ev){
    var els=chart.getElementsAtEventForMode(ev,"nearest",{intersect:true},true);
    if(!els.length)return;
    openDrill(tipo,chart.data.labels[els[0].index]);
  });
  cv.addEventListener("mousemove",function(ev){
    var els=chart.getElementsAtEventForMode(ev,"nearest",{intersect:true},false);
    cv.style.cursor=els.length?"pointer":"default";
  });
}
function drillItens(d){
  var noP=window._dashNoPeriodo||function(){return true;};
  var ocV=ocVisF();
  if(d.mes){
    // Grafico Faltas e Atrasos por Mes: mesmos colaboradores contados no grafico (premio cadastrado, no vinculo, nao afastado)
    return DB.oc.filter(function(o){
      if(o.tipo!==d.tipo||gmk(o.data)!==d.mes)return false;
      var e=DB.emp.find(function(x){return x.id===o.eid;});
      return !!e&&contaNoMes(e,d.mes)&&!isMEI(e)&&DB.pr.some(function(p){return p.eid===e.id;});

// ═══ CORES DEGRADE PARA GRAFICOS ═══
function shade(hex,p){
  var h=hex.replace("#","");if(h.length===3)h=h.split("").map(function(c){return c+c;}).join("");
  var n=parseInt(h,16),r=n>>16,g=(n>>8)&255,b=n&255;
  function f(c){return Math.round(p<0?c*(1+p):c+(255-c)*p);}
  return "rgb("+f(r)+","+f(g)+","+f(b)+")";
}
// Degrade vertical (barras): mais claro na base, cor cheia no topo
function vGrad(c){
  return function(ctx){
    var ch=ctx.chart,a=ch.chartArea;if(!a)return c;
    var g=ch.ctx.createLinearGradient(0,a.bottom,0,a.top);
    g.addColorStop(0,shade(c,.55));g.addColorStop(.6,shade(c,.05));g.addColorStop(1,shade(c,-.18));
    return g;
  };
}
// Degrade por fatia (rosca/pizza)
function segGrad(colors){
  return function(ctx){
    var c=colors[ctx.dataIndex%colors.length]||"#888";
    var ch=ctx.chart,a=ch.chartArea;if(!a)return c;
    var g=ch.ctx.createLinearGradient(a.left,a.top,a.right,a.bottom);
    g.addColorStop(0,shade(c,.32));g.addColorStop(1,shade(c,-.22));
    return g;
  };
}

function rDash(){

  var selMes=document.getElementById("dash-mes")&&document.getElementById("dash-mes").value||curMes();
  var modo=document.getElementById("dash-modo")&&document.getElementById("dash-modo").value||"mes"; // "mes" ou "ano"

  // Build year options
  var anos={};DB.oc.forEach(function(o){anos[gmk(o.data).split("-")[0]]=1;});DB.pr.forEach(function(p){});
  var anoAtual=String(new Date().getFullYear());anos[anoAtual]=1;
  var anoOpts=Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");

  // Testa se uma data cai dentro do periodo selecionado (mes especifico ou o ano inteiro)
  function noPeriodo(dataStr){
    return modo==="ano"?gmk(dataStr).split("-")[0]===selAno:gmk(dataStr)===selMes;
  }

  // Build annual data - usa apenas os meses que realmente possuem lancamentos (ocorrencias) no ano,
  // em vez de forcar Jan-Dez inteiro (que gerava valores de premio "fantasma" em meses sem nenhum uso do sistema)
  var mesesComDado={};
  DB.oc.forEach(function(o){var m=gmk(o.data);if(m.split("-")[0]===selAno)mesesComDado[m]=1;});
  if(selAno===String(new Date().getFullYear()))mesesComDado[curMes()]=1; // sempre inclui o mes atual, mesmo sem lancamentos
  var meses12=Object.keys(mesesComDado).sort();
  var lblAnual=meses12.map(function(m){return MOS[parseInt(m.split("-")[1],10)-1];});
  var aPago=[],aPerd=[],aFaltas=[],aAtrasos=[];
  meses12.forEach(function(mes){
    var p2=0,l2=0,f2=0,a2=0;
    DB.emp.forEach(function(e){
      if(!contaNoMes(e,mes)||isMEI(e))return;
      var pr=DB.pr.find(function(x){return x.eid===e.id;});if(!pr)return;
      var d=calcDesc(e.id,mes,pr.val);p2+=d.rec;l2+=d.desc;f2+=d.f;a2+=d.a;
    });
    aPago.push(+p2.toFixed(2));aPerd.push(+l2.toFixed(2));aFaltas.push(f2);aAtrasos.push(a2);
  });

  // Stats para o periodo selecionado (mes ou ano acumulado)
  var tp=0,tl=0,tf=0,ta=0,ok=0;
  if(modo==="ano"){
    tp=aPago.reduce(function(a,b){return a+b;},0);
    tl=aPerd.reduce(function(a,b){return a+b;},0);
    tf=aFaltas.reduce(function(a,b){return a+b;},0);
    ta=aAtrasos.reduce(function(a,b){return a+b;},0);
    DB.emp.forEach(function(e){
      if(isMEI(e))return;var p=DB.pr.find(function(x){return x.eid===e.id;});if(!p)return;
      var mesesEmp=meses12.filter(function(mes){return contaNoMes(e,mes);});
      if(mesesEmp.length===0)return;
      var perfeito=mesesEmp.every(function(mes){return calcDesc(e.id,mes,p.val).pct===0;});
      if(perfeito)ok++;
    });
  }else{
    DB.emp.forEach(function(e){

    // RANKING FALTAS E ATRASOS

  // Annual paid chart (degrade + rotulos maiores)
  var hasDL=typeof ChartDataLabels!=="undefined";
  var dlPlugins=hasDL?[ChartDataLabels]:[];
  function barDL(money){
    return {display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},anchor:"end",align:"top",offset:3,
      color:function(ctx){return ctx.dataset.dlc||"#333";},font:{size:12.5,weight:800},
      formatter:function(v){return money?fmtBRLInt(v):v;}};
  }
  function barScales(money){
    return {y:{beginAtZero:true,grace:"12%",ticks:{precision:money?undefined:0,callback:money?function(v){return fmtBRLInt(v);}:undefined,font:{size:11},color:"#7a838c"},grid:{color:"#f1f4f8"},border:{display:false}},
            x:{ticks:{font:{size:12,weight:600},color:"#555"},grid:{display:false}}};
  }
  CH.anopago=new Chart(document.getElementById("ch-anopago"),{type:"bar",
    plugins:dlPlugins,
    data:{labels:lblAnual,datasets:[{label:"Total Pago (R$)",data:aPago,backgroundColor:vGrad(BL),hoverBackgroundColor:BL,dlc:B,borderRadius:6,borderSkipped:false,maxBarThickness:90}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:6}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return fmtBRL(ctx.raw);}}},datalabels:barDL(true)},
      scales:barScales(true)}});

  // Annual lost chart
  CH.anoperd=new Chart(document.getElementById("ch-anoperd"),{type:"bar",
    plugins:dlPlugins,
    data:{labels:lblAnual,datasets:[{label:"Total Perdido (R$)",data:aPerd,backgroundColor:vGrad(RED),hoverBackgroundColor:RED,dlc:RED,borderRadius:6,borderSkipped:false,maxBarThickness:90}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:6}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return fmtBRL(ctx.raw);}}},datalabels:barDL(true)},
      scales:barScales(true)}});

  // Annual Faltas/Atrasos chart
  CH.anofa=new Chart(document.getElementById("ch-anofa"),{type:"bar",
    plugins:dlPlugins,
    data:{labels:lblAnual,datasets:[
      {label:"Faltas",data:aFaltas,backgroundColor:vGrad(RED),hoverBackgroundColor:RED,dlc:RED,borderRadius:6,borderSkipped:false,maxBarThickness:90},
      {label:"Atrasos",data:aAtrasos,backgroundColor:vGrad(GLD),hoverBackgroundColor:GLD,dlc:"#b8820a",borderRadius:6,borderSkipped:false,maxBarThickness:90}
    ]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:6}},
      plugins:{legend:{position:"top",labels:{boxWidth:12,font:{size:12},padding:10,
          generateLabels:function(chart){return chart.data.datasets.map(function(ds,i){return{text:ds.label,fillStyle:ds.hoverBackgroundColor,strokeStyle:ds.hoverBackgroundColor,lineWidth:0,hidden:!chart.isDatasetVisible(i),datasetIndex:i};});}}},
        tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+": "+ctx.raw;}}},
        datalabels:barDL(false)},
      scales:barScales(false)}});

  // Motivo pie helper
  function mkBreakdown(ocs,getLabel,getColor){
    var map={};
    ocs.forEach(function(o){var lb=getLabel(o);map[lb]=(map[lb]||0)+1;});
    var lbs=Object.keys(map),vals=lbs.map(function(k){return map[k];});
    var cols=lbs.map(function(lb,i){return getColor(lb,i);});
    return{labels:lbs,values:vals,colors:cols};
  }
  function mkPieFromBreakdown(cid,bd){
    if(bd.labels.length===0||!document.getElementById(cid))return null;
    return new Chart(document.getElementById(cid),{type:"doughnut",
      plugins:dlPlugins,
      data:{labels:bd.labels,datasets:[{data:bd.values,backgroundColor:segGrad(bd.colors),hoverBackgroundColor:bd.colors,borderWidth:2,borderColor:"#fff",hoverOffset:6}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"52%",layout:{padding:4},
        plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:11},padding:6,
          generateLabels:function(chart){var l=Chart.overrides.doughnut.plugins.legend.labels.generateLabels(chart);l.forEach(function(it,i){it.fillStyle=bd.colors[i%bd.colors.length];});return l;}}},
        tooltip:{callbacks:{label:function(ctx){return ctx.label+": "+ctx.raw;}}},
        datalabels:{color:"#fff",font:{size:13,weight:800},textStrokeColor:"rgba(0,0,0,.25)",textStrokeWidth:2,formatter:function(v){return v;}}}}});
  }
  var RPAL=["#c0392b","#e74c3c","#ff6b6b","#fab1a0","#d63031","#b71c1c"];
  var GPAL=["#e6a817","#f39c12","#fdcb6e","#e17055","#d4a017","#ff9f43"];
  var fOcs=DB.oc.filter(function(o){return o.tipo==="falta"&&noPeriodo(o.data)&&ocV(o);});
  var aOcs=DB.oc.filter(function(o){return o.tipo==="atraso"&&noPeriodo(o.data)&&ocV(o);});
  // 5S: usa os lancamentos (eventos) e nao os registros por colaborador, para nao inflar a contagem
  var sEvts=DB.oc5.filter(function(o){return noPeriodo(o.data);});
  var motivoLabel=function(o){var m=o.motivo_id?DB.motivos.find(function(x){return x.id===o.motivo_id;}):null;return m?m.nome:"Sem motivo";};
  var bdFaltas=mkBreakdown(fOcs,motivoLabel,function(lb,i){return RPAL[i%RPAL.length];});
  var bdAtrasos=mkBreakdown(aOcs,motivoLabel,function(lb,i){return GPAL[i%GPAL.length];});
  var bd5S=mkBreakdown(sEvts,
    function(o){var s=o.senso_id?DB.sensos.find(function(x){return x.id===o.senso_id;}):null;return s?s.nome:"Sem criterio";},
    function(lb){var s=DB.sensos.find(function(x){return x.nome===lb;});return(s&&s.cor)?s.cor:"#7b3fa0";}
  );
  CH.fmot=mkPieFromBreakdown("ch-fmot",bdFaltas);
  CH.amot=mkPieFromBreakdown("ch-amot",bdAtrasos);
  CH.smot=mkPieFromBreakdown("ch-smot",bd5S);
  attachDrill(CH.fmot,"falta");attachDrill(CH.amot,"atraso");attachDrill(CH.smot,"5s");
  attachDrillMes(CH.anofa,meses12);
  window._dashNoPeriodo=noPeriodo;window._dashML=ml;

  // Guarda os dados ja calculados para o gerador de Relatorio PDF reaproveitar (inclui dados brutos dos graficos)
  window._dashStats={selAno:selAno,selMes:selMes,modo:modo,ml:ml,sufixo:sufixo,tp:tp,tl:tl,tf:tf,ta:ta,ts:ts,ok:ok,rankF:rankF,rankA:rankA,
    lblAnual:lblAnual,aPago:aPago,aPerd:aPerd,aFaltas:aFaltas,aAtrasos:aAtrasos,
    motFaltas:bdFaltas,motAtrasos:bdAtrasos,sensos5S:bd5S};
}
function setDashModo(m){
  var el=document.getElementById("dash-modo");if(el)el.value=m;
  rDash();
}

// ═══════════════════════════════════════
// RELATORIO PDF DO DASHBOARD (2 folhas A4)
// ═══════════════════════════════════════
function gerarRelatorioPDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF)){alert("A biblioteca de PDF ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  if(typeof Chart==="undefined"){alert("A biblioteca de graficos ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  var st=window._dashStats;
  if(!st){alert("Abra o Dashboard antes de gerar o relatorio.");return;}
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({unit:"mm",format:"a4",orientation:"landscape",compress:true});
  var pageW=297,pageH=210,mg=13,cw=pageW-mg*2;
  var rgbB=[0,52,143],rgbBL=[30,91,198],rgbINK=[10,31,74],rgbRED=[192,57,43],rgbGRN=[26,122,74],rgbGLD=[230,168,23],rgbPUR=[123,63,160],rgbLine=[226,231,238];
  var BANDH=25,PXSCALE=7;

  function rgba(rgb,a){return "rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+(a===undefined?1:a)+")";}

  // ---- Elementos base reutilizaveis ----
  function panel(x,y,w,h){
    doc.setFillColor(255,255,255);
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.35);
    doc.roundedRect(x,y,w,h,2,2,"FD");
  }
  function header(titulo){
    doc.setFillColor(255,255,255);
    doc.rect(0,0,pageW,BANDH,"F");
    if(window._logoPNG){
      doc.addImage(window._logoPNG,"PNG",mg-1.5,4.2,28.6,13);
    }else{
      doc.setFont("helvetica","bold");doc.setFontSize(15);
      doc.setTextColor(rgbB[0],rgbB[1],rgbB[2]);
      doc.text("TIMBÓ",mg,11);
    }
    doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.setTextColor(rgbINK[0],rgbINK[1],rgbINK[2]);
    doc.text(titulo,pageW-mg,10.5,{align:"right"});
    var agora=new Date();
    var dataStr=agora.toLocaleDateString("pt-BR")+" as "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    doc.setFont("helvetica","normal");doc.setFontSize(8);
    doc.setTextColor(95,105,120);
    doc.text("Periodo: "+st.ml,pageW-mg,16,{align:"right"});
    doc.setFontSize(7);doc.setTextColor(150,158,170);
    doc.text("Gerado em "+dataStr,pageW-mg,20.5,{align:"right"});
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.4);doc.line(mg,BANDH,pageW-mg,BANDH);
    return BANDH+9;
  }
  function footer(pagNum){
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.3);
    doc.line(mg,pageH-10,pageW-mg,pageH-10);
    doc.setFont("helvetica","normal");doc.setFontSize(7.3);doc.setTextColor(165,165,165);
    doc.text("Timbó Papéis Especiais - Sistema de Gestão de Prêmios",mg,pageH-6);
    doc.text("Documento gerado automaticamente pelo sistema",pageW/2,pageH-6,{align:"center"});
    doc.text("Pagina "+pagNum+"/2",pageW-mg,pageH-6,{align:"right"});
  }
  function sectionLabel(txt,x,y,rgb){
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(x,y-3.2,2.2,2.2,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(10.5);
    doc.setTextColor(50,50,50);
    doc.text(txt,x+4.5,y);
  }
  function statCard(x,y,w,h,lb,val,rgb){
    panel(x,y,w,h);
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(x,y,w,1.1,"F");
    doc.setFont("helvetica","normal");doc.setFontSize(6.8);
    doc.setTextColor(130,130,130);
    doc.text(String(lb).toUpperCase(),x+3,y+7.5);
    doc.setFont("helvetica","bold");doc.setFontSize(12.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(String(val),x+3,y+15.5);
  }
  // Painel que recebe uma imagem de grafico JA renderizada no tamanho exato da area util (sem sobra/distorcao)
  function chartPanel(imgDataUrl,x,y,w,h,titulo,rgb){
    panel(x,y,w,h);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(titulo,x+4,y+6.5);
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.25);
    doc.line(x+4,y+8.5,x+w-4,y+8.5);
    var areaX=x+4,areaY=y+11,areaW=w-8,areaH=h-14;
    if(!imgDataUrl){
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(190,190,190);
      doc.text("Sem dados no periodo",x+w/2,y+h/2,{align:"center"});
      return;
    }
    doc.addImage(imgDataUrl,"PNG",areaX,areaY,areaW,areaH);
  }
  function rankPanel(x,y,w,h,title,items,rgb,colLabel){
    panel(x,y,w,h);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(title,x+4,y+6.5);
    var tx=x+4,tw=w-8,rowH=5.6,yy=y+9.5;
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(tx,yy,tw,rowH,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(7.3);doc.setTextColor(255,255,255);
    doc.text("#",tx+2.5,yy+3.8);
    doc.text("Colaborador",tx+9,yy+3.8);
    doc.text(colLabel,tx+tw-2.5,yy+3.8,{align:"right"});
    yy+=rowH;
    var maxRows=Math.max(1,Math.floor((h-(yy-y)-3)/rowH));
    var top=items.slice(0,Math.min(10,maxRows));
    if(top.length===0){
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(190,190,190);
      doc.text("Sem ocorrencias no periodo",tx+2.5,yy+4);
      return;
    }
    top.forEach(function(it,i){
      if(i%2===1){doc.setFillColor(248,250,255);doc.rect(tx,yy,tw,rowH,"F");}
      doc.setFont("helvetica","normal");doc.setFontSize(7.3);doc.setTextColor(70,70,70);
      doc.text(String(i+1),tx+2.5,yy+3.8);
      var nomeShort=it.nome.length>36?it.nome.slice(0,34)+"...":it.nome;
      doc.text(nomeShort,tx+9,yy+3.8);
      doc.setFont("helvetica","bold");doc.setTextColor(rgb[0],rgb[1],rgb[2]);
      doc.text(String(it.count),tx+tw-2.5,yy+3.8,{align:"right"});
      yy+=rowH;
    });
  }

  // ---- Geracao de graficos em canvas temporario (fora da tela), no tamanho EXATO da area do painel ----
  // Isso garante que a imagem preencha o quadrado inteiro, sem sobra branca nem distorcao.
  function tempCanvas(pxW,pxH){
    var cv=document.createElement("canvas");
    cv.width=pxW;cv.height=pxH;
    cv.style.position="fixed";cv.style.left="-99999px";cv.style.top="0";
    document.body.appendChild(cv);
    return cv;
  }
  var dlP=(typeof ChartDataLabels!=="undefined")?[ChartDataLabels]:[];
  function renderOffscreen(cfg,areaW,areaH){
    var pxW=Math.max(50,Math.round(areaW*PXSCALE)),pxH=Math.max(50,Math.round(areaH*PXSCALE));
    var cv=tempCanvas(pxW,pxH);
    var ch=new Chart(cv,cfg);
    var img=ch.toBase64Image();
    ch.destroy();cv.remove();
    return img;
  }
  function doughnutImg(bd,areaW,areaH){
    if(!bd||!bd.labels||bd.labels.length===0)return null;
    return renderOffscreen({type:"doughnut",plugins:dlP,
      data:{labels:bd.labels,datasets:[{data:bd.values,backgroundColor:bd.colors,borderWidth:2,borderColor:"#fff"}]},
      options:{responsive:false,animation:false,
        plugins:{legend:{position:"bottom",labels:{boxWidth:16,font:{size:15},padding:10}},
          datalabels:{color:"#fff",font:{size:15,weight:700},formatter:function(v){return v;}}}}
    },areaW,areaH);
  }
  function barImg(labels,datasets,areaW,areaH,money){
    if(!labels||labels.length===0)return null;
    return renderOffscreen({type:"bar",plugins:dlP,
      data:{labels:labels,datasets:datasets},
      options:{responsive:false,animation:false,
        plugins:{legend:{display:datasets.length>1,position:"top",labels:{boxWidth:14,font:{size:14},padding:8}},
          datalabels:{display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},anchor:"end",align:"top",
            color:function(ctx){return ctx.dataset.borderColor;},font:{size:12,weight:700},
            formatter:function(v){return money?fmtBRLInt(v):v;}}},
        scales:{y:{beginAtZero:true,ticks:{font:{size:13},precision:money?2:0,callback:money?function(v){return fmtBRLInt(v);}:undefined},grid:{color:"#f2f4f8"}},
                x:{ticks:{font:{size:13}},grid:{display:false}}}}
    },areaW,areaH);
  }

  // ===== PAGINA 1 - VISAO GERAL =====
  var tituloModo=st.modo==="ano"?"Relatorio Anual (Acumulado)":"Relatorio Mensal";
  var y=header(tituloModo);

  sectionLabel("Indicadores - "+st.ml,mg,y,rgbB);
  y+=4;
  var statsArr=[
    {lb:"Colaboradores ativos",val:String(DB.emp.filter(ativoVis).length),rgb:rgbB},
    {lb:"100% Premio "+st.sufixo,val:String(st.ok),rgb:rgbGRN},
    {lb:"Total Pago "+st.sufixo,val:fmtBRL(st.tp),rgb:rgbBL},
    {lb:"Total Perdido "+st.sufixo,val:fmtBRL(st.tl),rgb:rgbRED},
    {lb:"Faltas",val:String(st.tf),rgb:rgbRED},
    {lb:"Atrasos",val:String(st.ta),rgb:rgbGLD},
    {lb:"Infracoes 5S",val:String(st.ts),rgb:rgbPUR}
  ];
  var gap=3.5,cardW=(cw-6*gap)/7,cardH=20;
  statsArr.forEach(function(s,i){
    statCard(mg+i*(cardW+gap),y,cardW,cardH,s.lb,s.val,s.rgb);
  });
  y+=cardH+9;

  sectionLabel("Evolucao Anual - "+st.selAno,mg,y,rgbB);
  y+=4;
  var colW=(cw-2*gap)/3,chartH=Math.min(105,pageH-10-y-4);
  var areaW1=colW-8,areaH1=chartH-14;
  var imgPago=barImg(st.lblAnual,[{label:"Total Pago",data:st.aPago,backgroundColor:rgba(rgbGRN,.82),borderColor:rgba(rgbGRN,1),borderRadius:4}],areaW1,areaH1,true);
  var imgPerd=barImg(st.lblAnual,[{label:"Total Perdido",data:st.aPerd,backgroundColor:rgba(rgbRED,.82),borderColor:rgba(rgbRED,1),borderRadius:4}],areaW1,areaH1,true);
  var imgFA=barImg(st.lblAnual,[
    {label:"Faltas",data:st.aFaltas,backgroundColor:rgba(rgbRED,.82),borderColor:rgba(rgbRED,1),borderRadius:4},
    {label:"Atrasos",data:st.aAtrasos,backgroundColor:rgba(rgbGLD,.82),borderColor:rgba(rgbGLD,1),borderRadius:4}
  ],areaW1,areaH1,false);
  chartPanel(imgPago,mg,y,colW,chartH,"Total Pago por Mes",rgbGRN);
  chartPanel(imgPerd,mg+colW+gap,y,colW,chartH,"Total Perdido por Mes",rgbRED);
  chartPanel(imgFA,mg+2*(colW+gap),y,colW,chartH,"Faltas e Atrasos por Mes",rgbB);

  footer(1);

  // ===== PAGINA 2 - MOTIVOS E RANKINGS =====
  doc.addPage();
  y=header(tituloModo);

  sectionLabel("Motivos das Ocorrencias - "+st.ml,mg,y,rgbB);
  y+=4;
  var motH=72;

function savCC(){
  var id=gv("cceid");
  var cod=gv("cccod").trim(),desc=gv("ccdesc").trim(),resp=gv("ccresp").trim(),obs=gv("ccobs").trim();
  if(!cod||!desc){alert("Preencha codigo e descricao.");return;}

  var obj={id:id||uid(),cod:cod,desc:desc,resp:resp,obs:obs};

}
function edtCC(id){

function delCC(id){
  var cnt=DB.emp.filter(function(e){return e.ccid===id;}).length;
  var msg=cnt>0?"C.C. Senior possui "+cnt+" colaborador"+(cnt!==1?"es":"")+". Remover mesmo assim?":"Remover este C.C. Senior?";

  DB.cc=DB.cc.filter(function(x){return x.id!==id;});
  DB.emp=DB.emp.map(function(e){return e.ccid===id?Object.assign({},e,{ccid:""}):e;});

}

function setVccFiltro(c){var s=document.getElementById("vcc-fc");if(s){s.value=c;renderVcc();}}
function vccLista(){
  var q=(gv("vcc-q")||"").toLowerCase(),em=gv("vcc-emp"),fc=gv("vcc-fc"),sit=gv("vcc-sit")||"ativos";
  var ids={};DB.cc.forEach(function(c){ids[c.id]=1;});
  return DB.emp.filter(function(e){
    if(sit==="ativos"&&!isAtivo(e))return false;
    if(em&&e.empresa!==em)return false;
    if(fc==="_sem"&&e.ccid&&ids[e.ccid])return false;
    if(fc&&fc!=="_sem"&&e.ccid!==fc)return false;
    return !q||e.nome.toLowerCase().includes(q)||(e.func||"").toLowerCase().includes(q);
  }).sort(function(a,b){return (a.empresa||"").localeCompare(b.empresa||"")||(a.func||"").localeCompare(b.func||"")||a.nome.localeCompare(b.nome);});
}

// e.mv = {"2026-10":{sal,adic,cesta,pmetas,bonus,refeit,inssMan,fgtsMan}}
// Os campos "atuais" do colaborador (e.sal, e.cesta...) espelham o ultimo mes lancado ate o mes atual,
// assim as demais telas continuam funcionando com o valor vigente.
var MV_K=["sal","adic","hextra","pprodPct","cesta","pmetas","bonus","refeit","inssMan","fgtsMan"];
var empMesV=null;
function empMesSel(){return empMesV||curMes();}
function mvPick(e){var o={};MV_K.forEach(function(k){if(typeof e[k]==="number")o[k]=e[k];});return o;}
function empView(e,m){
  if(!e||!e.mv)return e;
  var v=Object.assign({},e);MV_K.concat(["terco","dec13","custo"]).forEach(function(k){delete v[k];});
  v._mes=m;var d=e.mv[m];
  if(!d){v._semMes=true;return v;}
  MV_K.forEach(function(k){if(typeof d[k]==="number")v[k]=d[k];});
  if(typeof v.sal==="number"){var c=isMEI(v)?{terco:0,dec13:0}:calcSal(v.sal);v.terco=c.terco;v.dec13=c.dec13;}
  return v;
}
function mvSync(n){
  if(!n.mv)return n;
  var cm=curMes(),ks=Object.keys(n.mv).filter(function(m){return m<=cm;}).sort();
  if(!ks.length)return n;
  var d=n.mv[ks[ks.length-1]];
  MV_K.forEach(function(k){if(typeof d[k]==="number")n[k]=d[k];else delete n[k];});
  if(typeof n.sal==="number"){var c=isMEI(n)?{terco:0,dec13:0}:calcSal(n.sal);n.terco=c.terco;n.dec13=c.dec13;}else{delete n.terco;delete n.dec13;}
  if(empTemValores(n))n.custo=calcCusto(n);else delete n.custo;
  return n;
}
// Primeira carga: preenche jan a out/2026 com os valores atuais (salario respeitando os reajustes). Nov e dez ficam em branco.
function mvMigrar(){
  var ms=[];for(var i=1;i<=10;i++)ms.push("2026-"+String(i).padStart(2,"0"));
  (DB.emp||[]).forEach(function(e){
    if(e.mv)return;
    var mv={};
    ms.forEach(function(m){
      if(!empAtivoNoMes(e,m))return;
      var d=mvPick(e),sm=salNoMes(e,m);if(sm===undefined)delete d.sal;else d.sal=sm;
      if(Object.keys(d).length)mv[m]=d;
    });
    e.mv=mv;
  });
}
window.mvMigrar=mvMigrar;

    +" &middot; os valores digitados na tabela gravam neste mes";
}
function abrirCopiaMes(){
  fecharCopiaMes();
  var dest=empMesSel(),s={};
  DB.emp.forEach(function(e){if(e.mv)Object.keys(e.mv).forEach(function(m){if(m!==dest)s[m]=(s[m]||0)+1;});});
  var ms=Object.keys(s).sort().reverse();
  if(!ms.length){alert("Nao ha outro mes com valores lancados para copiar.");return;}
  var ant=ms.filter(function(m){return m<dest;})[0]||ms[0];
  var nTela=empListaVisivel().length;
  function radio(nm,v,lb,on){return "<label class='pdf-opt'><input type='radio' name='"+nm+"' value='"+v+"'"+(on?" checked":"")+"/>"+lb+"</label>";}
  var div=document.createElement("div");div.className="mdl-bg open";div.id="md-cpmes";div.style.zIndex="9500";
  div.innerHTML="<div class='mdl' role='dialog' aria-modal='true' style='width:480px'>"
    +"<div class='mdl-hd'><div class='mdl-tt'><i class='ti ti-copy'></i>Copiar valores de outro mes</div>"
    +"<button class='mdl-x' onclick='fecharCopiaMes()' aria-label='Fechar'><i class='ti ti-x'></i></button></div><div class='mdl-bd'>"
    +"<div class='fr2'><div class='fr'><label class='lbl'>Copiar de</label><select id='cpm-ori'>"
    +ms.map(function(m){return "<option value='"+m+"'"+(m===ant?" selected":"")+">"+fmtM(m)+" ("+s[m]+")</option>";}).join("")+"</select></div>"
    +"<div class='fr'><label class='lbl'>Para</label><input type='text' value='"+fmtM(dest)+"' readonly style='background:#f1f4f8;font-weight:700'/></div></div>"
    +"<div class='fr'><label class='lbl'>Colaboradores</label><div class='pdf-opts'>"
    +radio("cpm-esc","tela","Os listados na tela ("+nTela+")",true)+radio("cpm-esc","todos","Todos com vinculo no mes")+"</div></div>"
    +"<div class='fr'><label style='display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer'><input type='checkbox' id='cpm-sob' style='width:auto'/> Sobrescrever quem ja tem valores lancados em "+fmtM(dest)+"</label></div>"
    +"<div class='hint'>Copia salario, adicional, hora extra, % premio de producao, cesta basica, premio metas, bonus anual, refeitorio e INSS/FGTS manuais. 1/3, 13o, assiduidade e custo sao recalculados.</div>"
    +"<div class='mdl-ft'><button class='btng' onclick='fecharCopiaMes()'>Cancelar</button><button class='btnp btn-ic' onclick='confCopiaMes()'><i class='ti ti-copy'></i>Copiar</button></div>"
    +"</div></div>";
  document.body.appendChild(div);
  div.addEventListener("mousedown",function(ev){if(ev.target===div)fecharCopiaMes();});
}
function fecharCopiaMes(){var m=document.getElementById("md-cpmes");if(m)m.remove();}
function confCopiaMes(){
  var ori=gv("cpm-ori"),dest=empMesSel(),sob=!!document.getElementById("cpm-sob").checked,esc0=_radio("cpm-esc")||"tela";
  var ids={};(esc0==="tela"?empListaVisivel():DB.emp.filter(function(e){return empAtivoNoMes(e,dest);})).forEach(function(e){ids[e.id]=1;});
  var n=0;
  DB.emp=DB.emp.map(function(e){
    if(!ids[e.id]||!e.mv||!e.mv[ori]||(!sob&&e.mv[dest]))return e;
    var x=Object.assign({},e);x.mv=Object.assign({},e.mv);x.mv[dest]=Object.assign({},e.mv[ori]);mvSync(x);n++;return x;
  });
  fecharCopiaMes();
  if(!n){alert("Nenhum valor copiado (os colaboradores ja tinham valores no mes ou nao tinham valores no mes de origem).");return;}
  dbSave();filtEmp();empMesInfo();
  showSync(n+" colaborador"+(n>1?"es":"")+" com valores copiados de "+fmtM(ori)+" para "+fmtM(dest),true);
  setTimeout(function(){document.getElementById("sync-bar").style.display="none";},2500);
}

function xsSync(){
  document.querySelectorAll(".xs-wrap").forEach(function(w){
    var t=w.previousElementSibling;if(!t||!t.classList.contains("xs-top"))return;
    var i=t.firstElementChild;i.style.width=w.scrollWidth+"px";
    t.style.display=w.scrollWidth>w.clientWidth+1?"":"none";
    var lock=false;
    t.onscroll=function(){if(lock){lock=false;return;}lock=true;w.scrollLeft=t.scrollLeft;};
    w.addEventListener("scroll",function(){if(lock){lock=false;return;}lock=true;t.scrollLeft=w.scrollLeft;});
    t.scrollLeft=w.scrollLeft;
  });
}

  if(MONEY_K.indexOf(k)>=0){var v=empCampoVal(e,k);return v===null?"":fmtBRL(v);}
  if(k==="pprodPct")return typeof e.pprodPct==="number"&&!e._semMes?pct2(e.pprodPct):"";
  return (k==="nome"?e.nome:e[k])||"";
}
function empSortVal(e,k){
  if(k==="pprodPct")return typeof e.pprodPct==="number"&&!e._semMes?e.pprodPct:-1;
  if(MONEY_K.indexOf(k)>=0){var v=empCampoVal(e,k);return v===null?-1:v;}
  if(k==="adm"||k==="aniv")return e[k]||"";
  if(k==="tempo")return e.adm?-(new Date(e.adm+"T12:00:00").getTime()):1e15;

// Menu do cabecalho (estilo Excel): classificar, filtrar valores, ocultar coluna
function fecharColMenu(){var m=document.getElementById("etab-menu");if(m)m.remove();}
function abrirColMenu(ev,k){
  ev.stopPropagation();
  var ja=document.getElementById("etab-menu");if(ja&&ja.dataset.k===k){fecharColMenu();return;}
  fecharColMenu();
  var col=EMP_COLS.find(function(c){return c.k===k;});
  var num=MONEY_K.indexOf(k)>=0,dt=col.t==="dt"||k==="tempo";
  var lA=num?"Menor para maior":dt?"Mais antigo para mais novo":"Classificar de A a Z";
  var lZ=num?"Maior para menor":dt?"Mais novo para mais antigo":"Classificar de Z a A";
  // valores distintos considerando as demais colunas filtradas
  var salva=empColFil[k];delete empColFil[k];
  var base=empListaVisivel();if(salva)empColFil[k]=salva;
  var vals={};base.forEach(function(e){vals[empTxt(e,k)]=1;});
  var lv=Object.keys(vals).sort(function(a,b){
    if(num){var pa=parseFloat(a.replace(/[^0-9,]/g,"").replace(",","."))||0,pb=parseFloat(b.replace(/[^0-9,]/g,"").replace(",","."))||0;return pa-pb;}
    if(col.t==="dt"){return a.split("/").reverse().join("").localeCompare(b.split("/").reverse().join(""));}
    return a.localeCompare(b);});
  var sel=empColFil[k];
  var m=document.createElement("div");m.id="etab-menu";m.className="etab-menu";m.dataset.k=k;
  m.innerHTML="<div class='etab-mt'>"+col.lb+"</div>"
    +"<button onclick=\"ordEmp('"+k+"',1)\"><i class='ti ti-sort-ascending'></i>"+lA+"</button>"
    +"<button onclick=\"ordEmp('"+k+"',-1)\"><i class='ti ti-sort-descending'></i>"+lZ+"</button>"
    +(col.fixa?"":"<button onclick=\"ocultarCol('"+k+"')\"><i class='ti ti-eye-off'></i>Ocultar esta coluna</button>")
    +"<div class='etab-msep'></div>"
    +"<div class='etab-mt'>Filtrar valores</div>"
    +"<input type='text' placeholder='Pesquisar...' oninput='filtMenuVals(this.value)' class='etab-mbusca'/>"
    +"<label class='etab-mchk tudo'><input type='checkbox' id='etab-tudo' "+(!sel?"checked":"")+" onchange='marcarTodosMenu(this.checked)'/>(Selecionar tudo)</label>"
    +"<div class='etab-mvals'>"+lv.map(function(v){
      return "<label class='etab-mchk' data-v='"+esc(v.toLowerCase())+"'><input type='checkbox' value='"+esc(v)+"' "+(!sel||sel.indexOf(v)>=0?"checked":"")+"/>"+(v===""?"<i style='color:#999'>(Vazias)</i>":esc(v))+"</label>";
    }).join("")+"</div>"
    +"<div class='etab-mft'><button class='btng' onclick='fecharColMenu()'>Cancelar</button><button class='btnp' onclick=\"aplicarFiltroCol('"+k+"')\">OK</button></div>";
  document.body.appendChild(m);
  var r=ev.currentTarget.getBoundingClientRect(),w=260;
  m.style.left=Math.max(8,Math.min(r.left,window.innerWidth-w-8))+"px";
  m.style.top=Math.min(r.bottom+4,window.innerHeight-Math.min(m.offsetHeight,window.innerHeight-16)-8)+"px";
}
document.addEventListener("mousedown",function(ev){var m=document.getElementById("etab-menu");if(m&&!m.contains(ev.target))fecharColMenu();});

function filtMenuVals(q){q=(q||"").toLowerCase();document.querySelectorAll("#etab-menu .etab-mvals .etab-mchk").forEach(function(l){l.style.display=l.dataset.v.indexOf(q)>=0?"":"none";});}
function marcarTodosMenu(on){document.querySelectorAll("#etab-menu .etab-mvals input").forEach(function(i){if(i.parentNode.style.display!=="none")i.checked=on;});}
function aplicarFiltroCol(k){

function setCCInline(id,v){

// Datas digitadas direto na tabela (admissao / aniversario)
function setDataInline(id,k,el){
  var v=el.value||"",e=DB.emp.find(function(x){return x.id===id;});if(!e)return;
  if(k==="adm"&&v&&e.dem&&v>e.dem){alert("A admissao nao pode ser posterior a demissao ("+fmtD(e.dem)+").");el.value=e.adm||"";return;}
  if(k==="adm"&&!v&&e.adm){if(!confirm("Remover a data de admissao?")){el.value=e.adm;return;}}
  DB.emp=DB.emp.map(function(x){return x.id===id?Object.assign({},x,(function(){var o={};o[k]=v;return o;})()):x;});
  dbSave();
  // atualiza "tempo de empresa" na mesma linha
  if(k==="adm"){var td=el.closest("tr"),ix=empColsVis().findIndex(function(c){return c.k==="tempo";});
    if(td&&ix>=0&&td.children[ix])td.children[ix].textContent=v?tEmp(v,e.dem):"";}
}
// Valor digitado direto na tabela: salva e recalcula 1/3 ferias, 13o e custo mensal
// Formato contabil R$ nos campos editaveis da tabela de colaboradores
function parseBRL(t){t=String(t==null?"":t).replace(/R\$|\s/g,"");if(t==="")return NaN;if(t.indexOf(",")>=0)t=t.replace(/\./g,"").replace(",",".");return parseFloat(t);}
function fmtNum(v){return (+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function brlFocus(el){var n=parseBRL(el.value);el.value=isNaN(n)?"":fmtNum(n);setTimeout(function(){try{el.select();}catch(e){}},0);}
function pctBlur(el){var n=parseBRL(String(el.value).replace("%",""));el.value=isNaN(n)?"":pct2(n);}
function brlBlur(el){var n=parseBRL(el.value);el.value=isNaN(n)?"":fmtBRL(n);}
function setValInline(id,key,v){
  var t=(v||"").toString().replace("%","").trim(),s=t===""?null:parseBRL(t);
  if(s!==null&&(isNaN(s)||s<0)){alert("Informe um valor valido.");return;}
  var emp=null,mm=empCtx==="cad"?empMesSel():curMes();
  DB.emp=DB.emp.map(function(e){
    if(e.id!==id)return e;
    var n=Object.assign({},e);n.mv=Object.assign({},n.mv||{});
    var d=Object.assign({},n.mv[mm]||{});
    if(s===null)delete d[key];else d[key]=+s.toFixed(2);
    if(Object.keys(d).length)n.mv[mm]=d;else delete n.mv[mm];
    mvSync(n);emp=empView(n,mm);return n;
  });
  if(!emp)return;
  ["terco","dec13","custo","inss","fgts","pprod"].forEach(function(x){var el=document.getElementById("et"+x+"-"+id),val=empCampoVal(emp,x);if(!el)return;if(el.tagName==="INPUT")el.value=val===null?"":(document.activeElement===el?fmtNum(val):fmtBRL(val));else el.textContent=val===null?"":fmtBRL(val);});
  var tot={};MONEY_K.forEach(function(x){tot[x]=0;});
  empListaVisivel().forEach(function(e){if(isAtivo(e))MONEY_K.forEach(function(x){tot[x]+=empCampoVal(e,x)||0;});});
  MONEY_K.forEach(function(x){var el=document.getElementById("ettot-"+x);if(el)el.textContent=fmtBRL(tot[x]);});
  dbSave();
}
function setEncInline(id,k,v){
  var tx=(v||"").toString().trim(),s=tx===""?null:parseBRL(tx);
  if(s!==null&&(isNaN(s)||s<0)){alert("Informe um valor valido.");return;}
  var e=DB.emp.find(function(x){return x.id===id;});if(!e)return;
  var mm=empCtx==="cad"?empMesSel():curMes(),ev=empView(e,mm);
  // valor igual ao automatico = volta para automatico
  if(s!==null&&Math.abs(s-encAuto(ev,k))<0.005)s=null;
  DB.emp=DB.emp.map(function(x){if(x.id!==id)return x;var n=Object.assign({},x);n.mv=Object.assign({},n.mv||{});
    var d=Object.assign({},n.mv[mm]||{});if(s===null)delete d[k+"Man"];else d[k+"Man"]=+s.toFixed(2);
    if(Object.keys(d).length)n.mv[mm]=d;else delete n.mv[mm];mvSync(n);return n;});
  filtEmp();dbSave();
}

function empVinc(e){return e&&e.vinc==="MEI"?"MEI":"CLT";}
function isMEI(e){return empVinc(e)==="MEI";}
// Salario mensal: MEI por hora = valor da hora x horas no mes
function salMensal(e){if(!e||typeof e.sal!=="number")return 0;if(isMEI(e)&&e.meiTipo==="hora")return +(e.sal*(+e.meiHoras||220)).toFixed(2);return e.sal;}
// Encargos sobre salario + adicional (CLT). Valor manual (inssMan/fgtsMan) substitui o automatico
// Configuracao editavel na tela "Encargos INSS/FGTS" (guardada junto dos Indices, registro cfg_enc)
var ENC_DEF={inss:20,rat:0,terc:0,fgts:8,bAdic:true,bHE:true,bPP:true,bMetas:false,bProv:false,mei:false};
function encCfg(){var r=(DB.idx||[]).find(function(x){return x.id==="cfg_enc";});return Object.assign({},ENC_DEF,r&&r.cfg?r.cfg:{});}
function encPct(k,c){c=c||encCfg();return k==="inss"?(+c.inss||0)+(+c.rat||0)+(+c.terc||0):(+c.fgts||0);}
function encBase(e,c){
  c=c||encCfg();
  if(isMEI(e)&&!c.mei)return 0;
  var s=salMensal(e),ad=c.bAdic?(+e.adic||0):0,b=s+ad;
  if(c.bHE)b+=+e.hextra||0;
  if(c.bPP)b+=pprodVal(e);
  if(c.bMetas)b+=+e.pmetas||0;
  if(c.bProv&&!isMEI(e)){var x=calcSal(s+ad);b+=(x.terco+x.dec13)/12;}
  return +b.toFixed(2);
}
function encAuto(e,k,c){c=c||encCfg();return +(encBase(e,c)*encPct(k,c)/100).toFixed(2);}
function encVal(e,k){var m=e[k+"Man"];return typeof m==="number"?m:encAuto(e,k);}
function encManual(e,k){return typeof e[k+"Man"]==="number";}
function meiPgto(e){return isMEI(e)&&e.meiTipo==="hora"?"HORA ("+(+e.meiHoras||220)+"h)":"MENSAL";}
function vincBdg(e){return empVinc(e)==="MEI"?"<span class='bdg bdg-mei' title='Prestador de servico MEI'>MEI</span>":"<span class='bdg bdg-clt' title='Contratado CLT'>CLT</span>";}

// REAJUSTE SALARIAL (sindicato ou espontaneo)
// Cada reajuste grava o salario anterior e o novo, e atualiza o cadastro
// (1/3 ferias, 13o e custo empresa mensal sao recalculados).

var REAJ_TIPOS={sindicato:{lb:"Sindicato",co:"#1f5fa8",bg:"#e3eefa",ic:"ti-building-community"},espontaneo:{lb:"Espontaneo",co:"#1a7a4a",bg:"#e4f4ea",ic:"ti-hand-click"}};
var rjTipo="sindicato",rjForma="pct",rjSel=[];
function rjEmp(id){return DB.emp.find(function(e){return e.id===id;});}
function rjNovo(ant,forma,v){
  if(forma==="pct")return +(ant*(1+v/100)).toFixed(2);
  if(forma==="add")return +(ant+v).toFixed(2);
  return +(+v).toFixed(2);
}
function rReaj(){
  if(!DB.reaj)DB.reaj=[];

  var lista=DB.reaj.filter(function(r){
    if(selAno!=="todos"&&r.data.slice(0,4)!==selAno)return false;
    if(selTipo&&r.tipo!==selTipo)return false;
    var e=rjEmp(r.eid);
    return !q||(e&&(e.nome.toLowerCase().includes(q)||(e.empresa||"").toLowerCase().includes(q)||(e.func||"").toLowerCase().includes(q)))||(r.motivo||"").toLowerCase().includes(q);
  }).sort(function(a,b){return b.data.localeCompare(a.data)||(b.criado||"").localeCompare(a.criado||"");});
  var nS=lista.filter(function(r){return r.tipo==="sindicato";}).length,nE=lista.length-nS;
  var dif=lista.reduce(function(a,r){return a+(r.novo-r.ant);},0);

    "<div class='etab-wrap' style='max-height:calc(100vh - 330px)'><table class='etab' style='min-width:1050px'><thead><tr>"
    +"<th style='cursor:default'>DATA</th><th style='cursor:default'>FUNCIONÁRIO</th><th style='cursor:default'>CATEGORIA</th><th class='c' style='cursor:default'>FUNÇÃO</th>"
    +"<th class='c' style='cursor:default'>TIPO</th><th style='cursor:default'>MOTIVO</th><th class='c' style='cursor:default'>SALÁRIO ANTERIOR</th>"
    +"<th class='c' style='cursor:default'>%</th><th class='c' style='cursor:default'>NOVO SALÁRIO</th><th class='c' style='cursor:default'>DIFERENÇA</th><th class='c' style='cursor:default'>AÇÕES</th></tr></thead><tbody>"
    +lista.map(function(r){
      var e=rjEmp(r.eid),t=REAJ_TIPOS[r.tipo]||REAJ_TIPOS.espontaneo,p=r.ant>0?(r.novo/r.ant-1)*100:0;
      return "<tr><td>"+fmtD(r.data)+"</td><td class='nm'>"+(e?esc(e.nome):"<i style='color:#999'>removido</i>")+"</td>"
        +"<td>"+(e?esc(e.empresa||""):"")+"</td><td class='c'>"+(e?esc(e.func||""):"")+"</td>"
        +"<td class='c'><span class='bdg' style='background:"+t.bg+";color:"+t.co+"'>"+t.lb.toUpperCase()+"</span></td>"
        +"<td style='white-space:normal'>"+esc(r.motivo||"")+(r.obs?"<div style='font-size:11px;color:#999'>"+esc(r.obs)+"</div>":"")+"</td>"
        +"<td class='r'>"+fmtBRL(r.ant)+"</td><td class='r' style='font-weight:700;color:"+(p>=0?GRN:RED)+"'>"+pct1(p)+"</td>"
        +"<td class='r' style='font-weight:800;color:"+B+"'>"+fmtBRL(r.novo)+"</td><td class='r' style='color:"+(r.novo>=r.ant?GRN:RED)+"'>"+(r.novo>=r.ant?"+":"")+fmtBRL(r.novo-r.ant)+"</td>"
        +"<td class='act'><button class='ibdel' title='Excluir reajuste' onclick=\"delReaj('"+r.id+"')\"><i class='ti ti-trash'></i></button></td></tr>";
    }).join("")+"</tbody></table></div>";
  document.getElementById("p-reajustes").innerHTML=
    "<div class='pg-hd'><div><h1 class='h1'>Reajuste Salarial</h1><div class='sub'>Historico de reajustes por sindicato ou espontaneos</div></div>"
    +"<button class='btnp btn-ic' onclick='novoReaj()'><i class='ti ti-plus'></i>Novo reajuste</button></div>"
    +"<div class='ga' style='margin-bottom:1rem'>"
    +sCard("Reajustes no periodo",lista.length,B,"ti-trending-up",selAno==="todos"?"todos os anos":selAno)
    +sCard("Por sindicato",nS,"#1f5fa8","ti-building-community","dissidio / acordo")
    +sCard("Espontaneos",nE,GRN,"ti-hand-click","merito / promocao")
    +sCard("Aumento na folha (mes)",fmtBRL(dif),BL,"ti-cash","soma das diferencas")
    +sCard("Reajuste medio",pct1(pctMed),GLD,"ti-percentage","media dos reajustes")
    +"</div>"
    +"<div class='card'>"
    +"<div style='display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:.75rem'>"
    +"<select id='rj-ano' onchange='rReaj()' style='"+selSt+"'><option value='todos'"+(selAno==="todos"?" selected":"")+">Todos os anos</option>"+Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("")+"</select>"

}
function updReajPrev(){
  var lb=document.getElementById("rj-vlb");if(lb)lb.textContent={pct:"Percentual (%)",add:"Acrescimo (R$)",novo:"Novo salario (R$)"}[rjForma];
  var el=document.getElementById("rj-prev");if(!el)return;
  var t=gv("rj-val").trim(),v=t===""?NaN:parseFloat(t.replace(",","."));
  if(!rjSel.length){el.innerHTML="<div class='hint' style='margin-bottom:.5rem'>Marque os colaboradores que recebem o reajuste. Quem esta sem salario cadastrado nao pode ser marcado.</div>";return;}
  var tA=0,tN=0;
  var linhas=rjSel.map(rjEmp).filter(Boolean).map(function(e){
    var n=isNaN(v)?null:rjNovo(e.sal,rjForma,v);tA+=e.sal;tN+=n===null?e.sal:n;
    return "<tr><td class='nm'>"+esc(e.nome)+"</td><td class='r'>"+fmtBRL(e.sal)+"</td><td class='r' style='font-weight:800;color:"+B+"'>"+(n===null?"—":fmtBRL(n))+"</td><td class='r' style='color:"+GRN+"'>"+(n===null?"":"+"+fmtBRL(n-e.sal))+"</td></tr>";
  }).join("");
  el.innerHTML="<div style='font-weight:700;font-size:13px;color:"+B+";margin:.25rem 0 .4rem'>Previa: "+rjSel.length+" colaborador"+(rjSel.length>1?"es":"")+"</div>"
    +"<div class='etab-wrap' style='max-height:180px'><table class='etab'><thead><tr><th style='cursor:default'>FUNCIONÁRIO</th><th class='c' style='cursor:default'>ATUAL</th><th class='c' style='cursor:default'>NOVO</th><th class='c' style='cursor:default'>DIFERENÇA</th></tr></thead><tbody>"+linhas+"</tbody>"
    +"<tfoot><tr><td>TOTAL MENSAL</td><td class='r'>"+fmtBRL(tA)+"</td><td class='r'>"+fmtBRL(tN)+"</td><td class='r'>+"+fmtBRL(tN-tA)+"</td></tr></tfoot></table></div>";
}
function savReaj(){
  var mot=gv("rj-mot").trim(),data=gv("rj-data"),obs=gv("rj-obs").trim();
  var t=gv("rj-val").trim(),v=t===""?NaN:parseFloat(t.replace(",","."));
  if(!rjSel.length){alert("Marque ao menos um colaborador.");return;}
  if(!mot){alert("Informe o motivo / descricao do reajuste.");return;}
  if(!data){alert("Informe a data de vigencia.");return;}
  if(isNaN(v)||v<=0){alert("Informe um valor de reajuste valido.");return;}
  var lote=uid(),criado=new Date().toISOString(),regs=[];
  rjSel.forEach(function(id){
    var e=rjEmp(id);if(!e||typeof e.sal!=="number")return;
    regs.push({id:uid(),lote:lote,eid:id,data:data,tipo:rjTipo,motivo:mot,obs:obs,forma:rjForma,valor:v,ant:e.sal,novo:rjNovo(e.sal,rjForma,v),criado:criado});
  });
  if(regs.some(function(r){return r.novo<r.ant;})&&!confirm("Algum novo salario ficou menor que o atual. Continuar?"))return;
  if(!confirm("Aplicar reajuste ("+REAJ_TIPOS[rjTipo].lb+") para "+regs.length+" colaborador"+(regs.length>1?"es":"")+"?\nO salario no cadastro sera atualizado."))return;
  regs.forEach(function(r){aplicarSalEmp(r.eid,r.novo,r.data);});
  DB.reaj=(DB.reaj||[]).concat(regs);
  dbSave();fecharReaj();rReaj();
}
// Atualiza salario e recalcula 1/3, 13o e custo
function aplicarSalEmp(id,sal,data){
  DB.emp=DB.emp.map(function(e){
    if(e.id!==id)return e;
    var n=Object.assign({},e),c=isMEI(e)?{terco:0,dec13:0}:calcSal(sal);n.sal=sal;n.terco=c.terco;n.dec13=c.dec13;n.custo=calcCusto(n);
    if(n.mv&&data){ // meses lancados a partir do reajuste recebem o novo salario
      var dm=gmk(data),mv=Object.assign({},n.mv),ks=Object.keys(mv).sort(),alg=false;
      ks.forEach(function(m){if(m>=dm){mv[m]=Object.assign({},mv[m],{sal:sal});alg=true;}});
      if(!alg){var prev=ks.filter(function(m){return m<dm;}).pop();mv[dm]=Object.assign({},prev?mv[prev]:{},{sal:sal});}
      n.mv=mv;mvSync(n);
    }
    return n;
  });
}
function delReaj(id){
  var r=(DB.reaj||[]).find(function(x){return x.id===id;});if(!r)return;
  var e=rjEmp(r.eid);
  var volta=e&&typeof e.sal==="number"&&Math.abs(e.sal-r.novo)<0.005;
  var msg="Excluir este reajuste?"+(volta?"\n\nO salario de "+e.nome+" volta para "+fmtBRL(r.ant)+".":"\n\nO salario atual nao sera alterado (ja foi modificado depois deste reajuste).");
  if(!confirm(msg))return;
  if(volta)aplicarSalEmp(r.eid,r.ant,r.data);
  DB.reaj=DB.reaj.filter(function(x){return x.id!==id;});
  dbSave();rReaj();
}

function savGrupo(){

  else{var mx=DB.grupos.reduce(function(a,g){return Math.max(a,g.ord||0);},0);DB.grupos.push({id:uid(),nome:nome,tipo:tipo,ord:mx+1});}

function delGrupo(id){
  var g=DB.grupos.find(function(x){return x.id===id;});if(!g)return;
  var n=DB.emp.filter(function(e){return e.grupo===id;}).length;
  if(!confirm("Excluir o C.C. Infomódulus "+g.nome+"?"+(n?"\n\n"+n+" colaborador"+(n>1?"es ficarao":" ficara")+" sem C.C. Infomódulus.":"")))return;
  DB.grupos=DB.grupos.filter(function(x){return x.id!==id;});
  DB.emp=DB.emp.map(function(e){if(e.grupo!==id)return e;var o=Object.assign({},e);delete o.grupo;return o;});
  dbSave();rGrupos();
}
function moverGrupo(id,d){
  var gs=gruposOrd(),g=gs.find(function(x){return x.id===id;}),irm=gs.filter(function(x){return x.tipo===g.tipo;});
  var i=irm.indexOf(g),j=i+d;if(j<0||j>=irm.length)return;
  irm.splice(i,1);irm.splice(j,0,g);
  irm.forEach(function(x,k){x.ord=k+1;});
  dbSave();rGrupos();
}
